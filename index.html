nce over charged assets","Release of security and its authorisation"],"procedures":["Test perfection evidence for a sample of secured exposures, including registration at the relevant registry.","Test valuation currency against policy and re-perform loan-to-value calculations.","Test valuer independence and panel rotation.","Test that insurance over charged assets is current and the bank is noted as interested party."],"red_flags":["Charges unregistered or registered late","Valuations years out of date on volatile asset classes","Same valuer used for all exposures to one borrower","Insurance lapsed on charged property"],"evidence":["Collateral register and legal files","Registry search results","Valuation reports","Insurance certificates"],"kpis":["Exposures with perfected security","Valuations within policy age","LTV breaches actioned"],"lens":["ia"],"plain":"Security is what the bank falls back on when a loan goes bad. If it was never registered properly or is worth less than recorded, that fallback is not there."},{"id":"IA-BNK-07","industry":["banking"],"process":"Credit & Lending","subprocess":"Covenant Monitoring","risk":"Borrower covenant breaches are not detected, so deterioration is not acted on and the bank loses its intervention rights.","rating":"High","risk_category":"Financial","audit_objective":"Confirm borrower covenants are monitored and breaches escalated and acted upon.","what_to_review":["Completeness of covenants captured from agreements","Receipt and review of borrower financial information","Timeliness of covenant testing after each reporting date","Waiver and amendment authority","Link between breach and risk grading or staging"],"procedures":["Recompute covenants for a sample of borrowers from their submitted financials.","Test whether borrower information was received on time and chased when late.","Test waivers granted for authorisation at the correct level and for whether pricing or security was adjusted.","Test whether breaches fed through to risk grading."],"red_flags":["Waivers granted routinely to the same borrowers","Financial information outstanding for months","Covenants recomputed only at year end","Breaches with no effect on grading"],"evidence":["Facility agreements","Borrower financial submissions","Covenant testing records","Waiver approvals"],"kpis":["Covenants tested on time","Waivers granted","Breaches reflected in grading"],"lens":["ia"],"plain":"Loan agreements contain promises the borrower must keep. Nobody checking them means the bank misses the early warning that the borrower is in trouble."},{"id":"IA-BNK-08","industry":["banking"],"process":"Credit & Lending","subprocess":"Problem Loan and Watchlist Management","risk":"Deteriorating exposures are not moved to specialist management early enough, reducing recovery.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether early warning indicators work and problem exposures are managed by the right people.","what_to_review":["Early warning indicator design, coverage and response","Watchlist criteria and transfer to specialist workout","Independence of workout from origination","Recovery strategies and their execution","Provisioning alignment with the workout view"],"procedures":["Test whether early warning indicators triggered and what happened when they did.","Compare the date deterioration was observable in data to the date the exposure was watchlisted.","Test that workout management is independent of the originating relationship manager.","Compare recovery outcomes to strategies agreed at transfer."],"red_flags":["Exposures watchlisted only once past due","Relationship managers retaining problem exposures","Indicators triggering with no recorded response","Recovery strategies never revisited"],"evidence":["Early warning reports","Watchlist and transfer records","Workout files","Recovery outcomes"],"kpis":["Time from indicator to watchlist","Exposures in workout","Recovery rate"],"lens":["ia"],"plain":"The earlier a struggling borrower is handed to specialists, the more money the bank gets back."},{"id":"IA-BNK-09","industry":["banking"],"process":"Credit & Lending","subprocess":"Credit Risk Models and Rating Integrity","risk":"Internal ratings and credit models are inaccurate or overridden, understating risk and regulatory capital.","rating":"High","risk_category":"Financial","audit_objective":"Assess the integrity, validation and use of internal credit ratings and models.","what_to_review":["Model development, validation and approval governance","Rating override frequency, direction and justification","Data quality feeding models","Back-testing of predicted against actual default","Use test — whether ratings actually drive decisions and pricing"],"procedures":["Analyse rating overrides by direction and originator; overrides consistently improving ratings warrant testing.","Review validation reports and test whether findings were remediated.","Back-test rating performance against realised defaults.","Test whether ratings genuinely drive pricing and approval, or are produced after the decision."],"red_flags":["Overrides almost always upward","Validation findings open across cycles","Models unchanged despite deteriorating performance","Ratings assigned after the credit decision"],"evidence":["Model documentation and validation reports","Rating and override data","Default history","Pricing records"],"kpis":["Override rate and direction","Validation findings open","Back-test accuracy"],"lens":["ia"],"plain":"Ratings drive how much the loan costs and how much capital the bank must hold. Inflated ratings make the bank look safer than it is."},{"id":"IA-BNK-10","industry":["banking"],"process":"Credit & Lending","subprocess":"Concentration and Large Exposures","risk":"Exposure concentrations breach regulatory or internal limits because connected counterparties are not grouped correctly.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm exposures are aggregated correctly and remain within limits.","what_to_review":["Connected counterparty identification and grouping","Aggregation across products, entities and geographies","Regulatory large exposure limits and internal appetite","Sector, geographic and collateral concentration","Breach identification and escalation"],"procedures":["Test the grouping of connected counterparties against ownership and control data.","Recompute large exposures against regulatory limits at several dates.","Analyse concentration by sector and geography against appetite.","Test escalation of breaches and whether limits were raised rather than exposures reduced."],"red_flags":["Connected borrowers treated as unrelated","Exposure aggregation excluding off-balance sheet commitments","Limits raised immediately after a breach","Concentration reported only at year end"],"evidence":["Exposure data by counterparty and group","Ownership and control information","Limit framework","Breach records"],"kpis":["Exposures over limit","Groups correctly aggregated","Breach escalations"],"lens":["ia"],"plain":"Lending too much to one customer, or several linked ones, means a single failure can hurt the whole bank. Regulators cap this for good reason."},{"id":"IA-BNK-11","industry":["banking"],"process":"Financial Crime","subprocess":"Customer Due Diligence and Risk Rating","risk":"Customer risk is rated incorrectly at onboarding, so the level of due diligence and monitoring applied is wrong from the start.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm customer risk rating drives due diligence and is refreshed as behaviour changes.","what_to_review":["Risk rating methodology and its factors","Enhanced due diligence for high-risk customers and PEPs","Beneficial ownership identification and verification","Periodic review cycles by risk tier","Rating overrides and who may make them"],"procedures":["Sample customers across risk tiers and test that due diligence matches the rating applied.","Test beneficial ownership identification for corporate customers, including layered structures.","Test rating overrides for approval and rationale.","Quantify overdue periodic reviews and test whether high-risk customers continued transacting."],"red_flags":["Ratings downgraded to avoid enhanced due diligence","Beneficial ownership recorded as the immediate holder only","Periodic reviews overdue on the highest-risk customers","Overrides made by relationship staff"],"evidence":["Customer files and risk ratings","Beneficial ownership records","Periodic review reports","Override logs"],"kpis":["EDD completed for high risk","Overdue reviews","Ownership verified"],"lens":["ia"],"plain":"How risky a customer is decided at the start determines how closely they are watched forever after. Getting it wrong at onboarding is a mistake that persists."},{"id":"IA-BNK-12","industry":["banking"],"process":"Financial Crime","subprocess":"Correspondent Banking and Trade Finance","risk":"Correspondent and trade finance relationships are used to move illicit funds because the underlying activity is not scrutinised.","rating":"High","risk_category":"Compliance","audit_objective":"Assess controls over higher-risk financial crime channels.","what_to_review":["Correspondent bank due diligence and Wolfsberg-style questionnaires","Nested and downstream relationship identification","Trade document review for dual-use goods and price manipulation","Sanctions screening on trade parties, vessels and ports","Country and product risk assessment"],"procedures":["Test correspondent due diligence currency and whether nested relationships were identified.","Sample trade transactions and test document review for over- or under-invoicing and dual-use goods.","Test vessel and port screening on shipping documents.","Test whether high-risk corridors receive additional scrutiny."],"red_flags":["Correspondent questionnaires years old","Nested relationships discovered by the regulator","Trade documents reviewed for form only","Vessels not screened"],"evidence":["Correspondent due diligence files","Trade transaction files and documents","Screening records","Country risk assessments"],"kpis":["Correspondents with current DD","Trade files with substantive review","Screening coverage"],"lens":["ia"],"plain":"Trade finance and correspondent banking move money across borders in ways that are hard to see through, which is exactly why criminals use them."},{"id":"IA-BNK-13","industry":["banking"],"process":"Financial Crime","subprocess":"Fraud Detection and Customer Protection","risk":"Customers are defrauded through account takeover, authorised push payment scams or card fraud, and the bank bears loss and censure.","rating":"High","risk_category":"Fraud","audit_objective":"Assess the effectiveness of fraud prevention, detection and customer reimbursement.","what_to_review":["Authentication and step-up controls for payments and account changes","Fraud detection rules, machine learning models and their tuning","Confirmation of payee and scam warnings","Reimbursement decisions and their consistency","Mule account detection"],"procedures":["Analyse fraud losses by type and channel and test whether controls were adjusted after each pattern emerged.","Test authentication for high-risk actions such as payee changes and device registration.","Review reimbursement decisions for consistency with the regulatory standard.","Test mule account detection — accounts receiving and rapidly dispersing funds."],"red_flags":["Losses rising in a channel with no rule change","Reimbursement declined inconsistently","Mule accounts identified only after victim reports","Step-up authentication bypassable through a channel"],"evidence":["Fraud loss data by type","Detection rule configuration","Reimbursement decisions","Mule account investigations"],"kpis":["Fraud loss rate","Detection rate before customer report","Reimbursement consistency"],"lens":["ia"],"plain":"When customers are defrauded, the bank often has to reimburse them, and regulators judge how well it protected them."},{"id":"IA-BNK-14","industry":["banking"],"process":"Financial Crime","subprocess":"Anti-Bribery, Corruption and Tax Evasion Facilitation","risk":"The bank facilitates bribery or tax evasion through its customers or its own conduct, triggering corporate criminal liability.","rating":"High","risk_category":"Compliance","audit_objective":"Assess the adequacy of procedures to prevent facilitation of financial crime by staff and associates.","what_to_review":["Risk assessment for bribery and facilitation of tax evasion","Gifts, hospitality and political donation controls","Third-party intermediaries and introducer arrangements","Training for high-risk roles","Investigation and reporting of suspected facilitation"],"procedures":["Test the bribery and facilitation risk assessment for coverage of the actual business model.","Review the gifts and hospitality register for completeness and approval of high-value items.","Test due diligence on introducers and intermediaries and the basis of their remuneration.","Test training completion for high-risk and client-facing roles."],"red_flags":["Introducers paid success fees with no due diligence","Gifts register with implausibly few entries","Risk assessment not covering key jurisdictions","Training completion low in front-office roles"],"evidence":["Risk assessments","Gifts and hospitality register","Introducer agreements and payments","Training records"],"kpis":["High-risk roles trained","Introducers with due diligence","Register entries vs. expectation"],"lens":["ia"],"plain":"Companies can be prosecuted for failing to prevent bribery or tax evasion by people acting for them, even if senior management knew nothing."},{"id":"IA-BNK-15","industry":["banking"],"process":"Deposits & Payments","subprocess":"Branch and Cash Operations","risk":"Cash and negotiable instruments are misappropriated at branches through teller manipulation or vault control failure.","rating":"High","risk_category":"Fraud","audit_objective":"Assess physical and procedural controls over cash and instruments in branch operations.","what_to_review":["Teller limits, cash-outs and end-of-day balancing","Vault dual control and access logging","Surprise cash counts and their independence","Suspense and difference accounts at branch level","Negotiable instrument stock control"],"procedures":["Perform surprise cash counts at a sample of branches and agree to records.","Analyse teller differences by individual — small persistent differences can indicate skimming.","Test vault access logs for single-person access events.","Review branch suspense accounts for aged items."],"red_flags":["Recurring small teller differences by the same person","Vault accessed by one person","Surprise counts announced in advance","Suspense items cleared just before a count"],"evidence":["Cash records and teller balancing reports","Vault access logs","Surprise count records","Branch suspense accounts"],"kpis":["Teller difference frequency","Surprise counts performed","Aged suspense items"],"lens":["ia"],"plain":"Branches hold physical cash, and small amounts taken repeatedly add up long before anyone notices."},{"id":"IA-BNK-16","industry":["banking"],"process":"Deposits & Payments","subprocess":"Payment Operations and Settlement","risk":"Payments fail, settle late or are duplicated, causing customer loss, liquidity impact and regulatory breach.","rating":"High","risk_category":"Operational","audit_objective":"Assess controls over payment processing, settlement and exception handling.","what_to_review":["Straight-through processing rates and manual repair volumes","Cut-off times, settlement finality and liquidity management","Duplicate and erroneous payment detection and recovery","Payment scheme rules compliance","Resilience of payment channels and contingency arrangements"],"procedures":["Analyse manual repair volumes and who performs them; manual intervention is where error and fraud enter.","Test duplicate payment detection and the recovery of identified duplicates.","Test compliance with scheme rules on timing and messaging standards.","Review payment incidents and test whether root causes were remediated."],"red_flags":["High manual repair rates in one channel","Repairs performed by the same person who inputs","Duplicates identified by customers rather than the bank","Recurring incidents with the same cause"],"evidence":["Payment processing data","Repair and exception logs","Incident records","Scheme compliance reporting"],"kpis":["STP rate","Manual repairs","Payment incidents"],"lens":["ia"],"plain":"When payments fail or duplicate, customers lose money and the bank has to make it good, on top of the regulatory attention."},{"id":"IA-BNK-17","industry":["banking"],"process":"Deposits & Payments","subprocess":"Customer Complaints and Conduct","risk":"Complaints are not identified, investigated fairly or used to detect systemic customer harm.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether complaint handling is fair, timely and drives correction of root causes.","what_to_review":["Complaint identification — including expressions of dissatisfaction not logged as complaints","Investigation quality, timeliness and outcome fairness","Root cause analysis and systemic issue identification","Redress calculation and delivery","Ombudsman referrals and overturn rates"],"procedures":["Sample closed complaints and reassess whether the outcome was fair on the facts.","Test whether complaints are being logged at first point of contact or filtered out.","Test whether root causes were identified and remediated, including proactive redress for similarly affected customers.","Analyse ombudsman overturn rates as an indicator of internal decision quality."],"red_flags":["Complaints resolved verbally and never logged","High ombudsman overturn rate","Redress paid only to those who complained","Root cause recorded as \"customer misunderstanding\""],"evidence":["Complaint records and case files","Ombudsman decisions","Root cause analyses","Redress calculations"],"kpis":["Complaints per 1,000 customers","Ombudsman overturn rate","Systemic issues identified"],"lens":["ia"],"plain":"Complaints are the cheapest early warning a bank gets. Ignoring them turns one customer's problem into a redress bill for thousands."},{"id":"IA-BNK-18","industry":["banking"],"process":"Deposits & Payments","subprocess":"Product Governance and Customer Outcomes","risk":"Products are sold to customers for whom they are unsuitable, or perform differently from what was represented.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether products are designed, targeted and monitored for good customer outcomes.","what_to_review":["Product approval process and target market definition","Distribution against the intended target market","Fair value assessment and pricing","Post-sale monitoring of customer outcomes","Vulnerable customer identification and treatment"],"procedures":["Test sales data against the defined target market and quantify sales outside it.","Review the fair value assessment for products with high margin or low usage.","Test outcome monitoring — cancellation rates, complaints, claims declined — for signals of poor outcomes.","Test identification and treatment of vulnerable customers in the sales process."],"red_flags":["Products sold well outside the target market","Fair value assessments concluding value in every case","High early cancellation rates unexplained","Vulnerability flags not visible to front-line staff"],"evidence":["Product approval documentation","Sales and distribution data","Fair value assessments","Outcome monitoring reports"],"kpis":["Sales outside target market","Early cancellation rate","Vulnerable customers identified"],"lens":["ia"],"plain":"Selling a product to someone it was never designed for eventually means paying them back, often years later and with interest."},{"id":"IA-TP-01","industry":["cross"],"process":"Third Party Management","subprocess":"Third Party Inventory and Risk Tiering","risk":"The organisation does not know who its third parties are or which matter, so oversight is applied to the wrong ones.","rating":"High","risk_category":"Strategic","audit_objective":"Confirm third parties are identified completely and tiered by the risk they present.","what_to_review":["Completeness of the third-party register against payments and system access","Criticality and risk tiering methodology","Fourth-party and subcontracting visibility","Ownership of each relationship inside the business","Refresh of tiering when the service changes"],"procedures":["Build an independent third-party inventory from accounts payable and system access data and compare it to the register.","Test the tiering of a sample against the methodology; challenge any critical service tiered low.","Test whether subcontracting by key providers is known and permitted by contract.","Test that each relationship has a named business owner."],"red_flags":["Providers paid regularly but absent from the register","Critical services tiered as low risk","No knowledge of who the provider subcontracts to","Relationships with no owner since the manager left"],"evidence":["Accounts payable vendor data","Third-party register and tiering","System access listings","Contracts"],"kpis":["Providers not in register","Critical providers tiered","Relationships with named owner"],"lens":["ia"],"plain":"You cannot manage suppliers you do not know you have, and most companies have more than they think."},{"id":"IA-TP-02","industry":["cross"],"process":"Third Party Management","subprocess":"Due Diligence and Onboarding","risk":"Third parties are engaged without checks on their financial health, integrity or capability, and problems surface only after dependency exists.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm due diligence is performed before engagement and is proportionate to risk.","what_to_review":["Due diligence scope by risk tier — financial, sanctions, integrity, capability","Timing — before contract signature or after","Sanctions, anti-bribery and modern slavery screening","Site visits or technical assessment for critical providers","Refresh of due diligence during the relationship"],"procedures":["Test that due diligence was completed before contract signature for a sample of engagements.","Test screening evidence for sanctions and adverse media on critical providers.","Test the currency of due diligence for long-standing relationships.","Assess whether financial health of critical providers is monitored, not just checked once."],"red_flags":["Due diligence dated after the contract","Long relationships never re-assessed","Screening limited to a search engine query","Financial distress at a provider discovered from the news"],"evidence":["Due diligence files","Screening records","Contracts and signature dates","Financial monitoring records"],"kpis":["DD before signature %","Critical providers refreshed","Screening completed"],"lens":["ia"],"plain":"Checking a supplier after you depend on them is too late to do anything about what you find."},{"id":"IA-TP-03","industry":["cross"],"process":"Third Party Management","subprocess":"Contracting and Commercial Terms","risk":"Contracts omit the protections the organisation needs, so there is no remedy when the provider fails.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm contracts contain the terms required for the risk the provider carries.","what_to_review":["Presence of service levels, remedies and service credits","Audit and inspection rights","Data protection, confidentiality and security obligations","Liability caps, indemnities and insurance requirements","Termination, exit assistance and transition obligations"],"procedures":["Review contracts for critical providers against a required-terms checklist and quantify gaps.","Test whether spend is occurring under expired or absent contracts.","Test whether liability caps are proportionate to the exposure the service creates.","Test whether audit rights have ever been exercised."],"red_flags":["Material spend with no signed contract","Liability capped at one month of fees for a critical service","Auto-renewal with no review point","Audit rights present but never used"],"evidence":["Contract register and agreements","Spend analysis","Insurance certificates","Renewal records"],"kpis":["Spend under contract %","Contracts with audit rights","Expired contracts still active"],"lens":["ia"],"plain":"The contract is the only leverage you have when a supplier fails. Missing terms means no remedy."},{"id":"IA-TP-04","industry":["cross"],"process":"Third Party Management","subprocess":"Performance and Service Level Management","risk":"Provider performance is not measured, so service degrades and contractual remedies go unclaimed.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm provider performance is measured against contract and managed actively.","what_to_review":["Service level definition and who measures performance","Provider self-reporting versus independent measurement","Service credit and remedy claims","Governance meetings, minutes and escalation","Relationship between performance and contract renewal"],"procedures":["Test whether performance data is produced by the provider or independently verified.","Recompute service levels for a sample of periods and test whether credits due were claimed.","Review governance meeting minutes for substance and escalation of persistent failures.","Test whether poor performers were renewed regardless."],"red_flags":["Performance reported solely by the provider","Service credits never claimed","Governance meetings cancelled repeatedly","Consistently failing providers renewed"],"evidence":["Service level reports","Contracts and credit provisions","Governance minutes","Renewal decisions"],"kpis":["SLA attainment","Credits claimed vs. due","Governance meetings held"],"lens":["ia"],"plain":"If nobody measures the service, it drifts, and the credits you were owed are never claimed."},{"id":"IA-TP-05","industry":["cross"],"process":"Third Party Management","subprocess":"Assurance over Provider Controls","risk":"The organisation relies on controls operated by a third party without any evidence that they work.","rating":"High","risk_category":"IT","audit_objective":"Confirm assurance is obtained over provider controls and acted upon.","what_to_review":["Assurance strategy by tier — service auditor reports, certifications, right to audit","Review of reports received, including exceptions and qualified opinions","Complementary user entity controls and whether they are performed","Coverage gaps between report period and financial year","Escalation of adverse findings"],"procedures":["Obtain service auditor reports for critical providers; test whether anyone read them by tracing exceptions to management action.","Identify complementary user entity controls and test whether the organisation performs each.","Test the coverage period against the financial year and how gaps are addressed.","Assess reliance placed on certifications that do not cover the services actually used."],"red_flags":["Reports filed unread","Complementary controls never identified","Certification scope excluding the service used","Qualified opinions with no response"],"evidence":["Service auditor reports and certifications","Bridge letters","Complementary control testing","Management responses"],"kpis":["Critical providers with assurance","Complementary controls tested","Exceptions addressed"],"lens":["ia"],"plain":"When a supplier performs a control for you, you still have to prove it works."},{"id":"IA-TP-06","industry":["cross"],"process":"Third Party Management","subprocess":"Data Protection and Information Security","risk":"Third parties hold or access the organisation's data without adequate protection, and a breach at the provider becomes the organisation's breach.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm data shared with third parties is protected, minimised and governed.","what_to_review":["Inventory of data shared with each provider and its classification","Processor agreements and lawful basis for transfers","Security requirements imposed and verified","Provider access into the organisation's environment","Breach notification obligations and testing of the route"],"procedures":["Reconcile providers receiving personal or sensitive data to signed processor agreements.","Test the security requirements imposed on providers and any verification performed.","Test provider access accounts — authentication, privilege, monitoring and removal.","Test whether breach notification routes have been exercised or are theoretical."],"red_flags":["Data shared with no agreement in place","Provider staff with standing privileged access","Security requirements stated but never verified","No test of the breach notification path"],"evidence":["Data sharing inventory","Processor agreements","Provider access listings","Security assessment records"],"kpis":["Providers with agreements","Provider access reviewed","Security verifications performed"],"lens":["ia"],"plain":"A data breach at your supplier is reported as your data breach."},{"id":"IA-TP-07","industry":["cross"],"process":"Third Party Management","subprocess":"Concentration, Continuity and Exit","risk":"A critical provider fails and there is no alternative and no exit plan, so the disruption is unbounded.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether dependency on third parties is understood and survivable.","what_to_review":["Concentration analysis — single providers, shared fourth parties, geographic concentration","Business continuity requirements imposed and tested with the provider","Exit plans, transition assistance and data return","Substitutability of each critical provider","Testing of failover to an alternative"],"procedures":["Identify critical services with a single provider and no substitute, and test the mitigation.","Test whether continuity arrangements have been jointly exercised with the provider.","Review exit plans for credibility — timescale, cost, data format, resource.","Analyse fourth-party concentration where several providers depend on the same underlying supplier."],"red_flags":["Exit plan consisting of a single paragraph","Continuity never tested with the provider","Several critical providers hosted on the same platform","Data held in a proprietary format with no export"],"evidence":["Concentration analysis","Continuity test records","Exit plans","Provider architecture information"],"kpis":["Critical services single-sourced","Continuity tests performed","Exit plans credible"],"lens":["ia"],"plain":"If a critical supplier fails and there is no alternative, the disruption lasts as long as it lasts."},{"id":"IA-TP-08","industry":["cross"],"process":"Third Party Management","subprocess":"Offshoring and Cross-Border Arrangements","risk":"Work performed offshore creates regulatory, tax and resilience exposure that was never assessed.","rating":"Medium","risk_category":"Compliance","audit_objective":"Confirm cross-border service arrangements comply with regulatory and data residency requirements.","what_to_review":["Regulatory notification or approval requirements for outsourcing","Data residency and cross-border transfer mechanisms","Local labour, tax and permanent establishment considerations","Time zone, language and oversight practicality","Geopolitical and country risk assessment"],"procedures":["Test whether required regulatory notifications for outsourcing were made.","Test data residency against the contractual and regulatory requirement.","Assess whether offshore arrangements create permanent establishment or transfer pricing exposure.","Test the practical oversight exercised over offshore operations."],"red_flags":["Outsourcing arrangements never notified to the regulator","Data processed in jurisdictions not permitted","No country risk assessment for concentrated locations","Oversight limited to a monthly call"],"evidence":["Outsourcing agreements","Regulatory notifications","Data flow mapping","Country risk assessments"],"kpis":["Notifications made","Data residency exceptions","Offshore sites visited"],"lens":["ia"],"plain":"Moving work to another country brings regulatory, tax and oversight issues that are easy to miss."},{"id":"IA-EL-01","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Governance Structure and Board Effectiveness","risk":"The board and its committees lack the information, independence or challenge to oversee the organisation effectively.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether governance arrangements provide genuine oversight.","what_to_review":["Board and committee composition, independence and skills","Quality, timeliness and balance of information provided","Evidence of challenge in minutes","Committee terms of reference and coverage of their remit","Board evaluation and succession planning"],"procedures":["Review minutes across several meetings for evidence of challenge, dissent and follow-up, not just approval.","Test whether papers reached members with enough time to read them.","Test committee coverage against terms of reference — matters required but never discussed.","Assess whether management reporting to the board matches what the audit found operationally."],"red_flags":["Minutes recording approval with no discussion","Papers issued the day before","Terms of reference matters never on any agenda","Board evaluation never performed"],"evidence":["Board and committee minutes and packs","Terms of reference","Composition and independence records","Evaluation reports"],"kpis":["Papers issued on time","Matters covered vs. remit","Actions closed"],"lens":["ia"],"plain":"The board is the last line of defence. If it cannot see problems or will not challenge, nothing else compensates."},{"id":"IA-EL-02","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Tone at the Top and Culture","risk":"Stated values are contradicted by what management rewards and tolerates, so controls are undermined from above.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether the culture supports the control environment in practice, not only in policy.","what_to_review":["Code of conduct, its communication and acknowledgement","Consistency between stated values and incentive design","Consequence management — how breaches by senior staff are handled","Speak-up culture and psychological safety indicators","Employee survey results relevant to ethics and pressure"],"procedures":["Compare disciplinary outcomes for similar breaches at different seniority levels.","Test whether incentive plans reward outcomes the code discourages.","Review survey data for indicators of pressure to meet targets at any cost, and follow up on the worst-scoring units.","Interview staff at multiple levels about whether they would raise a concern and what they expect would happen."],"red_flags":["Senior breaches handled quietly while junior ones are dismissed","Targets that can only be met by cutting corners","Survey scores on ethics declining with no response","Exit interviews citing pressure repeatedly"],"evidence":["Code of conduct and acknowledgements","Disciplinary case records","Incentive plan documents","Employee survey and exit interview data"],"kpis":["Code acknowledgement rate","Consistency of consequence","Survey ethics scores"],"lens":["ia"],"plain":"People take their cue from what leaders reward and tolerate, not from what the policy says."},{"id":"IA-EL-03","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Risk Management Framework","risk":"Risk management is a reporting exercise disconnected from decisions, so real risks are absent from the register.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether the risk framework identifies and manages the risks that actually threaten the organisation.","what_to_review":["Risk appetite definition and its use in decisions","Risk identification process and register completeness","Assessment methodology and consistency of scoring","Mitigation ownership, action tracking and effectiveness","Emerging risk identification and horizon scanning"],"procedures":["Compare the risk register to issues identified by audit, incidents and losses — gaps show the identification process is not working.","Test whether risk appetite has ever caused a decision to change.","Test the scoring of a sample for consistency and challenge.","Test whether mitigation actions were completed and made a difference."],"red_flags":["Risks scored to sit just inside appetite","Register unchanged for years","Incidents occurring in areas rated low risk","Mitigation actions perpetually in progress"],"evidence":["Risk register and appetite statement","Incident and loss data","Risk committee minutes","Action tracking"],"kpis":["Register vs. incidents alignment","Actions overdue","Risks outside appetite"],"lens":["ia"],"plain":"If the risk register does not contain the things that actually go wrong, risk management is decoration."},{"id":"IA-EL-04","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Policy Framework and Compliance","risk":"Policies are out of date, contradictory or unknown to the people expected to follow them.","rating":"Medium","risk_category":"Compliance","audit_objective":"Confirm the policy framework is current, accessible and complied with.","what_to_review":["Policy inventory, ownership and review cycle","Accessibility and communication to affected staff","Consistency between related policies","Attestation and training completion","Monitoring of actual compliance rather than assumed compliance"],"procedures":["Test the policy inventory for overdue reviews and identify policies referencing superseded regulation.","Test staff awareness of key policies in the areas audited.","Test attestation and training completion, particularly for high-risk roles.","Compare policy requirements to observed practice in the processes audited."],"red_flags":["Policies years past review date","Practice diverging from policy with no exception recorded","Training completion tracked but not enforced","Contradictory requirements in related policies"],"evidence":["Policy inventory and documents","Training and attestation records","Process observations","Exception approvals"],"kpis":["Policies within review cycle","Training completion","Policy vs. practice gaps"],"lens":["ia"],"plain":"A policy nobody knows about or follows provides no protection, only the appearance of it."},{"id":"IA-EL-05","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Delegation of Authority","risk":"Authority limits are unclear, outdated or unenforced, so decisions are made by people without the mandate.","rating":"High","risk_category":"Financial","audit_objective":"Confirm delegated authority is defined, current and enforced in the systems where it matters.","what_to_review":["Currency of the delegation of authority matrix","Alignment between the matrix and system configuration","Delegation during absence and its expiry","Authority held by leavers and movers","Evidence of decisions taken outside authority"],"procedures":["Compare the delegation matrix to system approval limits in the finance, procurement and HR systems and quantify differences.","Test delegations granted during absence for expiry.","Reconcile approvers active in systems to current role holders.","Test a sample of significant decisions against the authority held at the time."],"red_flags":["System limits inconsistent with the matrix","Temporary delegations never revoked","Leavers still active as approvers","Matrix last updated after a reorganisation two years ago"],"evidence":["Delegation of authority matrix","System approval configuration","HR role data","Approval records"],"kpis":["Matrix to system alignment","Expired delegations active","Decisions outside authority"],"lens":["ia"],"plain":"If it is unclear who can approve what, decisions get made by people without the authority to make them."},{"id":"IA-EL-06","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Fraud Risk Management","risk":"Fraud risk is assumed to be covered by other controls, so no one assesses where the organisation is actually exposed.","rating":"High","risk_category":"Fraud","audit_objective":"Assess whether fraud risk is specifically assessed, mitigated and detected.","what_to_review":["Fraud risk assessment covering asset misappropriation, corruption and financial reporting fraud","Ownership of fraud risk and specific anti-fraud controls","Fraud detection analytics and their coverage","Investigation capability, independence and consistency","Loss recording, recovery and lessons applied"],"procedures":["Test whether a fraud risk assessment exists and covers the schemes relevant to the business, not generic categories.","Test the anti-fraud controls claimed against each significant scheme.","Review investigations for independence, quality and consistency of outcome.","Test whether identified frauds led to control changes."],"red_flags":["Fraud risk assessment copied from a template","Investigations conducted by the function investigated","Losses written off without root cause work","No detective analytics in high-risk processes"],"evidence":["Fraud risk assessment","Investigation files","Loss register","Analytics coverage documentation"],"kpis":["Schemes assessed","Investigations independent","Controls changed after fraud"],"lens":["ia"],"plain":"Fraud does not get prevented by general controls. Someone has to think specifically about how it would be done here."},{"id":"IA-EL-07","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Whistleblowing and Conflicts of Interest","risk":"Concerns are not raised or not acted upon, and undisclosed interests influence decisions.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether the speak-up channel is trusted and effective and whether conflicts are managed.","what_to_review":["Channel availability, anonymity, independence and awareness","Case triage, investigation independence and closure quality","Conflict of interest declarations — completeness and refresh","Management of declared conflicts, not just declaration","Retaliation monitoring"],"procedures":["Analyse case volume against benchmarks for organisation size; very low volume indicates a channel people do not trust.","Test cases implicating senior management for investigator independence.","Reconcile conflict declarations to the population required to declare, particularly procurement, finance and hiring managers.","Test what happened after a conflict was declared — management action, not just a record."],"red_flags":["Case volume near zero","Cases closed as unsubstantiated with no documented work","Declarations collected but never acted on","Reporters leaving shortly after raising a concern"],"evidence":["Case management records","Conflict declarations and registers","Investigation files","Exit interview data"],"kpis":["Cases per 1,000 staff","Days to close","Declarations completed"],"lens":["ia"],"plain":"If raising a concern feels unsafe, management finds out about problems from the regulator or the press instead."},{"id":"IA-EL-08","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Regulatory Compliance Management","risk":"Regulatory obligations are not identified or tracked to an owner, so breaches are found by the regulator.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm regulatory obligations are identified, owned, monitored and evidenced.","what_to_review":["Completeness of the regulatory obligation inventory","Horizon scanning for new and changing requirements","Ownership and monitoring of each obligation","Breach identification, self-reporting and remediation","Regulatory relationship and correspondence handling"],"procedures":["Build an obligation list independently for the most significant regulations and compare to the inventory.","Test evidence of compliance for a sample of obligations rather than an assertion.","Test breach self-reporting timeliness and remediation delivery.","Test whether regulatory change was assessed and implemented on time."],"red_flags":["Obligations with no owner","Compliance asserted with no evidence","Regulatory change implemented after the deadline","Breaches identified externally first"],"evidence":["Obligation inventory","Regulatory correspondence","Breach register","Change implementation records"],"kpis":["Obligations with evidence","Breaches self-identified","Change implemented on time"],"lens":["ia"],"plain":"Regulatory obligations that nobody owns get missed, and being told by the regulator is the expensive way to find out."},{"id":"IA-EL-09","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Business Continuity and Crisis Management","risk":"The organisation cannot continue operating through disruption because plans are theoretical and untested.","rating":"High","risk_category":"Operational","audit_objective":"Assess whether continuity and crisis arrangements would work in practice.","what_to_review":["Business impact analysis and its currency","Continuity plans for critical processes, including dependencies","Testing — scope, realism and lessons captured","Crisis management structure, roles and decision authority","Communication plans for staff, customers and regulators"],"procedures":["Test whether the business impact analysis reflects the current operating model.","Review the most recent continuity test for realism — was anything actually switched off?","Test whether lessons from previous tests or real incidents were implemented.","Assess whether plans account for third-party and technology dependencies."],"red_flags":["Plans referencing systems or premises no longer used","Tests that are desktop discussions only","Lessons logged but never actioned","Plans assuming staff availability during a regional event"],"evidence":["Business impact analysis","Continuity plans","Test reports and lessons logs","Incident records"],"kpis":["Plans within review cycle","Tests performed","Lessons implemented"],"lens":["ia"],"plain":"Plans that have never been tested tend not to work when they are finally needed."},{"id":"IA-FA-01","industry":["cross"],"process":"Fixed Assets","subprocess":"Capital Budgeting and Authorisation","risk":"Capital expenditure is committed without approval, or approved on business cases that are never held to account.","rating":"High","risk_category":"Financial","audit_objective":"Confirm capital spend is authorised within delegated authority and evaluated against the case that justified it.","what_to_review":["Delegated authority for capital approval and its system enforcement","Business case quality — assumptions, options considered, benefits","Splitting of projects below approval thresholds","Re-approval when costs exceed the approved amount","Post-implementation review of benefits realised"],"procedures":["Test a sample of additions to the approved capital request and the authority level applied.","Analyse spend clustering just below approval thresholds by requester and cost centre.","Compare final project cost to the approved amount and test escalation where overruns exceeded tolerance.","Select completed projects and compare realised benefits to the business case."],"red_flags":["Overruns absorbed without re-approval","Business cases with benefits stated but never measured","Projects split into phases to stay under a threshold","Approvals obtained after commitment"],"evidence":["Capital approval records","Project cost reports","Fixed asset additions","Post-implementation reviews"],"kpis":["Spend within approved authority","Cost overrun %","Projects with benefit review"],"lens":["ia"],"plain":"Capital spending is committed years in advance and is very hard to reverse once started."},{"id":"IA-FA-02","industry":["cross"],"process":"Fixed Assets","subprocess":"Asset Existence and Verification","risk":"Assets recorded on the register cannot be located, and assets in use are not on the register at all.","rating":"High","risk_category":"Operational","audit_objective":"Confirm the fixed asset register reflects assets that physically exist and are in use.","what_to_review":["Physical verification programme, coverage and independence","Asset tagging and identification","Two-way testing — register to floor and floor to register","Treatment of assets not located","Custody and responsibility for mobile and remote assets"],"procedures":["Select assets from the register and verify physical existence; then select assets observed and trace them back to the register.","Test coverage of the verification programme and identify asset classes never verified.","Test the disposition of assets recorded as not located in previous verifications.","For mobile assets — laptops, vehicles, tools — test custody records and return on exit."],"red_flags":["Verification performed by the asset custodian","Assets not located simply rolled forward each year","Untagged assets in service","No verification of assets at remote or third-party sites"],"evidence":["Fixed asset register","Verification programme and results","Asset tagging records","Custody assignments"],"kpis":["Assets verified vs. population","Assets not located","Register accuracy %"],"lens":["ia"],"plain":"If an asset is on the register but nobody can find it, either it was stolen or the records are wrong. Both matter."},{"id":"IA-FA-03","industry":["cross"],"process":"Fixed Assets","subprocess":"Capitalisation and Expense Classification","risk":"Costs are capitalised that should be expensed, or vice versa, misstating profit and the asset base.","rating":"High","risk_category":"Financial","audit_objective":"Confirm the capital versus revenue distinction is applied consistently and in line with policy.","what_to_review":["Capitalisation policy, thresholds and their consistent application","Treatment of repairs, refurbishment and major overhauls","Internal labour, overhead and borrowing cost capitalised","Software and development cost capitalisation criteria","Timing — capitalisation only when available for use"],"procedures":["Sample capitalised additions and test each against the policy criteria, particularly repairs and maintenance capitalised.","Test internal labour and overhead capitalised for a supportable basis and time records.","Test software and development capitalisation against the recognition criteria, including feasibility evidence.","Test capitalisation dates against evidence the asset was ready for use."],"red_flags":["Repairs capitalised near year end","Internal labour capitalised at a standard percentage with no time records","Development capitalised before technical feasibility","Assets capitalised while still under construction"],"evidence":["Fixed asset additions listing","Capitalisation policy","Supporting invoices and time records","Project documentation"],"kpis":["Misclassification value found","Internal cost capitalised","Additions tested to policy"],"lens":["ia"],"plain":"Calling a repair an asset spreads the cost over years and makes this year's profit look better than it is."},{"id":"IA-FA-04","industry":["cross"],"process":"Fixed Assets","subprocess":"Depreciation and Useful Lives","risk":"Assets are depreciated over lives that no longer reflect use, or depreciation is not charged at all on parts of the register.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm depreciation is calculated correctly and lives and residuals remain supportable.","what_to_review":["Useful lives by class and their periodic reassessment","Depreciation method and its appropriateness","Residual value assumptions against realised disposal proceeds","Assets fully depreciated but still in use","Depreciation start and stop dates"],"procedures":["Recompute depreciation for a sample of assets and reconcile the total charge to the ledger.","Compare realised disposal proceeds to residual assumptions by class and test whether lives were reassessed.","Quantify fully depreciated assets still in use and assess whether lives were understated.","Test depreciation start dates against in-service dates."],"red_flags":["Lives unchanged for a decade despite changed usage","Fully depreciated assets forming a large share of the register","Residuals far above realised proceeds","Depreciation suspended without justification"],"evidence":["Fixed asset register with depreciation detail","Disposal proceeds data","Life reassessment documentation"],"kpis":["Depreciation recomputation variance","Fully depreciated assets in use","Life reassessments performed"],"lens":["ia"],"plain":"Depreciation spreads an asset's cost over its life. Wrong life, wrong profit, every single year."},{"id":"IA-FA-05","industry":["cross"],"process":"Fixed Assets","subprocess":"Disposals, Transfers and Retirements","risk":"Assets are disposed of below value, sold to connected parties, or removed from the register while still held.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm disposals are authorised, competitively realised and correctly accounted.","what_to_review":["Disposal authorisation and method — tender, auction, trade-in, scrap","Proceeds received, banked and recorded","Buyer identity and any connection to employees","Transfers between locations and entities","Gain and loss calculation and accounting"],"procedures":["Test disposals for authorisation and evidence of competitive realisation.","Trace disposal proceeds to bank receipts and recompute gain or loss.","Match buyers against employee and vendor records for connections.","Test that disposed assets were removed from insurance, licensing and maintenance contracts."],"red_flags":["Repeat buyers across disposals","Assets written down shortly before disposal","Proceeds received in cash","Assets still insured after recorded disposal"],"evidence":["Disposal authorisations and records","Bank receipts","Employee and vendor master data","Insurance schedules"],"kpis":["Proceeds vs. book value","Disposals with competition","Connected buyer exceptions"],"lens":["ia"],"plain":"Selling company assets cheaply to someone you know is one of the oldest frauds there is."},{"id":"IA-FA-06","industry":["cross"],"process":"Fixed Assets","subprocess":"Impairment","risk":"Impairment indicators are ignored, so assets that no longer generate value remain at full carrying amount.","rating":"High","risk_category":"Financial","audit_objective":"Confirm impairment indicators are identified and assessments performed and supported.","what_to_review":["Process for identifying impairment indicators","Cash generating unit definition and consistency","Assumptions in value-in-use models — growth, discount rate, forecast horizon","Sensitivity analysis and headroom","Reversal of prior impairments"],"procedures":["Test whether known indicators — idle assets, loss-making units, technology change — triggered an assessment.","Recompute a value-in-use model and test the sensitivity of the conclusion to key assumptions.","Compare forecast assumptions used in impairment models to budgets used elsewhere in the business.","Test the consistency of cash generating unit definitions between periods."],"red_flags":["Forecasts in impairment models more optimistic than the board-approved budget","Cash generating units redefined to absorb a loss-making operation","Discount rates that fall as headroom tightens","Idle assets with no assessment"],"evidence":["Impairment assessments and models","Budgets and forecasts","Asset utilisation data","Prior period assessments"],"kpis":["Indicators triggering assessment","Model headroom","Assumption consistency"],"lens":["ia"],"plain":"When an asset stops earning its keep, the loss has already happened. Recognising it late just delays bad news."},{"id":"IA-FA-07","industry":["cross"],"process":"Fixed Assets","subprocess":"Assets Under Construction","risk":"Projects remain in construction long after completion, avoiding depreciation and concealing abandoned spend.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm assets under construction are genuinely incomplete and transferred promptly on completion.","what_to_review":["Ageing of the assets under construction balance","Evidence of commissioning and transfer timing","Abandoned or stalled projects and their write-off","Costs accumulated in construction that are not capital in nature","Interest and overhead capitalised during construction"],"procedures":["Age the construction balance and test the oldest items for evidence they are still in progress.","Physically inspect a sample of assets recorded as under construction.","Test the completeness and timing of transfers to fixed assets against commissioning evidence.","Test whether abandoned projects were written off."],"red_flags":["Balances in construction for more than two years","Assets in use but still recorded as under construction","Abandoned projects retained on the balance sheet","Operating costs accumulated in a construction account"],"evidence":["Assets under construction ageing","Commissioning evidence","Project status reports","Transfer postings"],"kpis":["AUC balance over 12 months old","Days commissioning to transfer","Abandoned project write-offs"],"lens":["ia"],"plain":"Projects left as 'under construction' avoid depreciation, so finished assets sometimes stay there on purpose."},{"id":"IA-FA-08","industry":["cross"],"process":"Fixed Assets","subprocess":"Leases and Right-of-Use Assets","risk":"Leases are not identified or are misclassified, so right-of-use assets and lease liabilities are incomplete.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm the lease population is complete and lease accounting reflects the contracts.","what_to_review":["Completeness of the lease register against contracts and payments","Identification of embedded leases in service contracts","Discount rate determination","Lease modifications, extensions and termination options","Short-term and low-value exemptions applied"],"procedures":["Search payment data for recurring rental-type payments and reconcile to the lease register.","Review significant service contracts for embedded leases.","Recompute right-of-use asset and liability for a sample of leases including options reasonably certain to be exercised.","Test the discount rates used for support."],"red_flags":["Leases known to operations but absent from the register","Options excluded from the term without analysis","Discount rates chosen to minimise the liability","Modifications not remeasured"],"evidence":["Lease register and contracts","Payment data","Lease calculations","Discount rate support"],"kpis":["Leases identified outside register","Recomputation variance","Modifications remeasured"],"lens":["ia"],"plain":"Rented assets now sit on the balance sheet. Leases nobody has identified mean the balance sheet is incomplete."},{"id":"IA-FA-09","industry":["cross"],"process":"Fixed Assets","subprocess":"Asset Insurance and Maintenance","risk":"Assets are uninsured or underinsured, and maintenance neglect shortens asset life and creates safety exposure.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm assets are adequately insured and maintained in line with their criticality.","what_to_review":["Insurance coverage against asset values and replacement cost","Reconciliation of the insured schedule to the asset register","Preventive maintenance programme and completion","Warranty tracking and claims","Critical spares and obsolescence"],"procedures":["Reconcile the insured asset schedule to the fixed asset register and quantify uninsured or under-insured items.","Test insured values against replacement cost rather than book value.","Test preventive maintenance completion for critical assets.","Test whether warranty claims were pursued on failures within warranty."],"red_flags":["Insurance based on net book value","Assets acquired but never added to the policy","Maintenance deferred on critical assets","Warranty periods lapsing unclaimed"],"evidence":["Insurance policies and schedules","Fixed asset register","Maintenance records","Warranty documentation"],"kpis":["Uninsured asset value","PM completion %","Warranty claims recovered"],"lens":["ia"],"plain":"Uninsured or badly maintained assets turn a single bad day into a very expensive one."},{"id":"IA-TX-01","industry":["cross"],"process":"Tax","subprocess":"Tax Governance and Strategy","risk":"There is no clear ownership of tax risk, so positions are taken across the group that nobody has assessed in aggregate.","rating":"Medium","risk_category":"Strategic","audit_objective":"Assess whether tax risk is governed, owned and reported.","what_to_review":["Tax strategy, risk appetite and board oversight","Ownership of tax risk across entities and jurisdictions","Tax risk register and reporting to the audit committee","Resourcing and technical capability","Use and oversight of external advisers"],"procedures":["Review the tax risk register against issues identified in the audit and assess completeness.","Test whether material tax positions were reported to the audit committee.","Assess whether advice received from advisers was acted upon or quietly shelved.","Test that each jurisdiction has an identified owner for tax compliance."],"red_flags":["Tax risk register listing only routine compliance","Advice obtained and then not followed","Jurisdictions with no named owner","No tax item reaching the audit committee in a year"],"evidence":["Tax strategy and risk register","Audit committee papers","Adviser correspondence","Entity and jurisdiction listing"],"kpis":["Jurisdictions with named owner","Tax items reported to committee","Advice implemented"],"lens":["ia"],"plain":"Without someone clearly owning tax risk, positions get taken across the group that nobody has assessed together."},{"id":"IA-TX-02","industry":["cross"],"process":"Tax","subprocess":"Direct Tax Compliance","risk":"Corporate tax returns are filed late or on positions that cannot be supported, generating assessments, interest and penalties.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm direct tax obligations are met accurately and on time in every jurisdiction.","what_to_review":["Completeness of the filing calendar across all entities","Filing and payment timeliness","Support for deductions, reliefs and losses claimed","Reconciliation of the tax charge to the accounting profit","Correspondence and open enquiries with authorities"],"procedures":["Build the obligation calendar independently from the entity register and compare to the one in use.","Test filing and payment dates against deadlines and quantify penalties and interest.","Test support for significant deductions and reliefs claimed.","Reconcile the effective tax rate and test the explanation for material reconciling items."],"red_flags":["Entities discovered to have filing obligations nobody tracked","Repeated late filings in one jurisdiction","Losses carried forward without evidence of availability","Effective rate movements unexplained"],"evidence":["Entity and jurisdiction register","Filed returns and payment evidence","Tax computations","Authority correspondence"],"kpis":["Filings on time","Penalties incurred","Effective tax rate variance"],"lens":["ia"],"plain":"Corporate tax filed late or wrongly attracts interest and penalties, and authorities can look back several years."},{"id":"IA-TX-03","industry":["cross"],"process":"Tax","subprocess":"Indirect Tax","risk":"VAT, GST or sales tax is charged, recovered or remitted incorrectly across large transaction volumes, so small errors become material.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm indirect tax is applied correctly at transaction level and returns are complete.","what_to_review":["Tax code determination logic in the systems","Treatment of cross-border, exempt and zero-rated supplies","Input tax recovery and partial exemption calculations","Manual overrides of tax codes","Reconciliation of returns to the ledger"],"procedures":["Sample transactions across supply types and re-perform the tax determination.","Analyse manual tax code overrides by user and value.","Recompute the input tax recovery or partial exemption calculation.","Reconcile returns filed to the general ledger and test differences."],"red_flags":["Tax codes overridden routinely at invoice entry","Recovery claimed on blocked categories","Cross-border supplies defaulting to domestic treatment","Return to ledger differences carried forward"],"evidence":["Transaction level tax data","Tax code configuration","Filed indirect tax returns","Reconciliations"],"kpis":["Determination error rate","Manual overrides","Return to ledger differences"],"lens":["ia"],"plain":"Sales tax and VAT are applied to enormous numbers of transactions, so a small error repeated becomes a large bill."},{"id":"IA-TX-04","industry":["cross"],"process":"Tax","subprocess":"Employment Taxes and Benefits","risk":"Payments to employees and contractors are misclassified, creating employment tax liabilities and worker status exposure.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm employment taxes are correctly applied, including on benefits and contractor arrangements.","what_to_review":["Worker status determinations for contractors and consultants","Benefits in kind identification and reporting","Expense reimbursements treated as non-taxable","Termination payments and their tax treatment","Cross-border and mobile employee obligations"],"procedures":["Sample contractors and test the worker status determination against the substance of the engagement.","Test expense categories treated as non-taxable for correct treatment.","Test benefit reporting completeness against payroll and procurement data — company cars, health cover, allowances.","Test the tax treatment of termination settlements."],"red_flags":["Long-serving contractors working like employees","Round-sum allowances paid untaxed","Benefits identified only from the payroll system","Mobile employees with no jurisdiction analysis"],"evidence":["Contractor agreements and payment records","Expense and benefit data","Termination settlements","Employee mobility records"],"kpis":["Contractors with status review","Benefits reported","Employment tax adjustments"],"lens":["ia"],"plain":"Treating someone as a contractor when they work like an employee creates back-tax liabilities plus penalties."},{"id":"IA-TX-05","industry":["cross"],"process":"Tax","subprocess":"Transfer Pricing","risk":"Intragroup transactions are priced without support, exposing the group to adjustment, double taxation and penalties.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm intragroup pricing follows policy and is documented to the standard each jurisdiction requires.","what_to_review":["Transfer pricing policy and its application in practice","Local file, master file and country-by-country reporting","Benchmarking studies and their currency","Intragroup service charges and evidence of benefit","Funding, royalties and licence arrangements"],"procedures":["Test whether intragroup transactions were actually priced per policy by recomputing a sample.","Test documentation exists and is current for each jurisdiction with a requirement.","Test service charges for evidence the recipient benefited, not merely that cost was allocated.","Review benchmarking studies for age and comparability."],"red_flags":["Documentation prepared long after year end","Service charges allocated by formula with no benefit evidence","Benchmarks several years old","Pricing that differs from the stated policy"],"evidence":["Transfer pricing policy and documentation","Intragroup agreements and invoices","Benchmarking studies","CbCR submissions"],"kpis":["Jurisdictions with current documentation","Pricing deviations found","Service charges with benefit evidence"],"lens":["ia"],"plain":"When group companies charge each other, tax authorities want proof the price was fair. No proof means an adjustment."},{"id":"IA-TX-06","industry":["cross"],"process":"Tax","subprocess":"Tax Provisions and Deferred Tax","risk":"The tax provision and deferred tax balances are misstated because positions and temporary differences are not tracked.","rating":"High","risk_category":"Financial","audit_objective":"Confirm tax balances in the accounts are supported and complete.","what_to_review":["Current tax provision support and reconciliation to returns filed","Deferred tax asset and liability calculation and temporary difference tracking","Recoverability of deferred tax assets and the forecasts supporting them","Uncertain tax positions and their measurement","Prior year adjustments and their causes"],"procedures":["Reconcile the provision to returns subsequently filed and test the causes of significant true-ups.","Recompute deferred tax on a sample of temporary differences.","Test the forecast supporting deferred tax asset recognition against board-approved projections.","Test the measurement of uncertain tax positions against authority correspondence."],"red_flags":["Large recurring prior year adjustments","Deferred tax assets supported by forecasts no one else uses","Uncertain positions not provided for despite live enquiries","Tem const PROFILES = {"banking":{"summary":"A bank lends money and moves money. Almost everything an auditor looks at traces back to one of those two activities, or to the obligation banks carry to know who their customers are.","hallmarks":["Lending decisions bent by commercial pressure — exceptions to credit policy that become routine, and limits raised the day after an order was blocked","Security that turns out to be worth less than recorded, or was never legally registered in the first place","Customer checks treated as paperwork rather than a legal duty, with alerts closed in bulk to clear a backlog","Payments and branch cash, where money physically leaves and small repeated losses add up","Numbers built on assumptions — how much will not be repaid, how customers will behave in a crisis — that nobody independently challenges"],"compliance":"Expect obligations covering capital and liquidity, customer due diligence and financial crime reporting, expected credit loss accounting, consumer protection and complaint handling, and data protection."},"insurance":{"summary":"An insurer takes money now and promises to pay later. Its accounts therefore rest on estimates of a future nobody has seen yet, which is where most of the audit attention belongs.","hallmarks":["The money set aside for future claims — an estimate large enough that a small nudge changes the reported result","Claims settled for more than the policy required, because nobody re-read the wording","Reinsurance that does not respond the way everyone assumed when the large loss finally arrives","Business written outside appetite or priced below what the risk deserves, to protect volume","Intermediaries selling in the insurer's name, whose conduct becomes the insurer's problem"],"compliance":"Expect obligations covering solvency and capital adequacy, technical reserving and actuarial sign-off, product governance and fair treatment of customers, intermediary licensing, and claims handling standards."},"logistics":{"summary":"A logistics business moves other people's goods using vehicles, people and premises spread across a wide area. Margins are thin, so losses that look small are not.","hallmarks":["Deliveries made but never invoiced, or invoiced at the wrong rate — revenue that simply disappears","Fuel, which is easy to take and hard to tie back to a specific vehicle or trip","Freight changing hands repeatedly, with each handover a chance for it to go missing or be damaged","Subcontracted carriers moving your freight without the insurance or safety record you assumed","Driver, vehicle and cross-border compliance, where a failure stops the operation rather than just costing money"],"compliance":"Expect obligations covering driver hours and fitness to drive, vehicle roadworthiness, transport of hazardous goods, customs and trade documentation, and revenue recognition over the period of carriage."},"aviation":{"summary":"Airlines and ground handlers run expensive assets under strict safety oversight. Records are not administration here — if the paperwork is incomplete, the aircraft does not fly.","hallmarks":["Maintenance that was performed but cannot be evidenced, or certified by someone whose authorisation had lapsed","Tickets sold long before the flight, so what counts as earned revenue and what is still owed to the customer needs care","Leased aircraft that must be returned in a defined condition, at a cost decided years earlier","Ground damage and delays where responsibility is disputed and often absorbed","Fuel and services billed by suppliers against volumes nobody independently verified"],"compliance":"Expect obligations covering continuing airworthiness and maintenance certification, crew and engineer licensing, ground handling and safety management systems, dangerous goods acceptance, and lease and revenue accounting."},"manufacturing":{"summary":"A manufacturer buys materials, converts them, and holds significant stock throughout. Most of the value — and most of the risk — sits in that stock and in the accuracy of what it cost to make.","hallmarks":["Costs used to value products that no longer reflect what inputs actually cost, so margins are wrong everywhere","Material that goes in but does not come out as sellable product, absorbed into variances instead of investigated","Stock that exists on the system but not on the floor, and counts performed by the people responsible for it","Product that will never sell at full price still carried at full cost","Safety and environmental conditions that must be evidenced, not merely asserted"],"compliance":"Expect obligations covering workplace safety, environmental permits and emissions reporting, product safety and liability, waste handling, and inventory valuation standards."},"retail":{"summary":"Retail is a very large number of small transactions across many locations. No single one matters, which is exactly why losses accumulate without anyone noticing.","hallmarks":["Refunds, voids and discounts processed against real sales, with the cash taken","Stock lost to theft, process error and short deliveries, all blended into one shrinkage figure","Money promised by suppliers counted as profit before the conditions to earn it have been met","Gift cards and loyalty points, which are money owed to customers and easy to understate","Store-level performance measured on sales, with control quietly deprioritised"],"compliance":"Expect obligations covering consumer protection and pricing accuracy, card payment security, product and food safety where relevant, employment standards, and stored-value or unclaimed balance rules."},"hospitality":{"summary":"Hotels handle cash, stock and people at every property while central oversight is stretched thin. Most losses are small, local and repeated.","hallmarks":["Rooms given away, discounted or comped at the front desk with no independent approval","More food and drink consumed than sales explain, with the gap written off as waste","Purchasing done locally, at higher prices, sometimes from suppliers connected to staff","Distribution channels taking commissions large enough to erase the profit on a room","Deposits and loyalty balances held for stays that already happened, or never happened"],"compliance":"Expect obligations covering food safety and hygiene, licensing, card payment security, employment and service charge rules, and guest data protection."},"ecommerce":{"summary":"An online retailer is built from transactions and customer data. Money travels from the customer through a payment provider to the bank, and needs reconciling at every step.","hallmarks":["Orders taken, money collected by the payment provider and cash in the bank that do not reconcile","Fraudulent orders fulfilled, with the payment reversed after the goods have gone","Refunds issued without the goods ever coming back, or to a different payment method","Prices and promotions published at scale, where an error is honoured before anyone can react","Personal data kept longer and shared wider than the basis for holding it allows"],"compliance":"Expect obligations covering data protection and marketing consent, card payment security, consumer rights on cancellation and returns, distance selling disclosure, and marketplace liability where third parties sell."},"fmcg":{"summary":"Consumer goods companies sell through retailers and distributors and spend heavily on promotions to hold shelf space. That spend, and product safety, carry most of the risk.","hallmarks":["Promotional money committed without anyone checking whether the promotion worked","Deductions taken by customers against invoices and settled without being verified","Stock pushed into the distribution channel near period end to meet targets, returning later","Batch traceability that has never been tested, so a recall would be slow","Short-dated stock still valued as though it will sell at full price"],"compliance":"Expect obligations covering food and product safety systems, labelling and advertising claims, recall and withdrawal procedures, competition rules on pricing and distribution, and trade promotion accounting."},"utilities":{"summary":"Utilities run safety-critical networks under close regulatory oversight, often with prices and service levels set externally. Compliance is not discretionary, and neither is asset safety.","hallmarks":["A gap between what is delivered into the network and what is billed, filled with estimates","Licence and determination conditions nobody owns, so compliance is asserted rather than evidenced","Safety-critical maintenance deferred under cost pressure, with the risk transferred to the public","Customers in hardship or dependent on supply for health reasons, treated as ordinary arrears cases","Capital projects capitalised before the asset is actually in service"],"compliance":"Expect obligations covering the operating licence and price controls, customer protection and vulnerability rules, network safety and environmental standards, metering accuracy, and regulatory reporting."},"telecom":{"summary":"Telecoms handle enormous transaction volumes that pass through several systems before becoming a bill. Records lost along the way are services given away free.","hallmarks":["Usage recorded on the network that never reaches billing, so it is never charged","Services activated for customers who were never properly credit assessed or set up to be billed","Amounts owed by other operators settled using their figures rather than your own","Network changes made without control, where an outage becomes a reportable event","Long-lived free-of-charge, test and employee accounts with real consumption"],"compliance":"Expect obligations covering the operating licence, service continuity and outage reporting, subscriber identity and data retention, consumer contract and billing transparency rules, and interconnect settlement terms."}};
