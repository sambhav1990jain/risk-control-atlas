otographs","Recovery from subcontracted carriers and insurers","Root-cause analysis and corrective action on repeat loss points","Claims reserve adequacy and ageing"],"procedures":["Sample settled claims and test that liability was established before payment, not assumed.","Identify claims where a subcontracted carrier held the freight at the time of loss and test whether recovery was pursued within the contractual notice period.","Analyse claims by terminal, lane and commodity to locate concentrations, then test whether any corrective action followed.","Test the ageing of open claims and the basis for the reserve held against them.","Reconcile the claims register to the general ledger loss account and to insurer recoveries."],"red_flags":["Claims settled below an investigation threshold that is never reviewed in aggregate","Recovery notice periods missed repeatedly","The same terminal appearing in loss concentrations quarter after quarter","Claims paid without proof of delivery on file"],"evidence":["Claims register with reserve history","OS&D incident logs","Subcontract carrier agreements and notice terms","Insurer correspondence and recovery records"],"kpis":["Claims paid vs. recovered","Loss per million shipments","Repeat loss locations"],"lens":["ia"],"plain":"Cargo claims get paid without checking whether another party was actually at fault and should be paying instead."},{"id":"IA-RTL-03","industry":["retail"],"process":"Customer Revenue & Loyalty","subprocess":"Gift Cards and Loyalty","risk":"Gift card and loyalty balances are manipulated by staff, or breakage is recognised on an assumption that overstates income.","rating":"High","risk_category":"Fraud","audit_objective":"Assess the integrity of stored-value and loyalty balances and the support for breakage recognition.","what_to_review":["Gift card activation, reload and void controls at the till","Loyalty point issuance, adjustment and manual accrual rights","Breakage assumption and redemption history supporting it","Reconciliation of the liability to the issuing platform","Employee accounts and their transaction patterns"],"procedures":["Analyse gift card activations reversed or voided shortly after issue, by operator.","Test manual loyalty point adjustments by user and value; sample the largest for approval and business reason.","Match loyalty and gift card accounts to employee records and analyse redemption behaviour on those accounts.","Recompute breakage using the actual redemption curve and compare to the rate recognised.","Reconcile the platform balance to the ledger liability at several dates."],"red_flags":["Cards activated and voided in the same shift","Points adjusted upward immediately before redemption","Employee-linked accounts with outsized balances","Breakage rate unchanged for years despite behaviour shifts"],"evidence":["Gift card and loyalty platform transaction data","Point adjustment logs","Employee master data","Liability reconciliations"],"kpis":["Void rate by operator","Manual point adjustments","Breakage as % of issuance"],"lens":["ia"],"plain":"Gift cards and loyalty points are money the business owes customers. Assuming too much of it will never be claimed flatters profit."},{"id":"IA-BNK-03","industry":["banking"],"process":"Deposits & Payments","subprocess":"Payment Processing and Account Integrity","risk":"Payments are processed to incorrect or fraudulent beneficiaries, and internal or dormant accounts are used to warehouse the proceeds.","rating":"High","risk_category":"Fraud","audit_objective":"Assess controls over payment execution, beneficiary integrity and the use of internal and dormant accounts.","what_to_review":["Payment authorisation limits and dual control by channel","Beneficiary verification and confirmation-of-payee checks","Dormant account reactivation and monitoring","Internal, suspense and staff account usage","Payment recall and error correction process"],"procedures":["Test that every payment channel enforces dual authorisation at the stated thresholds, including manual and urgent routes.","Analyse dormant accounts that reactivated in the period and test the first transaction on each.","Extract transactions on internal and staff accounts and test the business justification for the largest and most frequent.","Sample high-value payments and test beneficiary verification evidence.","Review payment errors and recalls for pattern and for whether root causes were fixed."],"red_flags":["Urgent payments bypassing dual control","Dormant accounts reactivating just before a large credit","Staff accounts transacting with customer accounts","Beneficiary details changed shortly before payment release"],"evidence":["Payment system transaction logs and authorisation configuration","Dormant account reports","Internal and staff account statements","Payment error and recall register"],"kpis":["Payments released single-handed","Dormant reactivations investigated","Error and recall rate"],"lens":["ia"],"plain":"Payments are where money physically leaves the bank, so this is the step a fraudster most wants to control."},{"id":"IA-AVN-03","industry":["aviation"],"process":"Fleet & Engineering","subprocess":"Aircraft Leasing and Return Conditions","risk":"Aircraft are returned to lessors without meeting contractual return conditions, triggering large end-of-lease compensation claims that were never provided for.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether lease return obligations are tracked through the lease term and provided for on a supportable basis.","what_to_review":["Inventory of lease return conditions per aircraft","Tracking of maintenance status against those conditions","Provisioning for expected return costs","Records and back-to-birth traceability required at return","Negotiation and settlement of end-of-lease claims"],"procedures":["Build a register of return conditions from the lease agreements themselves and compare it to what the business is tracking.","For aircraft returning within two years, compare current maintenance status to the required return condition and quantify the gap.","Test whether the provision reflects that gap or only scheduled maintenance.","Review recent lease returns and compare final settlement to the amount provided.","Test the completeness of component records required at return."],"red_flags":["Return conditions summarised by the operator rather than read from the lease","Provisions based on maintenance plans, not lease terms","Settlements consistently exceeding provisions","Component records reconstructed close to the return date"],"evidence":["Lease agreements and return condition schedules","Maintenance status reports by aircraft","Provision calculations","Prior lease return settlements"],"kpis":["Aircraft with quantified return gaps","Settlement vs. provision variance","Records completeness at return"],"lens":["ia"],"plain":"Leased aircraft must be given back in a specified condition. That bill arrives years after the decisions that caused it."},{"id":"IA-AVN-04","industry":["aviation"],"process":"Flight Revenue","subprocess":"Passenger Revenue Integrity","risk":"Fare rules, refunds and interline settlements are applied incorrectly, so revenue is lost between the booking and the general ledger.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether flown revenue is complete and correctly valued, and whether refunds and interline balances are controlled.","what_to_review":["Fare rule configuration and manual fare overrides","Refund and reissue authority and reason codes","Interline and code-share settlement reconciliation","Agency and distribution channel commission accuracy","Unflown ticket expiry and residual value treatment"],"procedures":["Re-price a sample of tickets from the fare rules and quantify variance to the fare actually charged.","Analyse refunds and reissues by agent and reason code; sample the outliers for authorisation.","Reconcile interline billings to the settlement clearing house statements and test disputes raised within the deadline.","Recompute agency commission for a sample against the distribution agreement.","Test the expiry and recognition of unflown tickets against the stated policy."],"red_flags":["Manual fare overrides concentrated with a few agents","Refunds issued to a payment method other than the original","Interline disputes filed after the deadline","Expiry recognition accelerated near period end"],"evidence":["Revenue accounting system extracts","Fare rule configuration","Refund and reissue logs","Clearing house settlement statements"],"kpis":["Fare variance on re-pricing","Refunds by agent","Interline disputes recovered"],"lens":["ia"],"plain":"A ticket sold is not money earned until the passenger flies. Mixing those two up overstates revenue."},{"id":"IA-HSP-03","industry":["hospitality"],"process":"Food & Beverage","subprocess":"Outlet Operations and Wastage","risk":"Food and beverage margin is lost through unrecorded wastage, over-portioning, unauthorised staff meals and supplier short-delivery.","rating":"Medium","risk_category":"Operational","audit_objective":"Identify where margin is lost between purchase and sale in food and beverage outlets.","what_to_review":["Recipe costing and portion control","Wastage recording and its plausibility","Staff meal and entertainment policy and recording","Goods receipt verification against delivery notes and weights","Void and discount patterns in the outlet point of sale"],"procedures":["Observe service and compare actual portions to the costed recipe for high-volume items.","Compare recorded wastage across outlets and shifts; implausibly low or perfectly consistent wastage warrants challenge.","Test goods receipt for weight and count verification rather than signature only, for a sample of deliveries.","Analyse voids, discounts and staff meals by server and shift against outlet averages.","Reconcile theoretical to actual consumption for a sample of high-value beverage lines."],"red_flags":["Wastage recorded as the same figure every week","Deliveries signed without verification","Discounts concentrated on particular shifts","Stock counts performed by the outlet manager alone"],"evidence":["Recipe and costing files","Wastage logs","Goods receipt records and delivery notes","Point of sale transaction data"],"kpis":["Pour cost variance","Wastage as % of purchases","Discounts per server"],"lens":["ia"],"plain":"More drink leaves the bottle than the till records, and the gap is usually explained away as waste."},{"id":"IA-AVN-05","industry":["aviation"],"process":"Fuel & Hedging","subprocess":"Fuel Uplift and Supplier Billing","risk":"Fuel uplifted into aircraft is not reconciled to supplier invoices, so the airline pays for volumes it never received.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm that fuel purchased reconciles to fuel uplifted and that pricing follows the supply contract.","what_to_review":["Uplift recording at the wing and its independence from the supplier","Reconciliation of uplift tickets to supplier invoices","Contract pricing, differentials and into-plane fees","Density and temperature correction on volumes","Dispute handling with fuel suppliers"],"procedures":["Reconcile uplift volumes from flight records to supplier invoiced volumes by station and quantify the difference.","Re-price a sample of invoices against the contract, including index differentials and into-plane fees.","Test whether volume corrections for temperature and density were applied consistently.","Review the ageing and outcome of fuel supplier disputes."],"red_flags":["Uplift recorded solely from the supplier ticket","Persistent one-directional variances at a station","Fees charged that are not in the contract","Disputes abandoned rather than resolved"],"evidence":["Flight records and uplift tickets","Fuel supplier invoices","Fuel supply contracts","Dispute correspondence"],"kpis":["Uplift-to-invoice variance","Price variance to contract","Disputes recovered"],"lens":["ia"],"plain":"Fuel is one of the largest costs an airline has, and nobody stands at the wing checking the litres against the invoice unless someone makes them."},{"id":"IA-ECM-03","industry":["ecommerce"],"process":"Fulfilment","subprocess":"Warehouse Accuracy and Delivery Performance","risk":"Orders are picked, packed or shipped incorrectly, generating replacement cost, refunds and customer loss that is absorbed as a cost of doing business.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess fulfilment accuracy, the cost of getting it wrong, and whether root causes are addressed.","what_to_review":["Pick and pack accuracy and verification at despatch","Inventory accuracy between the warehouse and the storefront","Carrier performance and lost parcel handling","Replacement and refund cost attribution","Returns processing and restocking accuracy"],"procedures":["Quantify order defects — wrong item, missing item, damaged — and the total cost of remediation over the period.","Test inventory accuracy by cycle count and compare to the availability shown on the storefront; oversell indicates a control gap.","Analyse lost and damaged parcels by carrier and test whether claims were filed within the carrier deadline.","Trace a sample of returns from receipt to restock or write-off and test the valuation applied."],"red_flags":["Defect cost recorded in a general expense account with no attribution","Overselling followed by silent cancellation","Carrier claims not filed","Returned stock restocked without inspection"],"evidence":["Order defect and remediation records","Cycle count results","Carrier performance and claims data","Returns processing records"],"kpis":["Order defect rate","Remediation cost per order","Carrier claim recovery %"],"lens":["ia"],"plain":"Every order picked wrong costs the replacement, the delivery and often the customer."},{"id":"IA-ECM-04","industry":["ecommerce"],"process":"Marketplace & Content","subprocess":"Seller Onboarding and Product Compliance","risk":"Third-party sellers list counterfeit, unsafe or prohibited products, exposing the platform to regulatory action and liability.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether sellers and their listings are vetted and monitored proportionately to the risk they carry.","what_to_review":["Seller identity verification and business registration checks","Prohibited and restricted product controls at listing","Counterfeit and intellectual property complaint handling","Product safety recalls and takedown speed","Seller performance monitoring and suspension"],"procedures":["Sample sellers and test that identity and business verification was completed before listing was enabled.","Test the listing filters by attempting to list restricted categories in a test environment.","Trace a sample of intellectual property and safety complaints through to takedown and measure elapsed time.","Test whether sellers suspended for cause reappear under new identities by matching bank details, addresses and devices."],"red_flags":["Sellers onboarded with unverified documents","Restricted items reachable through alternate category paths","Takedowns taking weeks","Suspended sellers returning with the same bank account"],"evidence":["Seller onboarding files","Listing filter configuration","Complaint and takedown logs","Suspension records"],"kpis":["% sellers fully verified","Days to takedown","Repeat suspended sellers"],"lens":["ia"],"plain":"On a marketplace, the platform is judged by what its sellers list, including counterfeit or unsafe goods."},{"id":"IA-UTL-03","industry":["utilities"],"process":"Regulated Operations","subprocess":"Regulatory Compliance and Reporting","risk":"Regulatory obligations under the licence or determination are not tracked to an owner, so breaches are discovered by the regulator rather than internally.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm that licence and determination obligations are identified, owned, monitored and evidenced.","what_to_review":["Completeness of the regulatory obligation register against the licence","Ownership and monitoring of each obligation","Accuracy of performance data submitted to the regulator","Self-reporting of breaches and their timeliness","Regulatory penalties, undertakings and remediation"],"procedures":["Read the licence and determination and build an obligation list independently; compare it to the register in use and quantify the gaps.","Sample obligations and test for evidence of compliance in the period, not merely an assertion of compliance.","Re-perform the calculation of key performance measures submitted to the regulator from source data.","Test breach self-reporting against the required timeframe and review whether remediation commitments were delivered."],"red_flags":["Obligations without a named owner","Performance figures that cannot be reconstructed from source","Breaches identified by the regulator first","Remediation commitments closed without evidence"],"evidence":["Licence and regulatory determination","Obligation register","Submitted regulatory returns and source data","Regulator correspondence and penalty notices"],"kpis":["Obligations with current evidence","Breaches self-reported vs. found","Remediation actions overdue"],"lens":["ia"],"plain":"A utility operates under a licence. Breach its conditions and the regulator, not the market, decides what happens next."},{"id":"IA-INS-03","industry":["insurance"],"process":"Reinsurance","subprocess":"Reinsurance Programme Effectiveness","risk":"The reinsurance programme does not respond as expected to a large loss because cover, exclusions or aggregate limits were not understood when the risk was written.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether the reinsurance programme actually covers the exposures being underwritten.","what_to_review":["Alignment between underwriting appetite and reinsurance cover","Exclusions, aggregate limits and reinstatement provisions","Placement completeness and signed slips before inception","Reinsurer security and credit concentration","Recovery process after a large loss"],"procedures":["Map material underwriting exposures against the reinsurance programme and identify uncovered aggregations.","Test that binding slips were signed and complete before cover incepted, not retrospectively.","Model a large-loss scenario and trace the expected recovery through the programme including reinstatements.","Assess reinsurer concentration and credit ratings against policy limits.","Review actual recoveries from recent large losses against what was expected."],"red_flags":["Cover placed after inception","Aggregate limits exhausted without anyone noticing","Reliance on a small number of reinsurers","Recoveries materially below expectation after a loss"],"evidence":["Reinsurance treaties and slips","Underwriting exposure data","Reinsurer security policy and ratings","Large loss recovery records"],"kpis":["Uncovered aggregation exposure","Slips signed pre-inception","Recovery vs. expected"],"lens":["ia"],"plain":"Reinsurance is the insurance company's own insurance. If it was set up badly, the company discovers that only when a very large loss arrives."},{"id":"IA-INS-04","industry":["insurance"],"process":"Reserving","subprocess":"Reserve Adequacy and Governance","risk":"Reserves are influenced by earnings pressure rather than actuarial judgement, and adverse development is not surfaced to the board on a timely basis.","rating":"High","risk_category":"Financial","audit_objective":"Assess the independence and rigour of the reserving process and the transparency of reserve movements.","what_to_review":["Independence of the actuarial function from underwriting and claims","Reserving methodology, assumption setting and change control","Management adjustments to the actuarial central estimate","Reserve development triangles and back-testing","Reporting of adverse development to the board"],"procedures":["Analyse historical reserve development and quantify how often and in which direction estimates have proved wrong.","Test the size, direction and justification of management adjustments to the actuarial estimate across several periods.","Test whether assumption changes were documented and approved before results were known.","Review board and committee papers for whether adverse development was reported plainly or netted against other movements."],"red_flags":["Management adjustments always favourable","Assumption changes made after preliminary results circulate","Consistent adverse development in the same class of business","Reserving committee minutes recording no challenge"],"evidence":["Actuarial reserve reports and development triangles","Assumption change logs","Reserving committee minutes","Board reporting packs"],"kpis":["Reserve development by year","Management adjustment as % of estimate","Classes with recurring deterioration"],"lens":["ia"],"plain":"The money set aside for future claims is the single biggest number in an insurer's accounts, and it is an estimate that can be leaned on."},{"id":"IA-HSP-04","industry":["hospitality"],"process":"Rooms Revenue","subprocess":"Revenue Management and Distribution","risk":"Rooms are sold through channels at rates and commissions that destroy margin, and rate parity or contractual terms with distributors are breached.","rating":"Medium","risk_category":"Financial","audit_objective":"Assess whether distribution channel economics are understood, controlled and compliant with distributor agreements.","what_to_review":["Channel mix and net rate after commission by channel","Rate parity obligations and breaches","Commission calculation accuracy and reconciliation","Overbooking, walk cost and compensation","Group and corporate contract rate adherence"],"procedures":["Recompute net revenue per room night by channel after commission and compare to the direct channel.","Test rate parity by comparing published rates across channels on sample dates.","Reconcile commission invoiced by distributors to the bookings actually delivered and recompute against the agreement.","Quantify walk and compensation costs from overbooking and test the authorisation for compensation paid."],"red_flags":["Channels with negative contribution still receiving allocation","Parity breaches unnoticed until a distributor claims","Commission paid on cancelled bookings","Compensation paid without approval"],"evidence":["Property management and channel manager data","Distributor agreements","Commission invoices","Overbooking and walk records"],"kpis":["Net rate by channel","Parity breach incidents","Commission variance"],"lens":["ia"],"plain":"A room booked through a website can cost so much in commission that the hotel makes almost nothing on it."},{"id":"IA-FMC-03","industry":["fmcg"],"process":"Trade Spend","subprocess":"Trade Investment Effectiveness","risk":"Trade investment is committed without evidence that it generates incremental volume, and accruals are settled against claims that were never validated.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether trade spend is authorised, delivered, validated and generating a return.","what_to_review":["Promotion approval, expected uplift and post-event evaluation","Deduction and claim validation before settlement","Accrual accuracy and the ageing of unsettled claims","Customer-level profitability including all trade investment","Authority limits on discretionary spend"],"procedures":["Select major promotions and compare actual uplift to the volume assumed in the approval; test whether any post-event evaluation occurred.","Sample settled customer deductions and test for a matched, approved promotion and delivery evidence.","Analyse the ageing of open deductions and the rate at which disputes are simply written off.","Recompute customer profitability including all trade investment and identify customers who are loss-making after spend."],"red_flags":["Post-event evaluation performed for none of the largest promotions","Deductions written off once they age past a threshold","Spend approved by the same person who negotiates the customer relationship","Promotions repeated annually with no measured return"],"evidence":["Promotion approvals and plans","Deduction and claim files","Trade accrual schedules","Customer profitability reports"],"kpis":["% promotions evaluated","Deductions written off","Customers loss-making after trade spend"],"lens":["ia"],"plain":"Promotional spend is one of the biggest costs in consumer goods, and much of it is paid out against claims nobody checks."},{"id":"IA-UTL-04","industry":["utilities"],"process":"Trading & Commodity","subprocess":"Trading Conduct and Controls","risk":"Traders conceal losses or breach limits through mispriced trades, off-market transactions or unauthorised products.","rating":"High","risk_category":"Fraud","audit_objective":"Assess the independence and effectiveness of controls over trading activity and valuation.","what_to_review":["Independence of risk control and back office from the trading desk","Limit framework, monitoring and breach escalation","Independent price verification and off-market trade detection","Trader mandates, approved products and counterparties","Mandatory leave and trade cancellation or amendment patterns"],"procedures":["Test independent price verification by re-valuing a sample of positions from an external curve.","Analyse trade amendments and cancellations by trader, and trades executed at prices away from the market at execution time.","Test limit breaches for timely escalation and for whether limits were subsequently raised rather than positions reduced.","Confirm mandatory leave was actually taken by all trading staff and that their books were managed by others during it.","Test that all traded products and counterparties are on the approved list."],"red_flags":["Amendments concentrated with one trader","Limits raised shortly after a breach","Positions valued using trader-supplied marks","Mandatory leave waived for key staff"],"evidence":["Trade capture system extracts with amendment history","Limit and breach reports","Independent price verification files","Leave records","Approved product and counterparty lists"],"kpis":["Trade amendments per trader","Limit breaches and escalation time","Positions independently verified"],"lens":["ia"],"plain":"Traders can hide losses by mispricing their own positions, which is why someone independent must value them."},{"id":"IA-BNK-04","industry":["banking"],"process":"Treasury","subprocess":"Liquidity and Capital Management","risk":"Liquidity and capital positions are managed on assumptions that do not hold under stress, leaving the bank exposed to a funding shock or a regulatory shortfall.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether liquidity and capital are measured, stressed and governed on a defensible basis.","what_to_review":["Liquidity risk appetite, limits and early warning indicators","Stress testing scenarios, severity and governance","Funding concentration and deposit stickiness assumptions","Capital planning and buffer management","Contingency funding plan credibility and testing"],"procedures":["Test the data feeding liquidity metrics back to source systems for completeness and accuracy.","Challenge stress scenario severity against historical and regulatory benchmarks, and test whether results drive any action.","Analyse deposit behaviour against the stickiness assumptions used in the liquidity model.","Review the contingency funding plan and test whether it has ever been exercised.","Test capital projections against the plan and the sensitivity of the buffer to the stress scenarios."],"red_flags":["Stress scenarios milder than events already experienced","Early warning indicators breached without action","Model assumptions unchanged through a rate cycle","Contingency funding plan never tested"],"evidence":["Liquidity and capital reporting and source data","Stress testing methodology and results","ALCO minutes","Contingency funding plan"],"kpis":["Liquidity coverage vs. limit","Early warning breaches actioned","Date of last funding plan test"],"lens":["ia"],"plain":"If the bank runs out of cash or capital, it stops being a bank. These are the numbers that keep it alive in a bad year."},{"id":"IA-INS-05","industry":["insurance"],"process":"Underwriting","subprocess":"Underwriting Discipline and Pricing","risk":"Risks are written outside appetite or priced below technical rates to hold volume, so the portfolio deteriorates before the loss ratio reveals it.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether underwriting stays within appetite and authority, and whether pricing is technically supported.","what_to_review":["Underwriting authority by class, limit and referral triggers","Adherence to the technical rate and the level of discounting","Risk selection against stated appetite and exclusions","Peer review of large or unusual risks","Delegated underwriting authority given to third parties"],"procedures":["Sample bound risks and test each against the underwriter's authority and the referral criteria.","Quantify the discount to technical rate by underwriter, class and broker, and test the justification for the deepest discounts.","Test that risks outside appetite were declined or properly referred and approved.","Review peer review coverage and whether reviewers ever changed an outcome.","For delegated authorities, test the binder terms, reporting received and any audits performed on the coverholder."],"red_flags":["Discounting deepest at period end","Referral triggers narrowly avoided through structuring","Peer review recorded but never dissenting","Coverholders writing outside the binder with no audit"],"evidence":["Policy bordereaux and bound risk data","Underwriting authority matrix","Technical rating models","Peer review records","Binder agreements and coverholder audits"],"kpis":["Average discount to technical rate","Risks bound outside authority","Coverholders audited in the period"],"lens":["ia"],"plain":"Pricing below what the risk deserves wins business today and loses money for years afterwards."},{"id":"IA-PAY-01","industry":["cross"],"process":"Payroll","subprocess":"Payroll System Access and Segregation of Duties","risk":"A single person can create an employee, change pay details and release the payment, allowing fabricated employees or altered pay to reach the bank without detection.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm that payroll system access is restricted by role and that no individual controls the full payroll cycle.","what_to_review":["Role design and who holds each payroll role","Conflicting combinations — master data maintenance with payroll processing or payment release","Access of HR, Finance and IT staff to payroll data","Privileged and vendor support accounts","Access reviews and removal on transfer or exit"],"procedures":["Extract all users with payroll system access and map their roles against a segregation of duties matrix; quantify unmitigated conflicts.","Test whether any single user can both amend an employee record and approve the pay run, using the system rather than the policy as evidence.","Test that IT and vendor support accounts cannot post or release payroll transactions, and review their activity logs.","Trace payroll staff who changed role or left, and measure days to access removal.","Test whether the last access review was performed by the payroll owner and whether flagged removals actually happened."],"red_flags":["Emergency or firefighter access left permanently enabled","Shared accounts used at pay run time","Access reviews approved in bulk on one day","Support vendor with standing production access"],"evidence":["Payroll system user and role listings","Segregation of duties matrix","Access review evidence","Privileged activity logs","HR joiner, mover and leaver data"],"kpis":["Unmitigated SoD conflicts","Days to revoke access","Privileged sessions at pay run"],"lens":["ia"],"plain":"If one person can add an employee, set their pay and release the payment, nothing stops them paying themselves."},{"id":"IA-PAY-02","industry":["cross"],"process":"Payroll","subprocess":"Employee Master Data","risk":"Bank details, salary or employment status are changed without authorisation or verification, diverting pay or inflating it.","rating":"High","risk_category":"Fraud","audit_objective":"Verify that every change to employee master data is authorised, independently verified and traceable to a source document.","what_to_review":["Authorisation and verification of salary, bank and status changes","Source documentation retained for each change","Change reporting and who reviews it","Duplicate bank accounts, addresses or tax identifiers","Changes made close to the pay run cut-off"],"procedures":["Extract the full master data change log for the period and reconcile it to authorised change forms.","Test all bank detail changes for independent verification back to a source the employee did not supply alone.","Run duplicate analytics across bank account, address, national insurance or SIN, and email across the active population.","Analyse changes made within 48 hours of the pay run cut-off and test each for approval.","Test whether the change report is genuinely reviewed, by re-performing the review for one period."],"red_flags":["Bank change immediately followed by a pay increase","Multiple employees sharing one bank account","Changes entered and approved by the same user","Retrospective approval forms dated after the change"],"evidence":["Master data change logs with user and timestamp","Authorised change forms","Bank verification evidence","Payroll master extract"],"kpis":["Changes with verified authorisation","Duplicate bank account exceptions","Changes near cut-off"],"lens":["ia"],"plain":"Changing bank details or salary is the quickest way to redirect or inflate pay."},{"id":"IA-PAY-03","industry":["cross"],"process":"Payroll","subprocess":"Payroll Register Review and Authorisation","risk":"The payroll is released without anyone reviewing the register against the prior period, so errors and fraudulent entries pass straight to the bank.","rating":"High","risk_category":"Financial","audit_objective":"Confirm that the payroll register is reviewed on a meaningful basis and authorised by someone independent before payment.","what_to_review":["Pre-payment review of the register and variance to prior period","Investigation thresholds for movements and new joiners","Authorisation limits and who signs the pay run","Exception reports — negative pay, duplicate payments, high net pay, zero deductions","Evidence retained of the review"],"procedures":["For a sample of pay runs, obtain the register and the reviewer evidence; re-perform the period-on-period variance analysis and test whether flagged items were investigated.","Test that the authoriser is independent of payroll preparation and within their authority.","Re-perform the exception reports on the payroll data and test whether the same exceptions were identified and cleared.","Test the completeness of the register reviewed against the payment file actually transmitted to the bank."],"red_flags":["Sign-off dated after the payment was released","Variance review consisting of a total-only comparison","Exceptions cleared with the note \"checked\"","Register reviewed by the person who prepared it"],"evidence":["Payroll registers and variance analyses","Reviewer sign-offs","Exception reports","Bank payment files"],"kpis":["Pay runs with evidenced review","Exceptions investigated","Variance threshold breaches"],"lens":["ia"],"plain":"Someone independent looking at the payroll before it goes out is the last chance to catch anything wrong."},{"id":"IA-PAY-04","industry":["cross"],"process":"Payroll","subprocess":"Time and Attendance","risk":"Hours paid are not the hours worked, because time records are entered, amended or approved by people who benefit from them.","rating":"High","risk_category":"Operational","audit_objective":"Assess whether time and attendance data is captured accurately, approved independently and flows unaltered into pay.","what_to_review":["Time capture method and its integrity — biometric, badge, manual sheets","Supervisor approval of hours and whether it is exercised","Amendments to submitted time records and who makes them","Buddy punching and remote clock-in controls","Interface integrity between the time system and payroll"],"procedures":["Reconcile hours approved in the time system to hours paid in the register and investigate differences.","Analyse time record amendments by user; amendments by payroll or by the employee themselves warrant testing.","Test approval evidence for a sample of timesheets and identify approvals granted after the pay run.","Where clock-in is remote or app-based, test the location and device controls.","Analyse employees with implausible patterns — identical hours every period, hours exceeding shift length."],"red_flags":["Approvals granted in bulk seconds apart","Amendments concentrated with one supervisor","Employees clocked in at two locations","Manual timesheets replacing system capture for particular teams"],"evidence":["Time and attendance system extract","Approval logs","Amendment audit trail","Payroll register","Shift rosters"],"kpis":["Hours approved vs. paid variance","Amendments per user","Late approvals"],"lens":["ia"],"plain":"People get paid for the hours recorded, so whoever controls the hours controls the cost."},{"id":"IA-PAY-05","industry":["cross"],"process":"Payroll","subprocess":"Overtime, Premiums and Variable Pay","risk":"Overtime, shift premiums, bonuses and commissions are claimed and approved without support, or calculated on the wrong basis.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm that variable pay is earned, supported, correctly calculated and approved within authority.","what_to_review":["Overtime authorisation before it is worked, not after","Premium and allowance eligibility rules and their application","Bonus and commission calculation against plan rules","Approval authority and self-approval risk","Concentration by employee, supervisor and cost centre"],"procedures":["Analyse overtime by employee and supervisor as a percentage of base pay; test the top decile to pre-approval and time records.","Recompute a sample of shift premiums and allowances against the eligibility rules in the agreement or policy.","Recompute a sample of bonus and commission payments against the plan and the approved performance outcome.","Test for supervisors approving their own or a related party's variable pay."],"red_flags":["Overtime approved after the period worked","The same employees at the top of the overtime list every period","Allowances continuing after the qualifying condition ended","Commission paid on cancelled or unpaid sales"],"evidence":["Payroll register with pay element detail","Overtime authorisations","Union agreements and pay policies","Bonus and commission plan documents"],"kpis":["Overtime as % of base pay","Variable pay recomputation errors","Self-approved payments"],"lens":["ia"],"plain":"Overtime and bonuses are the variable part of pay, which makes them the part worth claiming falsely."},{"id":"IA-PAY-06","industry":["cross"],"process":"Payroll","subprocess":"Statutory Deductions and Remittances","risk":"Statutory deductions are calculated on the wrong basis or remitted late, exposing the organisation to interest, penalties and employee claims.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm that statutory deductions are correct, complete and remitted within the required deadlines.","what_to_review":["Tax code and withholding table maintenance and update timing","Pension, social security and levy calculations","Remittance deadlines by jurisdiction and evidence of payment","Year-end reporting and employee statements","Treatment of benefits in kind and taxable allowances"],"procedures":["Recompute statutory deductions for a sample of employees across pay bands and jurisdictions.","Test that withholding tables were updated on the statutory effective date, not later.","Agree remittances to the authority receipts and test the payment date against the deadline; quantify interest and penalties.","Test the treatment of benefits in kind, allowances and expense reimbursements for correct taxability.","Reconcile year-end statements to the payroll ledger."],"red_flags":["Penalties recurring period after period","Tables updated retrospectively after an authority query","Benefits paid through expenses to avoid tax","Reconciling differences at year end carried forward unexplained"],"evidence":["Payroll register and deduction reports","Authority remittance receipts and correspondence","Withholding table configuration","Year-end statements and reconciliations"],"kpis":["Remittances on time %","Penalties and interest incurred","Deduction recomputation errors"],"lens":["ia"],"plain":"Tax and social security deducted from staff belongs to the authorities. Paying it late brings penalties immediately."},{"id":"IA-PAY-07","industry":["cross"],"process":"Payroll","subprocess":"Joiners, Leavers and Final Settlements","risk":"New starters are paid before onboarding is complete and leavers continue to be paid after their exit date, or receive settlements outside policy.","rating":"High","risk_category":"Financial","audit_objective":"Confirm that pay starts and stops on the correct date and that final settlements are calculated and approved correctly.","what_to_review":["Timeliness of new starter set-up and first payment accuracy","Leaver notification from HR to payroll and the cut-off applied","Final settlement components — notice, accrued leave, severance","Approval authority for settlements and ex gratia payments","Recovery of overpayments after exit"],"procedures":["Reconcile the payroll population to the HR active employee list and investigate every difference in both directions.","For all leavers in the period, test that pay ceased on the exit date and recompute the final settlement.","Test severance and ex gratia payments to the approval authority matrix and to any settlement agreement.","Quantify overpayments to leavers and test the recovery outcome.","Test first-payment accuracy for a sample of new starters, including pro-rating."],"red_flags":["Payments continuing one or more periods after exit","Settlements approved by the departing employee's own manager alone","Overpayments written off without attempt at recovery","Leaver notifications arriving after the pay run repeatedly"],"evidence":["HR joiner and leaver reports","Payroll register","Settlement calculations and agreements","Overpayment recovery records"],"kpis":["Payments after exit date","Days from exit to payroll cut-off","Overpayments recovered %"],"lens":["ia"],"plain":"People get paid after they leave more often than anyone expects, and it is rarely recovered."},{"id":"IA-PAY-08","industry":["cross"],"process":"Payroll","subprocess":"Leave and Employee Benefit Accruals","risk":"Accrued leave, long service and benefit liabilities are misstated because entitlement rules are applied inconsistently or balances are never verified.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm that leave and benefit balances reflect entitlement and are accurately valued.","what_to_review":["Entitlement rules by contract type and their configuration","Leave taken recorded against the balance","Carry-over, expiry and cap rules","Valuation basis for the accrual, including on-costs","Long service, sabbatical and other long-term benefit provisions"],"procedures":["Recompute leave balances for a sample of employees from entitlement, accrual and leave taken.","Test that leave actually taken is recorded — compare rosters or absence records to leave deductions.","Test carry-over and expiry rules against policy and identify balances exceeding caps.","Recompute the accrual valuation including employer on-costs and agree to the ledger."],"red_flags":["Employees with balances far above the cap","Leave taken but never deducted from the balance","Accrual valued at current salary where policy requires otherwise","Manual adjustments to balances without approval"],"evidence":["Leave management system extract","Employment contracts and leave policy","Accrual calculations","General ledger balances"],"kpis":["Leave balances above cap","Accrual recomputation variance","Manual balance adjustments"],"lens":["ia"],"plain":"Unused holiday and long-service benefits are a real liability that builds quietly on the balance sheet."},{"id":"IA-PAY-09","industry":["cross"],"process":"Payroll","subprocess":"Payroll Payment Execution and Bank Controls","risk":"The payment file is altered between approval of the payroll and transmission to the bank, or payments are made from accounts outside treasury control.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm that the amount authorised is the amount paid, and that payroll banking is controlled.","what_to_review":["Integrity of the payment file between payroll and bank — hash totals, control counts","Authorisation of the payment file at the bank and dual release","Payroll bank account mandates and signatories","Manual, off-cycle and emergency payments","Returned and unpresented payments"],"procedures":["Agree total value and record count on the approved register to the file transmitted to the bank for a sample of runs.","Test that release at the bank requires two approvers independent of payroll preparation.","Test all off-cycle and manual payments for authorisation and business reason.","Review returned payments and test where the funds were redirected.","Confirm payroll bank mandates against the approved signatory list."],"red_flags":["Payment file totals differing from the approved register","Off-cycle payments used routinely","Returned payments re-issued to a different account","Payroll accounts with signatories no longer employed"],"evidence":["Approved payroll registers","Bank payment files and transmission logs","Bank mandates","Off-cycle payment approvals"],"kpis":["Register to bank file variances","Off-cycle payments per period","Payments released single-handed"],"lens":["ia"],"plain":"The file sent to the bank is what actually pays people. It must match what was approved."},{"id":"IA-PAY-10","industry":["cross"],"process":"Payroll","subprocess":"Outsourced Payroll Provider Oversight","risk":"Payroll is outsourced but the risk is not, and the organisation cannot evidence that the provider's controls actually operate.","rating":"Medium","risk_category":"Strategic","audit_objective":"Assess whether an outsourced payroll arrangement is governed, assured and recoverable.","what_to_review":["Contract terms — service levels, liability, audit rights, data protection","Assurance obtained, such as a service auditor report, and whether it is read","Complementary user entity controls the organisation must perform","Data transfer security and employee data protection","Exit and continuity planning if the provider fails"],"procedures":["Obtain the provider's service auditor report; identify the complementary user controls and test whether the organisation actually performs each one.","Review report exceptions and test whether management assessed their impact.","Test the reconciliation performed on data returned by the provider before it is accepted.","Review the contract for audit rights and data protection terms, and test whether any audit has been exercised.","Assess the continuity plan for running payroll if the provider became unavailable."],"red_flags":["Service auditor report received but never opened","Complementary user controls not even identified","Provider output accepted without reconciliation","No plan for a pay run if the provider fails"],"evidence":["Outsourcing contract","Service auditor reports","Reconciliations of provider output","Service level reporting","Continuity plan"],"kpis":["Complementary controls performed","Report exceptions assessed","Date of last provider review"],"lens":["ia"],"plain":"Using a payroll provider does not transfer the responsibility. If they get it wrong, your staff are unpaid."},{"id":"IA-PAY-11","industry":["cross"],"process":"Payroll","subprocess":"Payroll Reconciliation, Cost Analysis and Ghost Employees","risk":"Payroll is not reconciled to the general ledger or to headcount, so fabricated employees and systematic errors persist undetected.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm payroll costs reconcile to the ledger and to a verified workforce, and test for fictitious employees.","what_to_review":["Reconciliation of payroll to the general ledger and to headcount","Cost per head and payroll cost trend analysis by department","Existence verification of employees","Employees with no leave taken, no deductions or no email account","Bank account and address matching across the population"],"procedures":["Reconcile total payroll cost to the general ledger for each period and test unexplained differences.","Reconcile paid headcount to HR records and to an independent source such as building access or IT accounts; investigate every unmatched name.","Test for employees who never take leave, have no tax deductions, or share bank details with another employee.","For a sample of employees, verify existence through independent confirmation — line manager attestation, access records, or physical verification.","Analyse payroll cost per head by department against expectation."],"red_flags":["Employees with no system account and no leave history","Payroll to ledger differences carried as a rounding plug","Headcount reported by HR differing persistently from payroll","New employees created shortly before the pay run and removed after"],"evidence":["Payroll registers and general ledger","HR headcount reports","Building access and IT account listings","Leave records","Bank detail analytics"],"kpis":["Payroll to GL differences","Unmatched paid employees","Employees with zero leave taken"],"lens":["ia"],"plain":"Comparing payroll to HR records is how you find people being paid who do not exist."},{"id":"IA-O2C-01","industry":["cross"],"process":"Order to Cash","subprocess":"Customer Master Data","risk":"Fictitious or duplicate customers are created, or bank and address details are altered, enabling diverted refunds and concealed related-party sales.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm customer master records are created and amended only on authorised, verified information.","what_to_review":["Authorisation and verification of customer creation and amendment","Duplicate customer detection","Changes to remittance and refund bank details","Related-party and employee matching","Dormant customer reactivation"],"procedures":["Extract the customer master change log and test creations and amendments for authorisation independent of sales.","Run duplicate analytics on name, tax identifier, address and bank account.","Match customer records against employee data for shared addresses, phones and bank accounts.","Test refunds paid to bank details changed shortly before the refund.","Identify dormant customers reactivated in the period and test the first transaction on each."],"red_flags":["Customers created by the salesperson who then sells to them","Refund bank details differing from the collection account","Duplicates that split a single exposure below credit limits","Reactivated dormant accounts with immediate credit balances"],"evidence":["Customer master change log","Sales and refund transaction data","Employee master data","Credit files"],"kpis":["Master changes with authorisation","Duplicate customer exceptions","Refunds to changed bank details"],"lens":["ia"],"plain":"Fake or duplicated customer records are how fictitious sales and diverted refunds are set up."},{"id":"IA-O2C-02","industry":["cross"],"process":"Order to Cash","subprocess":"Credit Assessment and Limits","risk":"Credit is granted without adequate assessment, or limits are set and raised to accommodate a sale rather than to reflect the customer's ability to pay.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether credit decisions are evidence-based, independent of sales, and enforced.","what_to_review":["Credit assessment methodology and information sources","Limit approval authority and independence from sales","Frequency of limit review, especially for the largest exposures","System enforcement of limits at order entry","Credit insurance, guarantees and security held"],"procedures":["Test a sample of new limits to the supporting assessment and the approval authority.","Analyse limit increases and test how many occurred within days of a blocked order.","Compare exposures to limits at several dates and quantify over-limit balances.","Test whether security, guarantees or credit insurance recorded are valid and enforceable.","Test limits not reviewed within the policy cycle for the largest customers."],"red_flags":["Limits raised immediately after an order block","Assessments based only on customer-supplied figures","Security recorded but never perfected","Limits unreviewed for years on major accounts"],"evidence":["Credit files and assessments","Limit master data and change log","Aged receivables","Credit insurance policies and guarantees"],"kpis":["Exposure over limit","Limits raised post-block","Limits reviewed on cycle"],"lens":["ia"],"plain":"Giving credit to someone who cannot pay is a decision to lose money, taken one order at a time."},{"id":"IA-O2C-03","industry":["cross"],"process":"Order to Cash","subprocess":"Order Entry and Acceptance","risk":"Orders are accepted that the organisation cannot fulfil, should not accept, or that carry terms never approved.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm orders are accepted within approved commercial and credit parameters.","what_to_review":["Order entry authorisation and completeness of order data","Blocked-order release and who performs it","Non-standard terms — payment terms, delivery, penalties, retention","Availability and fulfilment feasibility checks","Order acknowledgement and contract formation"],"procedures":["Test blocked orders released in the period and inspect the approval for each.","Sample orders with non-standard terms and trace the approval against delegated authority.","Reconcile orders entered to orders acknowledged and fulfilled; investigate orders cancelled after entry.","Test whether penalty and service-credit clauses accepted at order stage are tracked operationally."],"red_flags":["Blocks released by sales staff","Non-standard terms agreed by email without approval","Orders entered then cancelled repeatedly at period end","Penalty clauses accepted with no one monitoring performance"],"evidence":["Order entry system data","Blocked-order release logs","Customer contracts and terms","Order acknowledgements"],"kpis":["Blocked orders released","Orders with non-standard terms","Order cancellation rate"],"lens":["ia"],"plain":"Accepting an order commits the business to terms it may not be able to meet."},{"id":"IA-O2C-04","industry":["cross"],"process":"Order to Cash","subprocess":"Pricing, Discounts and Rebates","risk":"Prices, discounts and rebates are applied outside approved authority, eroding margin invisibly one transaction at a time.","rating":"High","risk_category":"Financial","audit_objective":"Confirm invoiced prices reflect approved price lists and that discounts and rebates are authorised and earned.","what_to_review":["Price list maintenance and approval","Discount authority by role and value","Manual price overrides at invoicing","Rebate and volume incentive agreements and their accrual","Margin analysis by customer, product and salesperson"],"procedures":["Re-price a sample of invoices from the approved price list and quantify the variance.","Analyse manual price overrides by user and customer; test the largest against approval authority.","Recompute rebates earned against agreements and test the accrual.","Analyse margin by customer and salesperson and investigate the loss-making tail.","Test whether price list changes were approved before activation."],"red_flags":["Discounts clustered just under an approval threshold","Overrides concentrated with one user","Rebates accrued on volumes never achieved","Customers persistently below cost to serve"],"evidence":["Price lists and change logs","Invoice data","Discount approvals","Rebate agreements and accruals"],"kpis":["Price variance on re-pricing","Override value by user","Margin by customer"],"lens":["ia"],"plain":"Discounts and rebates are given away one transaction at a time and rarely reviewed in total."},{"id":"IA-O2C-05","industry":["cross"],"process":"Order to Cash","subprocess":"Despatch, Delivery and Cut-Off","risk":"Goods or services are recorded as delivered when they are not, or delivery is recorded in the wrong period, misstating revenue.","rating":"High","risk_category":"Financial","audit_objective":"Confirm delivery is evidenced and recorded in the correct period.","what_to_review":["Proof of delivery capture and retention","Cut-off procedures at period end","Goods despatched but not invoiced, and invoiced but not despatched","Consignment, bill-and-hold and agency arrangements","Delivery to third-party warehouses or agents"],"procedures":["Test cut-off either side of period end by tracing despatch documents to invoices and to the revenue period recorded.","Reconcile despatches to invoices for the period and age the unbilled and un-despatched populations.","Test the existence of proof of delivery for a sample of the largest period-end sales.","Review bill-and-hold and consignment arrangements against the criteria for recognising revenue."],"red_flags":["A concentration of large despatches on the final days of the period","Proof of delivery missing for the largest transactions","Consignment stock treated as sold","Delivery dates amended after invoicing"],"evidence":["Despatch records and proof of delivery","Invoice register","Period-end cut-off testing schedules","Consignment agreements"],"kpis":["Cut-off errors identified","Despatched not invoiced ageing","POD completeness"],"lens":["ia"],"plain":"Recording a delivery in the wrong period moves profit between years, which is a classic way to flatter results."},{"id":"IA-O2C-06","industry":["cross"],"process":"Order to Cash","subprocess":"Invoicing Accuracy and Completeness","risk":"Deliveries are never invoiced, or invoices are issued with errors that delay payment and trigger disputes.","rating":"High","risk_category":"Financial","audit_objective":"Confirm every delivery is invoiced once, accurately, and on time.","what_to_review":["Completeness of invoicing against delivery","Invoice accuracy — quantity, price, tax, currency, customer details","Timeliness of invoicing after delivery","Sequence control over invoice numbering","Manual and pro-forma invoices outside the main system"],"procedures":["Reconcile delivered volumes to invoiced volumes and quantify the unbilled population and its ageing.","Test invoice numerical sequence for gaps and duplicates.","Sample invoices and re-perform the calculation including tax treatment and currency.","Identify invoices raised outside the main system and test their control and recording.","Measure days from delivery to invoice by business unit."],"red_flags":["Unbilled deliveries ageing beyond the billing cycle","Gaps in invoice sequence with no explanation","Manual invoices used routinely for particular customers","Recurring disputes traced to invoice errors"],"evidence":["Delivery and invoice data","Invoice sequence reports","Tax configuration","Dispute logs"],"kpis":["Unbilled deliveries ageing","Days delivery to invoice","Invoice error rate"],"lens":["ia"],"plain":"Goods delivered but never invoiced is money the business has simply given away."},{"id":"IA-O2C-07","industry":["cross"],"process":"Order to Cash","subprocess":"Credit Notes, Returns and Adjustments","risk":"Credit notes are issued to conceal uncollectable debt, to reverse fictitious sales, or without any authorisation.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm credit notes and adjustments are justified, supported and authorised independently.","what_to_review":["Credit note authorisation limits and independence from sales and collections","Reason codes and their integrity","Credit notes issued after period end against prior-period sales","Returns received and their restocking or scrapping","Write-offs disguised as credit notes"],"procedures":["Analyse credit notes by issuer, customer, value and reason code; test the largest and the most frequent.","Test credit notes raised after period end against sales recorded in the prior period.","Match credit notes for returns to physical evidence that goods came back.","Test whether credit notes are being used in place of a bad debt write-off, which would bypass the write-off authority."],"red_flags":["Credit notes concentrated shortly after period end","Reason code \"other\" dominating","Credits issued by the collector chasing the debt","No goods returned against return-reason credits"],"evidence":["Credit note register with user and reason","Returns receipts","Sales data","Write-off approvals"],"kpis":["Credit notes as % of revenue","Credits by issuer","Post period-end credits"],"lens":["ia"],"plain":"Credit notes reverse sales. They are also the easiest way to hide a debt that was never going to be collected."},{"id":"IA-O2C-08","industry":["cross"],"process":"Order to Cash","subprocess":"Cash Application and Unapplied Cash","risk":"Receipts are misapplied or left unapplied, concealing lapping, misappropriation or genuinely overdue balances.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm receipts are applied promptly and accurately to the correct customer and invoice.","what_to_review":["Timeliness of cash application and the size of unapplied cash","Segregation between cash application, credit control and bank reconciliation","Write-off of small differences and unallocated amounts","Bank reconciliation quality and reconciling item ageing","Lapping indicators across customer accounts"],"procedures":["Age the unapplied and on-account cash and test the reason for the oldest items.","Test that the person applying cash cannot raise credit notes or write off balances.","Analyse receipt application timing for patterns consistent with lapping — receipts applied to progressively older invoices.","Test bank reconciliations for aged reconciling items and unexplained adjustments.","Recompute small-difference write-offs against the tolerance policy."],"red_flags":["Unapplied cash growing period on period","Receipts routinely applied several days late","One person handling receipts, application and write-offs","Reconciling items carried forward for months"],"evidence":["Cash application records and unapplied cash ageing","Bank statements and reconciliations","Write-off approvals","Segregation of duties matrix"],"kpis":["Unapplied cash ageing","Days to apply receipts","Small write-off value"],"lens":["ia"],"plain":"Money received but not matched to an invoice makes the debt look overdue and hides where cash actually went."},{"id":"IA-O2C-09","industry":["cross"],"process":"Order to Cash","subprocess":"Collections and Dispute Management","risk":"Overdue balances are not pursued on schedule and disputes are left unresolved, so recoverable amounts become bad debts.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether collection activity and dispute resolution are timely, escalated and effective.","what_to_review":["Dunning and escalation timetable and adherence to it","Collector workload, targets and performance","Dispute logging, ownership and resolution time","Stop-supply and legal escalation decisions","Use of external collection agencies and their recovery rates"],"procedures":["Test whether escalation steps actually occurred at the policy trigger points for a sample of overdue accounts.","Analyse ageing and recovery performance by collector and by business unit.","Age disputed balances and test the resolution of the oldest; disputes often mask a delivery or invoicing failure.","Test whether stop-supply rules were applied or overridden, and by whom.","Compare recovery rates before and after referral to external agencies."],"red_flags":["Promises to pay recorded repeatedly with no follow-through","Disputes open beyond ninety days with no owner","Stop-supply overridden for the largest debtors","Accounts referred to agencies only once they are uncollectable"],"evidence":["Aged receivables and collector activity notes","Dispute register","Stop-supply override approvals","Agency referral and recovery data"],"kpis":["Days sales outstanding","Disputes over 90 days","Recovery rate after referral"],"lens":["ia"],"plain":"The longer a debt goes unchased, the less of it comes back."},{"id":"IA-O2C-10","industry":["cross"],"process":"Order to Cash","subprocess":"Bad Debt Provision and Write-Offs","risk":"The provision for doubtful debts is understated and write-offs are approved without authority, delaying recognition of losses.","rating":"High","risk_category":"Financial","audit_objective":"Confirm the provision reflects genuine recoverability and that write-offs are properly authorised.","what_to_review":["Provision methodology — ageing based, specific, or expected credit loss","Consistency of application and any management overlay","Write-off authority and evidence of recovery effort before write-off","Recovery of amounts previously written off","Balances with no movement or activity"],"procedures":["Recompute the provision using the stated methodology and test the basis of any management override.","Sample write-offs and test the authority level and the recovery steps taken beforehand.","Identify aged balances not provided for and test the justification, including reliance on informal assurances.","Test subsequent receipts against previously written-off accounts, which can indicate premature write-off or misappropriated recoveries."],"red_flags":["Aged balances excluded from provision on the basis of a verbal assurance","Write-offs approved by the credit manager alone","Recoveries after write-off retained outside the ledger","Provision percentage unchanged despite a deteriorating book"],"evidence":["Aged receivables","Provision calculations","Write-off approvals","Post write-off receipt records"],"kpis":["Provision coverage of aged debt","Write-offs by approver","Post write-off recoveries"],"lens":["ia"],"plain":"Not providing for debts that will never be paid overstates both profit and what the business is owed."},{"id":"IA-O2C-11","industry":["cross"],"process":"Order to Cash","subprocess":"Revenue Recognition Judgements","risk":"Revenue is recognised on terms that do not reflect the contract — before obligations are met, gross where the organisation acts as agent, or without allocating to separate obligations.","rating":"High","risk_category":"Financial","audit_objective":"Confirm revenue recognition reflects the substance of customer contracts.","what_to_review":["Identification of performance obligations in customer contracts","Timing — point in time versus over time","Gross versus net presentation where a third party is involved","Variable consideration, rebates, penalties and refund rights","Side agreements and non-standard terms outside the contract file"],"procedures":["Read a sample of significant contracts and test whether recognition follows the obligations and terms actually written.","Test arrangements involving a third party for principal versus agent indicators and the resulting presentation.","Test the estimation of variable consideration and whether constraints were applied.","Enquire of sales staff about side letters and verbal commitments, and search correspondence for terms absent from the contract file.","Test contracts modified near period end for their effect on recognition."],"red_flags":["Side letters granting return rights not in the master contract","Gross presentation where the organisation carries no inventory risk","Long-term contracts recognised on invoicing rather than progress","Contract modifications concentrated at period end"],"evidence":["Customer contracts and amendments","Revenue recognition policy and memoranda","Sales correspondence","Period-end contract modifications"],"kpis":["Contracts reviewed for obligations","Gross vs. net reassessments","Side agreements identified"],"lens":["ia"],"plain":"When revenue is recognised is a judgement, and judgements around year end get pressure applied to them."},{"id":"IA-P2P-01","industry":["cross"],"process":"Procure to Pay","subprocess":"Vendor Master Data","risk":"Fictitious vendors are created, or bank details on genuine vendors are altered, so payments leave the organisation to accounts controlled by a fraudster.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm vendor records are created and amended only on verified, authorised information.","what_to_review":["Authorisation and independent verification of vendor creation and bank changes","Call-back verification to independently obtained contact details","Duplicate vendor detection","Employee-to-vendor data matching","Dormant vendor reactivation and one-time vendor use"],"procedures":["Extract the vendor master change log and test creations and bank changes for independent verification evidence.","Match the vendor master against employee data on bank account, address, tax identifier and phone.","Run duplicate analytics across name, bank account and tax identifier; quantify spend flowing through duplicates.","Identify vendors reactivated after dormancy and test the first payment following reactivation.","Test one-time and manual vendor payments for approval and business justification."],"red_flags":["Bank change immediately followed by a large payment","Vendors sharing a bank account with each other or an employee","Vendor created and paid within the same day","Verification evidenced by an email from the address that requested the change"],"evidence":["Vendor master change log with user and timestamp","Employee master data","Accounts payable spend by vendor","Bank verification records"],"kpis":["Changes with verified call-back","Employee-vendor matches","Spend through one-time vendors"],"lens":["ia"],"plain":"Set up a fake supplier, or change a real one's bank details, and payments walk straight out of the company."},{"id":"IA-P2P-02","industry":["cross"],"process":"Procure to Pay","subprocess":"Vendor Selection, Tendering and Contracting","risk":"Suppliers are awarded work without competition or on terms that favour them, often where a personal interest exists.","rating":"High","risk_category":"Fraud","audit_objective":"Assess whether sourcing is competitive, documented and free from undisclosed interest.","what_to_review":["Tender thresholds and adherence to them","Evaluation criteria, scoring and evaluator independence","Single and sole-source justifications","Conflict of interest declarations from evaluators","Contract award terms versus what was tendered"],"procedures":["Quantify spend awarded without competition and test the justification for the largest.","Re-perform the scoring on a sample of tenders and test whether the award followed the evaluation.","Test evaluator conflict declarations and match evaluators to winning suppliers for connections.","Compare final contract terms to the tendered terms and identify post-award concessions.","Test for purchases split to fall below the tender threshold."],"red_flags":["Sole-source justification citing urgency repeatedly","Scoring changed after bids were opened","The same supplier winning every category with one buyer","Contracts amended in the supplier's favour shortly after award"],"evidence":["Tender files and evaluation records","Contract register","Conflict of interest declarations","Spend analysis by supplier and buyer"],"kpis":["% spend competitively tendered","Single-source awards","Post-award concessions"],"lens":["ia"],"plain":"Awarding work without competition costs money, and is often where undisclosed personal interests hide."},{"id":"IA-P2P-03","industry":["cross"],"process":"Procure to Pay","subprocess":"Requisition and Purchase Order Authorisation","risk":"Commitments are made without budget or authority, so the organisation is bound to spend that was never approved.","rating":"High","risk_category":"Financial","audit_objective":"Confirm purchase commitments are authorised within delegated authority and budget before they are made.","what_to_review":["Delegated authority matrix and its configuration in the system","Budget availability checking at requisition","Retrospective purchase orders raised after the invoice arrives","Order splitting below approval thresholds","Blanket and standing orders and their monitoring"],"procedures":["Test the system configuration of approval limits against the delegated authority matrix.","Quantify purchase orders raised on or after the invoice date and test the reason for each.","Analyse orders clustering just below authority thresholds by requisitioner.","Test blanket order utilisation against approved values and expiry.","Test a sample of orders for budget availability checking at the time of commitment."],"red_flags":["A high proportion of retrospective orders in one department","Values repeatedly just under a threshold","Approvers approving their own requisitions through delegation","Blanket orders extended year after year without re-approval"],"evidence":["Purchase order data with approval trail","Delegated authority matrix","System workflow configuration","Budget reports"],"kpis":["Retrospective PO rate","Orders near threshold","PO coverage of spend"],"lens":["ia"],"plain":"An approved order is the point at which the company becomes committed to spend. After that it is too late."},{"id":"IA-P2P-04","industry":["cross"],"process":"Procure to Pay","subprocess":"Goods Receipt and Service Confirmation","risk":"Goods or services are recorded as received when they were not, allowing payment for nothing — the hardest step to verify for services.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm receipt is independently evidenced before payment, including for services and intangibles.","what_to_review":["Segregation between ordering, receiving and payment approval","Evidence required to confirm receipt of services and consultancy","Receipts entered by the requisitioner","Quantity and quality verification against the order","Goods received not invoiced ageing"],"procedures":["Test whether the person confirming receipt is independent of the person who ordered, and quantify exceptions.","For service purchases, test the evidence supporting confirmation — deliverables, timesheets, reports — rather than an approval click.","Reconcile goods received to purchase orders and to invoices; investigate receipts with no order.","Age the goods received not invoiced balance and test the oldest items for validity."],"red_flags":["Receipt confirmed on the same day the invoice was entered","Consultancy accepted with no deliverable on file","One person ordering and receiving in a remote location","GRNI balances aged over a year and never cleared"],"evidence":["Goods receipt records","Purchase orders and invoices","Service deliverables and timesheets","GRNI ageing reports"],"kpis":["Receipts by the requisitioner","GRNI ageing","Service spend with deliverable evidence"],"lens":["ia"],"plain":"Confirming that goods or services arrived is what stops the company paying for nothing, and it is hardest to prove for services."},{"id":"IA-P2P-05","industry":["cross"],"process":"Procure to Pay","subprocess":"Invoice Processing and Three-Way Match","risk":"Invoices are paid without matching to an order and a receipt, so overbilling and unordered supply are paid in full.","rating":"High","risk_category":"Financial","audit_objective":"Confirm invoices are matched to order and receipt, and that exceptions are resolved rather than overridden.","what_to_review":["Three-way match configuration and tolerance settings","Volume and pattern of match exceptions and overrides","Invoices paid without a purchase order and their approval route","Coding accuracy and approval of expense allocation","Optical character recognition and automated posting controls"],"procedures":["Quantify invoices paid without a matched order or receipt and test the approval for a sample.","Analyse match tolerance overrides by user and value; test whether tolerances are set at a level that makes the match meaningful.","Re-perform the match on a sample of paid invoices and quantify variances.","Test invoices coded to unusual or generic accounts for validity."],"red_flags":["Tolerances so wide that almost nothing fails the match","Overrides concentrated with a small number of users","Non-PO invoices used routinely by a department","Invoices approved by the person who requested and received"],"evidence":["Invoice register with match status","Tolerance configuration","Override reports","General ledger coding"],"kpis":["Non-PO invoice %","Match overrides by user","Match variance value"],"lens":["ia"],"plain":"Matching the invoice to the order and the delivery is the basic check that stops overbilling."},{"id":"IA-P2P-06","industry":["cross"],"process":"Procure to Pay","subprocess":"Payment Execution and Banking","risk":"The payment file is altered after approval, or payments are released outside the normal run, moving funds without the approvals the process assumes.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm that only approved invoices are paid, in the approved amount, to the approved account.","what_to_review":["Payment run preparation, review and dual release at the bank","Integrity of the file between the ledger and the bank","Manual, urgent and emergency payments","Bank mandates and signatory currency","Positive pay or equivalent bank-side controls"],"procedures":["Agree the total and record count of an approved payment proposal to the file transmitted to the bank.","Test that bank release requires two approvers independent of invoice processing, including for urgent payments.","Extract all manual and emergency payments and test authorisation and justification for each.","Confirm mandates and signatories against the approved list and identify leavers still authorised."],"red_flags":["Urgent payments used routinely rather than exceptionally","File totals differing from the approved proposal","Payments to vendors added on the day of the run","Signatories who left months ago still active"],"evidence":["Payment proposals and approvals","Bank transmission logs and files","Bank mandates","Manual payment approvals"],"kpis":["Manual payments per period","Proposal to file variances","Mandate exceptions"],"lens":["ia"],"plain":"This is the moment cash actually leaves. Everything before it is preparation."},{"id":"IA-P2P-07","industry":["cross"],"process":"Procure to Pay","subprocess":"Duplicate and Erroneous Payments","risk":"The same invoice is paid twice, or paid to the wrong vendor, and the loss is never identified because no one looks.","rating":"Medium","risk_category":"Financial","audit_objective":"Determine whether duplicate and erroneous payments occur and whether they are detected
