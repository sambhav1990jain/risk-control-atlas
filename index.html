 identified, investigation and reporting to the Audit Committee.","population":"Override monitoring reports; minutes","sample":"All quarters in period","industry":["cross"],"lens":["icfr"]},{"control_id":"ELC-10","process":"Governance & Entity Level Controls","subprocess":"Information & Communication","risk_id":"R-ELC-10","risk":"Accounting policies are inconsistently applied because they are not documented or communicated.","rating":"Medium","control_objective":"Ensure accounting policies are documented, current and applied consistently.","control":"A group accounting manual documents policies for significant transactions, is reviewed annually for changes in the reporting framework, and is communicated to all reporting entities. Departures require Group Financial Controller approval.","control_type":"Preventive","control_nature":"Manual","frequency":"Annual","assertions":"P&D, A/V","coso":"Information & Communication","key_control":"Yes","fraud":"No","owner":"Group Financial Controller","sod":"Departures approved centrally rather than determined locally.","test_design":"Inspect the accounting manual, the annual review process and the departure approval requirement.","test_oe":"Inspect the annual review performed, changes made for new requirements, evidence of communication, and any approved departures.","population":"Group accounting manual; review records","sample":"Annual review","industry":["cross"],"lens":["icfr"]},{"control_id":"TL-REV-01","process":"Freight Revenue & Billing","subprocess":"Revenue Recognition","risk_id":"R-TL-REV-01","risk":"Freight revenue is recognised on despatch rather than over the transit period, overstating revenue at period end for shipments still in transit.","rating":"High","control_objective":"Ensure freight revenue is recognised as the performance obligation is satisfied, with in-transit shipments deferred.","control":"At each month end the Revenue Accounting Manager calculates the in-transit revenue deferral using the delivered-versus-despatched shipment report and average transit days by lane, and reviews the calculation against the prior month and volume trends before posting.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"CO, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Revenue Accounting Manager","sod":"Preparer of the deferral calculation is independent of operations reporting shipment status.","test_design":"Inspect the deferral methodology and confirm it reflects the transit-period recognition policy under IFRS 15 / ASC 606.","test_oe":"For a sample of months, re-perform the deferral using the underlying shipment report and agree the journal entry posted.","population":"Monthly in-transit deferral calculations and supporting shipment reports","sample":"3 of 12 months","industry":["logistics"],"lens":["icfr"]},{"control_id":"TL-REV-02","process":"Freight Revenue & Billing","subprocess":"Fuel Surcharge","risk_id":"R-TL-REV-02","risk":"Fuel surcharge is billed at a rate inconsistent with the published index or the contractual cap, misstating revenue.","rating":"Medium","control_objective":"Ensure the fuel surcharge applied in billing agrees to the published index and contractual terms.","control":"Weekly, the Pricing Analyst updates the fuel surcharge table from the published index and a second analyst independently agrees the uploaded rate to the index source before the table is activated in the rate engine.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Weekly","assertions":"A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Pricing Manager","sod":"Preparer of the rate upload cannot approve activation of the rate table.","test_design":"Inspect the surcharge procedure and rate engine configuration confirming dual sign-off before activation.","test_oe":"Select a sample of weeks; agree the activated surcharge rate to the published index and inspect independent review evidence.","population":"Weekly fuel surcharge table updates","sample":"25 of 52 weeks","industry":["logistics"],"lens":["icfr"]},{"control_id":"TL-REV-03","process":"Freight Revenue & Billing","subprocess":"Unbilled Revenue","risk_id":"R-TL-REV-03","risk":"Delivered shipments remain unbilled at period end and unbilled revenue is not accrued, understating revenue and receivables.","rating":"High","control_objective":"Ensure all delivered but uninvoiced shipments are identified and accrued at period end.","control":"At month end the Billing Manager reviews the aged unbilled shipment report, investigates items ageing beyond five days, and the Controller reviews and approves the resulting unbilled revenue accrual.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Controller","sod":"Billing staff resolving unbilled items do not approve the accrual.","test_design":"Inspect the unbilled reporting process and evidence of Controller review and approval.","test_oe":"For a sample of months, agree the accrual to the aged unbilled report and inspect investigation of aged items.","population":"Monthly unbilled shipment reports and accrual journals","sample":"3 of 12 months","industry":["logistics"],"lens":["icfr"]},{"control_id":"TL-COST-01","process":"Network Operations","subprocess":"Purchased Transportation Accrual","risk_id":"R-TL-COST-01","risk":"Purchased transportation costs for moves completed but not yet invoiced by carriers are omitted, understating cost of sales.","rating":"High","control_objective":"Ensure accrued purchased transportation is complete and based on contracted rates.","control":"At month end the Transportation Controller accrues purchased transportation for completed loads without carrier invoices, valued at the rate confirmation, and reviews the accrual against subsequent invoicing in the following month (lookback analysis).","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, CO","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Transportation Controller","sod":"Operations staff confirming load completion are independent of the accrual preparer.","test_design":"Inspect the accrual methodology and the lookback analysis comparing prior accruals to actual invoices.","test_oe":"Re-perform the accrual for a sample of months from the completed-load report and rate confirmations; review lookback variances.","population":"Monthly purchased transportation accruals and lookback analyses","sample":"3 of 12 months","industry":["logistics"],"lens":["icfr"]},{"control_id":"TL-CLM-01","process":"Cargo Claims","subprocess":"Claims Provision","risk_id":"R-TL-CLM-01","risk":"The provision for cargo loss and damage claims is understated because reported incidents are not fully captured or are valued below expected settlement.","rating":"Medium","control_objective":"Ensure the cargo claims provision reflects all reported incidents at an appropriate estimate of settlement value.","control":"Quarterly, the Claims Manager reconciles the claims register to the OS&D incident log and to the general ledger provision, and the Controller reviews the actuarial or historical settlement-ratio assumption applied to open claims.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Controller","sod":"Claims handlers who set individual reserves do not approve the aggregate provision assumption.","test_design":"Inspect the reconciliation template and evidence of Controller review of the settlement assumption.","test_oe":"For a sample of quarters, re-perform the reconciliation and recompute the provision using the approved settlement ratio.","population":"Quarterly claims reconciliations and provision calculations","sample":"2 of 4 quarters","industry":["logistics"],"lens":["icfr"]},{"control_id":"TL-FA-01","process":"Fleet & Asset Management","subprocess":"Fleet Depreciation & Residuals","risk_id":"R-TL-FA-01","risk":"Vehicle useful lives and residual values are not revised for changes in fleet strategy or used-vehicle markets, misstating depreciation.","rating":"Medium","control_objective":"Ensure fleet useful lives and residual values remain supportable and are reviewed at least annually.","control":"Annually the Fixed Asset Manager compares realised disposal proceeds against carried residual values by vehicle class and presents proposed revisions to the Controller for approval before the depreciation run is updated.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Annual","assertions":"A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Fixed Asset Manager","sod":"Preparer of the residual analysis does not approve the change to master data.","test_design":"Inspect the annual review procedure and evidence of Controller approval of assumption changes.","test_oe":"Obtain the most recent review; recompute the proceeds-to-residual comparison and agree approved changes to the asset master.","population":"Annual fleet residual value reviews","sample":"1 of 1","industry":["logistics"],"lens":["icfr"]},{"control_id":"BNK-01","process":"Credit & Lending","subprocess":"Loan Origination","risk_id":"R-BNK-01","risk":"Loans are advanced to borrowers who do not meet credit policy, or on terms outside delegated lending authority, leading to elevated default and impairment.","rating":"High","control_objective":"Ensure credit is granted only within approved policy and delegated lending authority.","control":"Every credit application is scored and reviewed against the credit policy by an underwriter independent of the relationship manager, and approved at the authority level set by exposure size in the delegated lending authority matrix before funds are released.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, R&O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Credit Risk","sod":"The relationship manager who originates the application cannot approve it or release the funds.","test_design":"Inspect the credit policy, delegated authority matrix and origination workflow to confirm system-enforced approval limits.","test_oe":"Select a sample of loans advanced; agree the approval to the authority matrix and inspect the independent underwriting assessment.","population":"All loans advanced during the period","sample":"40 (per transaction, IT-dependent manual)","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-02","process":"Credit & Lending","subprocess":"Expected Credit Loss","risk_id":"R-BNK-02","risk":"The expected credit loss allowance is understated because staging criteria, macroeconomic scenarios or post-model overlays are not applied consistently.","rating":"High","control_objective":"Ensure the ECL allowance is calculated using approved models, inputs and overlays, and is subject to independent review.","control":"Quarterly, the Model Risk function independently validates ECL model outputs, staging migration and scenario weightings, and all management overlays are documented, quantified and approved by the Provisions Committee before the allowance is booked.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"A/V, C","coso":"Risk Assessment","key_control":"Yes","fraud":"No","owner":"Chief Risk Officer","sod":"Model owners in Credit Risk are separate from the Model Risk validation function.","test_design":"Inspect the model governance framework, validation reports and Provisions Committee terms of reference.","test_oe":"For a sample of quarters, agree the booked allowance to the approved committee paper and re-perform the overlay calculation.","population":"Quarterly ECL calculations, validation reports and committee minutes","sample":"2 of 4 quarters","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-03","process":"Treasury","subprocess":"Regulatory Capital Reporting","risk_id":"R-BNK-03","risk":"Risk-weighted assets are misclassified, misstating the regulatory capital ratio reported to the regulator.","rating":"High","control_objective":"Ensure exposures are assigned the correct risk weight and capital returns reconcile to the general ledger.","control":"Monthly, the Regulatory Reporting Manager reconciles the capital return to the general ledger and to the source exposure systems, and reviews a risk-weight assignment exception report before the Chief Financial Officer signs the return.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Head of Regulatory Reporting","sod":"Preparer of the return does not approve or submit it.","test_design":"Inspect the reconciliation template, the exception report logic and the sign-off protocol.","test_oe":"For a sample of months, re-perform the reconciliation and inspect resolution of risk-weight exceptions.","population":"Monthly regulatory capital returns and reconciliations","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-04","process":"Deposits & Payments","subprocess":"Suspense and Nostro Accounts","risk_id":"R-BNK-04","risk":"Unreconciled items in suspense and nostro accounts conceal misappropriation or processing errors.","rating":"High","control_objective":"Ensure suspense and nostro accounts are reconciled and aged items are cleared and investigated.","control":"Daily nostro and suspense reconciliations are prepared by Operations and reviewed by a supervisor; items ageing beyond 30 days are escalated monthly to the Financial Controller with a documented clearance plan.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"E/O, A/V, C","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Financial Controller","sod":"The preparer of the reconciliation cannot post clearing entries without independent review.","test_design":"Inspect the reconciliation procedure, ageing report and escalation protocol.","test_oe":"For a sample of days, inspect the reconciliation and supervisory review; test the ageing report for items cleared without support.","population":"Daily nostro and suspense reconciliations","sample":"25 of the period","industry":["banking"],"lens":["icfr"]},{"control_id":"INS-01","process":"Claims","subprocess":"Claims Handling and Settlement","risk_id":"R-INS-01","risk":"Fraudulent or duplicate claims are settled, or claims are paid outside the handler's settlement authority.","rating":"High","control_objective":"Ensure claims are validated against policy cover and settled within delegated authority.","control":"Each claim is validated against policy cover and the claims system enforces settlement authority by value; claims above the handler limit require review by a claims manager, and all settlements are screened against duplicate and fraud indicator rules before payment release.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Claims Director","sod":"The handler who assesses the claim cannot release the payment.","test_design":"Inspect the settlement authority configuration and the fraud rule set in the claims system.","test_oe":"Select a sample of settled claims; agree the settlement to policy cover, authority limit and evidence of fraud screening.","population":"All claims settled during the period","sample":"40 (per transaction, IT-dependent manual)","industry":["insurance"],"lens":["icfr"]},{"control_id":"INS-02","process":"Reserving","subprocess":"IBNR and Case Reserves","risk_id":"R-INS-02","risk":"Reserves for incurred but not reported claims are understated through inappropriate development factors or unsupported management adjustments.","rating":"High","control_objective":"Ensure technical reserves are actuarially determined, independently reviewed and adjusted only with documented justification.","control":"Quarterly, the Appointed Actuary calculates reserves using approved methodology; results are peer-reviewed by an independent actuary, and any management adjustment to the actuarial central estimate is documented and approved by the Reserving Committee.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"A/V, C","coso":"Risk Assessment","key_control":"Yes","fraud":"No","owner":"Chief Actuary","sod":"The reserving actuary is independent of underwriting and claims settlement.","test_design":"Inspect the reserving methodology, peer review protocol and Reserving Committee terms of reference.","test_oe":"For a sample of quarters, agree booked reserves to the actuarial report and inspect approval of any management adjustment.","population":"Quarterly actuarial reserve reports and committee minutes","sample":"2 of 4 quarters","industry":["insurance"],"lens":["icfr"]},{"control_id":"INS-03","process":"Underwriting","subprocess":"Premium Recognition and Unearned Premium","risk_id":"R-INS-03","risk":"Premium is recognised on binding rather than over the policy period, overstating earned premium and understating the unearned premium reserve.","rating":"High","control_objective":"Ensure premium is earned over the period of cover and the unearned premium reserve is complete.","control":"Monthly, the Financial Reporting Manager reconciles written premium from the policy administration system to the general ledger and recalculates the unearned premium reserve on a pro-rata basis, with Controller review of the movement against policy volumes.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"CO, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Preparer of the reserve calculation is independent of underwriting.","test_design":"Inspect the earning methodology and evidence of Controller review.","test_oe":"Re-perform the unearned premium calculation for a sample of months and agree to the ledger.","population":"Monthly premium reconciliations and UPR calculations","sample":"3 of 12 months","industry":["insurance"],"lens":["icfr"]},{"control_id":"INS-04","process":"Reinsurance","subprocess":"Reinsurance Recoveries","risk_id":"R-INS-04","risk":"Reinsurance recoveries are not claimed on qualifying losses, or are recognised against treaties that do not cover the loss.","rating":"Medium","control_objective":"Ensure reinsurance recoveries recognised are complete, valid and collectable.","control":"Quarterly, the Reinsurance Manager reconciles ceded losses to treaty terms and to reinsurer confirmations, reviews recovery ageing and reinsurer credit ratings, and the Controller approves any provision against doubtful recoveries.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"E/O, R&O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Reinsurance Manager","sod":"Recovery calculation and provision approval are performed by different individuals.","test_design":"Inspect the reconciliation approach, ageing review and credit assessment procedure.","test_oe":"For a sample of quarters, agree recoveries to treaty terms and reinsurer confirmations.","population":"Quarterly reinsurance reconciliations and confirmations","sample":"2 of 4 quarters","industry":["insurance"],"lens":["icfr"]},{"control_id":"MFG-01","process":"Production & Costing","subprocess":"Standard Cost and Variance","risk_id":"R-MFG-01","risk":"Standard costs are not updated for input price and yield changes, so inventory is misvalued and variances absorb the error.","rating":"High","control_objective":"Ensure standard costs remain supportable and material variances are analysed and resolved.","control":"Annually the Cost Accounting Manager rolls standard costs using current material, labour and overhead rates with Controller approval; monthly, purchase price and usage variances are analysed by cost centre and explanations above threshold are documented and reviewed.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Cost Accounting Manager","sod":"Standard cost changes are approved by someone other than the preparer.","test_design":"Inspect the standard cost roll procedure, threshold definition and variance review template.","test_oe":"For a sample of months, re-perform variance calculations and inspect documented explanations and review.","population":"Monthly variance analyses and the annual standard cost roll","sample":"3 of 12 months","industry":["manufacturing"],"lens":["icfr"]},{"control_id":"MFG-02","process":"Inventory & Costing","subprocess":"Physical Inventory and Cycle Counts","risk_id":"R-MFG-02","risk":"Recorded inventory quantities differ from physical stock because counts are infrequent, poorly controlled, or adjustments are posted without approval.","rating":"High","control_objective":"Ensure inventory quantities are verified by count and adjustments are authorised.","control":"Cycle counts are performed to a risk-based schedule covering all A-class items quarterly; counters are independent of stores custody, variances above tolerance are recounted, and all inventory adjustments require Plant Controller approval before posting.","control_type":"Detective","control_nature":"Manual","frequency":"Monthly","assertions":"E/O, C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Plant Controller","sod":"Count teams are independent of warehouse custody; the person recounting is not the original counter.","test_design":"Inspect the cycle count programme, coverage schedule and adjustment approval workflow.","test_oe":"Attend a count; for a sample of periods, agree count sheets to system adjustments and inspect approval.","population":"Cycle count records and inventory adjustment postings","sample":"25 adjustments","industry":["manufacturing"],"lens":["icfr"]},{"control_id":"MFG-03","process":"Inventory & Costing","subprocess":"Obsolete and Slow-Moving Provision","risk_id":"R-MFG-03","risk":"Provision for obsolete and slow-moving inventory is understated because ageing data is inaccurate or engineering change notices are not reflected.","rating":"Medium","control_objective":"Ensure the inventory provision reflects ageing, demand and product lifecycle status.","control":"Quarterly, Supply Chain and Finance jointly review the inventory ageing and slow-moving report against forecast demand and engineering change notices, and the resulting provision is approved by the Controller.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Quarterly","assertions":"A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Supply chain proposes the provision; Finance independently reviews and approves it.","test_design":"Inspect the provision policy, ageing report logic and evidence of joint review.","test_oe":"For a sample of quarters, re-perform the provision using the ageing report and inspect approval.","population":"Quarterly inventory provision calculations and ageing reports","sample":"2 of 4 quarters","industry":["manufacturing"],"lens":["icfr"]},{"control_id":"MFG-04","process":"Quality & Product Safety","subprocess":"Warranty Provision","risk_id":"R-MFG-04","risk":"The warranty provision does not reflect emerging failure rates or an announced recall, understating liabilities.","rating":"Medium","control_objective":"Ensure the warranty provision reflects current claims experience and known product issues.","control":"Quarterly, the Quality Director provides failure rate and claims data by product line to Finance, which recalculates the warranty provision; recalls and known field issues are separately assessed and approved by the Controller.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Quality data provider is independent of the finance preparer of the provision.","test_design":"Inspect the provision methodology and the process for capturing field issues and recalls.","test_oe":"For a sample of quarters, recompute the provision from claims data and inspect Controller approval.","population":"Quarterly warranty provision calculations and quality claims data","sample":"2 of 4 quarters","industry":["manufacturing"],"lens":["icfr"]},{"control_id":"RTL-01","process":"Store Operations","subprocess":"Cash and Point of Sale","risk_id":"R-RTL-01","risk":"Store cash takings are misappropriated or short-banked, concealed through unauthorised voids, refunds and no-sale transactions.","rating":"High","control_objective":"Ensure store takings are complete, banked intact and reconciled to point-of-sale records.","control":"Daily, the store manager reconciles till readings to cash counted and to the banking slip; voids, refunds and no-sale transactions above threshold require supervisor authorisation at the till, and head office reviews an exception report of till variances and refund patterns by store weekly.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"E/O, C","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Retail Operations Director","sod":"The cashier operating the till does not perform the end-of-day count alone; banking is verified independently at head office.","test_design":"Inspect the daily reconciliation procedure, till authorisation configuration and the weekly exception report.","test_oe":"For a sample of store-days, agree till readings to counted cash and bank credit; review exception report follow-up.","population":"Daily store cash reconciliations and weekly exception reports","sample":"40 store-days","industry":["retail"],"lens":["icfr"]},{"control_id":"RTL-02","process":"Merchandising","subprocess":"Vendor Rebates and Trading Terms","risk_id":"R-RTL-02","risk":"Supplier rebates are recognised before the earning conditions are met, overstating margin.","rating":"High","control_objective":"Ensure rebate income is recognised only when the contractual conditions are satisfied and is supported by agreements.","control":"Quarterly, the Commercial Finance Manager reconciles accrued rebates to signed supplier agreements and purchase volumes, and material rebates are confirmed with the supplier before recognition; the Controller reviews and approves the rebate accrual.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Quarterly","assertions":"E/O, CO, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Financial Controller","sod":"Buyers who negotiate rebates do not calculate or approve the accrual.","test_design":"Inspect the rebate recognition policy, agreement repository and confirmation process.","test_oe":"For a sample of quarters, agree accrued rebates to signed agreements and volume data; inspect supplier confirmations.","population":"Quarterly rebate accruals and supplier agreements","sample":"2 of 4 quarters","industry":["retail"],"lens":["icfr"]},{"control_id":"RTL-03","process":"Inventory & Costing","subprocess":"Shrinkage and Stock Loss","risk_id":"R-RTL-03","risk":"Inventory shrinkage from theft, process error or supplier short-delivery is absorbed into cost of sales without identification or correction.","rating":"High","control_objective":"Ensure shrinkage is measured by store, investigated and reflected in the financial statements.","control":"Stores are counted at least twice a year by an independent count provider; shrinkage is calculated by store and category, stores above the shrinkage threshold are subject to a loss-prevention review, and the shrinkage accrual between counts is approved by the Controller.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Loss Prevention Director","sod":"Count provider is independent of store management whose results are being measured.","test_design":"Inspect the count programme, shrinkage calculation and loss-prevention escalation criteria.","test_oe":"For a sample of stores, agree count results to system adjustments; inspect escalation for stores above threshold.","population":"Store count results and shrinkage accrual calculations","sample":"25 stores","industry":["retail"],"lens":["icfr"]},{"control_id":"RTL-04","process":"Customer Revenue & Loyalty","subprocess":"Gift Cards and Loyalty","risk_id":"R-RTL-04","risk":"Gift card and loyalty liabilities are understated, or breakage is recognised without a supportable redemption history.","rating":"Medium","control_objective":"Ensure gift card and loyalty obligations are completely recorded and breakage is supportable.","control":"Monthly, the Revenue Accountant reconciles the gift card and loyalty liability to the issuing platform, and breakage is recognised only using the redemption pattern approved annually by the Controller and revisited against actual redemption experience.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Revenue Accounting Manager","sod":"The person maintaining the loyalty platform does not approve the breakage assumption.","test_design":"Inspect the reconciliation, the breakage methodology and evidence of annual reassessment.","test_oe":"For a sample of months, re-perform the reconciliation and recompute breakage on the approved basis.","population":"Monthly liability reconciliations and the annual breakage assessment","sample":"3 of 12 months","industry":["retail"],"lens":["icfr"]},{"control_id":"AVN-01","process":"Flight Revenue","subprocess":"Passenger Revenue and Unflown Tickets","risk_id":"R-AVN-01","risk":"Revenue is recognised on ticket sale rather than on flight, overstating revenue and understating the unflown ticket liability.","rating":"High","control_objective":"Ensure passenger revenue is recognised when the flight is flown and the air traffic liability is complete.","control":"Monthly, the Revenue Accounting Manager reconciles tickets sold, flown, refunded and expired from the revenue accounting system to the air traffic liability in the general ledger, and the Controller reviews the liability movement and the expiry recognition against the approved policy.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"CO, C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Revenue Accounting Manager","sod":"Preparer of the liability reconciliation is independent of sales and distribution.","test_design":"Inspect the revenue recognition policy and the air traffic liability reconciliation template.","test_oe":"For a sample of months, re-perform the reconciliation and agree flown revenue to flight coupon data.","population":"Monthly air traffic liability reconciliations","sample":"3 of 12 months","industry":["aviation"],"lens":["icfr"]},{"control_id":"AVN-02","process":"Ground Operations","subprocess":"Ground Handling Billing","risk_id":"R-AVN-02","risk":"Ground handling services performed for airline customers are not billed, or are billed below the contracted tariff.","rating":"High","control_objective":"Ensure all ground handling services performed are captured and billed at contracted rates.","control":"The station reconciles daily service delivery records to flight movement data, and the billing system prices services from the contracted tariff table; the Station Manager reviews an unbilled services report weekly and approves manual rate overrides.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Weekly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Station Manager","sod":"Staff recording service delivery do not maintain the tariff table.","test_design":"Inspect the service capture process, tariff configuration and unbilled report.","test_oe":"For a sample of weeks, reconcile flight movements to services billed and re-price a sample of invoices to contract.","population":"Weekly service delivery and billing reconciliations","sample":"25 of 52 weeks","industry":["aviation"],"lens":["icfr"]},{"control_id":"AVN-03","process":"Fleet & Engineering","subprocess":"Maintenance Reserves and Component Overhaul","risk_id":"R-AVN-03","risk":"Provisions for scheduled airframe and engine overhauls on leased aircraft are misstated because utilisation or overhaul cost assumptions are outdated.","rating":"High","control_objective":"Ensure maintenance provisions reflect actual utilisation and current overhaul cost estimates.","control":"Quarterly, Engineering supplies flight hours and cycles by aircraft and the latest overhaul cost estimates; Finance recalculates the maintenance provision per lease terms and the Controller approves changes to the cost assumption.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Quarterly","assertions":"A/V, C","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Engineering provides utilisation data; Finance independently calculates and Controller approves.","test_design":"Inspect the provisioning methodology against lease return conditions and the assumption approval process.","test_oe":"For a sample of quarters, recompute the provision using utilisation data and approved cost assumptions.","population":"Quarterly maintenance provision calculations and utilisation reports","sample":"2 of 4 quarters","industry":["aviation"],"lens":["icfr"]},{"control_id":"AVN-04","process":"Fuel & Hedging","subprocess":"Fuel Procurement and Hedging","risk_id":"R-AVN-04","risk":"Fuel hedge accounting is applied to instruments that do not qualify, or hedge positions exceed the mandate approved by the board.","rating":"Medium","control_objective":"Ensure fuel hedging operates within the approved mandate and hedge accounting is properly supported.","control":"Monthly, Treasury reports open hedge positions against the board-approved mandate limits, and hedge effectiveness testing and documentation are prepared by Financial Reporting and reviewed by the Controller before hedge accounting is applied.","control_type":"Detective","control_nature":"Manual","frequency":"Monthly","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Treasurer","sod":"The dealer executing hedges does not perform effectiveness testing or confirm positions.","test_design":"Inspect the treasury mandate, hedge documentation standard and effectiveness testing methodology.","test_oe":"For a sample of months, agree open positions to the mandate and inspect effectiveness testing documentation.","population":"Monthly hedge position reports and effectiveness testing files","sample":"3 of 12 months","industry":["aviation"],"lens":["icfr"]},{"control_id":"HSP-01","process":"Rooms Revenue","subprocess":"Rate and Reservation Integrity","risk_id":"R-HSP-01","risk":"Room revenue is lost through unauthorised rate discounts, comped rooms and unrecorded occupancy at the front desk.","rating":"High","control_objective":"Ensure rooms occupied are recorded and billed at authorised rates.","control":"The property management system restricts discount and complimentary room codes to authorised users; the Night Auditor reconciles rooms physically occupied to rooms billed each night, and the General Manager reviews a daily exception report of comps, rate overrides and zero-rate stays.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"C, E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"General Manager","sod":"The front desk agent granting a rate override cannot approve their own override.","test_design":"Inspect user rights over rate codes and the night audit reconciliation procedure.","test_oe":"For a sample of nights, agree occupied rooms to rooms billed and inspect GM review of the exception report.","population":"Nightly night-audit packs and exception reports","sample":"25 nights","industry":["hospitality"],"lens":["icfr"]},{"control_id":"HSP-02","process":"Food & Beverage","subprocess":"Inventory and Pour Cost","risk_id":"R-HSP-02","risk":"Food and beverage stock is consumed without sale through theft, over-pouring or unrecorded staff consumption.","rating":"High","control_objective":"Ensure food and beverage cost of sales reflects genuine sales and variances are investigated.","control":"Monthly, the Food and Beverage Controller counts stock, calculates theoretical versus actual cost of sales by outlet, and outlets exceeding the variance tolerance are investigated with the outlet manager and reported to the General Manager.","control_type":"Detective","control_nature":"Manual","frequency":"Monthly","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Food and Beverage Controller","sod":"The person counting stock is independent of the outlet whose variance is being measured.","test_design":"Inspect the costing methodology, tolerance thresholds and investigation protocol.","test_oe":"For a sample of months, re-perform the theoretical cost calculation and inspect investigation of outlier outlets.","population":"Monthly stock counts and cost variance reports","sample":"3 of 12 months","industry":["hospitality"],"lens":["icfr"]},{"control_id":"HSP-03","process":"Rooms Revenue","subprocess":"Loyalty and Advance Deposits","risk_id":"R-HSP-03","risk":"Advance deposits and loyalty point liabilities are not recognised, understating liabilities and overstating revenue.","rating":"Medium","control_objective":"Ensure advance deposits and loyalty obligations are recorded until the stay is delivered.","control":"Monthly, the Financial Controller reconciles the advance deposit and loyalty liability accounts to the property management and loyalty systems, and reviews the ageing of deposits held for stays that have already passed.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, CO","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Reconciliation preparer does not process deposit refunds.","test_design":"Inspect the reconciliation template and the ageing review of expired deposits.","test_oe":"For a sample of months, re-perform the reconciliation and test the release of aged deposits to revenue.","population":"Monthly deposit and loyalty reconciliations","sample":"3 of 12 months","industry":["hospitality"],"lens":["icfr"]},{"control_id":"HSP-04","process":"Property Operations","subprocess":"Capital Projects and FF&E","risk_id":"R-HSP-04","risk":"Refurbishment spend is capitalised when it is repair in nature, or project costs exceed approved budgets without escalation.","rating":"Medium","control_objective":"Ensure property capital expenditure is authorised, correctly classified and monitored against budget.","control":"Each capital project is approved against a business case at the authority level set by value; monthly, the Project Accountant reports actual against approved spend, and the Controller reviews the capital versus repairs classification for material additions before posting.","control_type":"Preventive","control_nature":"Manual","frequency":"Monthly","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Project managers requesting spend do not approve capitalisation treatment.","test_design":"Inspect the capital approval framework and the classification review process.","test_oe":"For a sample of additions, agree to approval, inspect the classification assessment and agree spend to budget.","population":"Capital additions and monthly project reports","sample":"25 additions","industry":["hospitality"],"lens":["icfr"]},{"control_id":"ECM-01","process":"Online Revenue","subprocess":"Payment Gateway Reconciliation","risk_id":"R-ECM-01","risk":"Amounts collected by payment providers do not reconcile to orders recorded, so revenue and cash are misstated and shortfalls go undetected.","rating":"High","control_objective":"Ensure all customer orders are matched to settled funds and differences are investigated.","control":"Daily, the Revenue Operations Analyst reconciles order value in the commerce platform to gateway settlement reports and to bank credits, and unmatched items are aged and escalated to the Financial Controller weekly.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"C, E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Financial Controller","sod":"The person performing the reconciliation cannot post adjustments without review.","test_design":"Inspect the three-way reconciliation design between platform, gateway and bank.","test_oe":"For a sample of days, re-perform the reconciliation and inspect resolution of unmatched items.","population":"Daily gateway reconciliations","sample":"25 days","industry":["ecommerce"],"lens":["icfr"]},{"control_id":"ECM-02","process":"Online Revenue","subprocess":"Chargebacks and Payment Fraud","risk_id":"R-ECM-02","risk":"Fraudulent orders are fulfilled and later charged back, and losses are absorbed without adjusting fraud screening rules.","rating":"High","control_objective":"Ensure fraud screening operates effectively and chargeback losses are monitored and acted on.","control":"Orders are scored by the fraud screening engine before fulfilment, with holds above the risk threshold reviewed manually; monthly, the Risk Manager analyses chargeback reason codes and rates by channel and reports rule changes to the Financial Controller.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Risk Manager","sod":"Manual release of held orders is performed by risk staff, not by sales or fulfilment.","test_design":"Inspect the screening rule set, threshold configuration and manual review workflow.","test_oe":"Select a sample of released high-risk orders and inspect the documented review; recompute chargeback rates.","population":"Held-order review records and monthly chargeback analyses","sample":"40 released orders","industry":["ecommerce"],"lens":["icfr"]},{"control_id":"ECM-03","process":"Fulfilment","subprocess":"Returns and Refunds","risk_id":"R-ECM-03","risk":"Refunds are issued without the goods being returned, or are issued to accounts other than the original payment method.","rating":"High","control_objective":"Ensure refunds are issued only for validated returns and to the original payment method.","control":"The commerce platform restricts refunds to the original payment method and requires a matched return receipt in the warehouse system; refunds without a matched return require supervisor approval, and a daily exception report of these is reviewed by the Customer Operations Manager.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Customer Operations Manager","sod":"Agents issuing refunds cannot amend the return receipt record.","test_design":"Inspect the refund workflow configuration and the exception approval path.","test_oe":"Select a sample of refunds; agree to matched returns or documented supervisor approval.","population":"All refunds issued in the period","sample":"40 refunds","industry":["ecommerce"],"lens":["icfr"]},{"control_id":"ECM-04","process":"Marketplace & Content","subprocess":"Third-Party Seller Settlements","risk_id":"R-ECM-04","risk":"Marketplace seller settlements are calculated on incorrect commission or fee terms, misstating net revenue and seller payables.","rating":"Medium","control_objective":"Ensure marketplace settlements reflect contracted commission and fee terms.","control":"Monthly, the Marketplace Finance Analyst recalculates a risk-based sample of seller settlements against contracted commission rates and reconciles the seller payable balance to the platform ledger, with Controller review of the reconciliation.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, C","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Commercial staff who negotiate seller terms do not calculate settlements.","test_design":"Inspect the settlement calculation logic and reconciliation template.","test_oe":"For a sample of months, recompute settlements to contract and agree the payable to the ledger.","population":"Monthly seller settlement runs and reconciliations","sample":"3 of 12 months","industry":["ecommerce"],"lens":["icfr"]},{"control_id":"FMC-01","process":"Trade Spend","subprocess":"Trade Promotions and Deductions","risk_id":"R-FMC-01","risk":"Trade promotion accruals are understated and customer deductions are settled without validation, overstating net revenue.","rating":"High","control_objective":"Ensure trade spend is accrued when the promotion is run and deductions are validated before settlement.","control":"Monthly, the Trade Finance Manager accrues promotional spend from approved promotion plans and shipment volumes, and customer deductions are matched to an approved promotion before clearing; unmatched deductions above threshold are disputed and escalated.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, CO, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Trade Finance Manager","sod":"Sales staff approving promotions do not clear the related customer deductions.","test_design":"Inspect the accrual methodology and the deduction matching and dispute workflow.","test_oe":"For a sample of months, re-perform the accrual and trace a sample of cleared deductions to approved promotions.","population":"Monthly trade accruals and deduction clearing records","sample":"3 of 12 months","industry":["fmcg"],"lens":["icfr"]},{"control_id":"FMC-02","process":"Distribution","subprocess":"Distributor Sales and Channel Stuffing","risk_id":"R-FMC-02","risk":"Sales are pushed into the distributor channel at period end beyond genuine demand, pulling forward revenue that later reverses as returns.","rating":"High","control_objective":"Ensure revenue reflects genuine sell-through and period-end shipment patterns are scrutinised.","control":"Monthly, the Commercial Controller analyses shipment volumes in the final week against the period average by distributor, reviews distributor inventory and sell-through data, and material period-end spikes require documented commercial justification approved by the Chief Financial Officer.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"CO, E/O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Commercial Controller","sod":"Sales leadership whose targets are affected do not approve their own justification.","test_design":"Inspect the analysis methodology, sell-through data source and escalation criteria.","test_oe":"For a sample of period ends, re-perform the shipment pattern analysis and inspect justification and approval.","population":"Monthly period-end shipment analyses","sample":"3 of 12 months","industry":["fmcg"],"lens":["icfr"]},{"control_id":"FMC-03","process":"Quality & Product Safety","subprocess":"Product Recall and Traceability","risk_id":"R-FMC-03","risk":"A contaminated or defective batch cannot be traced and withdrawn quickly, extending consumer harm and financial exposure.","rating":"High","control_objective":"Ensure batch traceability is maintained end to end and recall capability is tested.","control":"Batch codes are captured at production, warehousing and despatch, and the Quality Director performs a documented mock recall at least annually, tracing a batch forward to customers and back to raw materials within the target time, with gaps remediated.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Annual","assertions":"C, E/O","coso":"Risk Assessment","key_control":"Yes","fraud":"No","owner":"Quality Director","sod":"The mock recall is assessed by quality assurance independently of the operations team executing it.","test_design":"Inspect the traceability design and the mock recall procedure and target times.","test_oe":"Obtain the most recent mock recall report; re-perform the trace for one batch and test remediation of identified gaps.","population":"Annual mock recall exercises","sample":"1 of 1","industry":["fmcg"],"lens":["icfr"]},{"control_id":"FMC-04","process":"Inventory & Costing","subprocess":"Short-Dated and Expired Stock","risk_id":"R-FMC-04","risk":"Finished goods approaching expiry are not provided for or withdrawn, overstating inventory and risking sale of out-of-date product.","rating":"Medium","control_objective":"Ensure short-dated and expired stock is identified, provided for and withdrawn from sale.","control":"Weekly, the Supply Chain Planner reviews the stock ageing and shelf-life report, blocks stock inside the minimum remaining-life window from despatch in the system, and Finance provides for short-dated stock monthly with Controller approval.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Weekly","assertions":"A/V, E/O","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Planners blocking stock do not approve the resulting provision.","test_design":"Inspect the shelf-life blocking configuration and the provisioning policy.","test_oe":"For a sample of periods, test that blocked stock was not despatched and re-perform the provision.","population":"Weekly shelf-life reports and monthly provisions","sample":"25 of 52 weeks","industry":["fmcg"],"lens":["icfr"]},{"control_id":"UTL-01","process":"Customer Operations","subprocess":"Metering and Unbilled Revenue","risk_id":"R-UTL-01","risk":"Consumption is estimated rather than metered and the unbilled revenue accrual is unsupported, misstating revenue.","rating":"High","control_objective":"Ensure billed consumption reflects metered usage and unbilled revenue is supportable.","control":"Monthly, the Revenue Assurance Manager reconciles energy delivered into the network to energy billed plus estimated unbilled plus technical losses, and reviews the proportion of accounts on estimated reads with the Controller approving the unbilled accrual.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, CO, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Revenue Assurance Manager","sod":"Metering operations staff do not prepare or approve the revenue accrual.","test_design":"Inspect the energy balance methodology and the unbilled accrual basis.","test_oe":"For a sample of months, re-perform the energy balance and recompute the unbilled accrual.","population":"Monthly energy balances and unbilled accruals","sample":"3 of 12 months","industry":["utilities"],"lens":["icfr"]},{"control_id":"UTL-02","process":"Regulated Operations","subprocess":"Regulatory Reporting and Tariffs","risk_id":"R-UTL-02","risk":"Tariffs are applied outside the regulator-approved schedule, or regulatory returns misstate performance, triggering penalties and rebates.","rating":"High","control_objective":"Ensure customer tariffs and regulatory submissions comply with the approved determination.","control":"Tariff changes are configured only from the regulator-approved schedule with independent verification of the configuration before activation, and the Regulatory Affairs Manager reviews each periodic return against source data before submission.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Event Driven","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Head of Regulatory Affairs","sod":"The person configuring the tariff table does not verify or activate it.","test_design":"Inspect the tariff change procedure and the return review protocol.","test_oe":"For all tariff changes in the period, agree configuration to the approved schedule and inspect independent verification.","population":"Tariff change records and regulatory submissions","sample":"All changes in the period","industry":["utilities"],"lens":["icfr"]},{"control_id":"UTL-03","process":"Asset Management","subprocess":"Capital Works and Asset Capitalisation","risk_id":"R-UTL-03","risk":"Network capital projects are capitalised before assets are commissioned, or overhead is over-absorbed into capital, overstating the asset base.","rating":"High","control_objective":"Ensure network assets are capitalised only when available for use and at supportable cost.","control":"Monthly, the Fixed Asset Manager reviews work in progress ageing and evidence of commissioning before transferring projects to fixed assets, and the overhead absorption rate applied to capital is approved annually by the Controller.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"E/O, A/V, CO","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Fixed Asset Manager","sod":"Project engineers confirming commissioning are independent of the capitalisation posting.","test_design":"Inspect the capitalisation policy, WIP ageing review and overhead rate approval.","test_oe":"For a sample of transfers, agree to commissioning evidence and recompute overhead absorbed.","population":"Monthly WIP reviews and capitalisation transfers","sample":"25 transfers","industry":["utilities"],"lens":["icfr"]},{"control_id":"UTL-04","process":"Trading & Commodity","subprocess":"Energy Trading and Position Limits","risk_id":"R-UTL-04","risk":"Energy trading positions breach approved risk limits, or trades are mispriced against the market curve.","rating":"High","control_objective":"Ensure trading operates within approved limits and positions are independently valued.","control":"Daily, the independent Risk Control function revalues open positions against an externally sourced forward curve, reports exposures against board-approved limits, and breaches are escalated same day to the Chief Risk Officer.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"A/V, E/O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Chief Risk Officer","sod":"Risk Control is organisationally independent of the trading desk it monitors.","test_design":"Inspect the limit framework, curve sourcing and escalation protocol.","test_oe":"For a sample of days, re-perform the revaluation and inspect breach escalation evidence.","population":"Daily position and limit reports","sample":"25 days","industry":["utilities"],"lens":["icfr"]},{"control_id":"TEL-01","process":"Service Revenue","subprocess":"Rating, Mediation and Revenue Assurance","risk_id":"R-TEL-01","risk":"Usage records are lost or mis-rated between the network and billing, so services delivered are never billed.","rating":"High","control_objective":"Ensure usage captured by the network is completely and accurately rated and billed.","control":"Daily, the Revenue Assurance team reconciles call and data records from network elements through mediation to the billing system, investigating record loss above tolerance, and reports leakage monthly to the Chief Financial Officer.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Daily","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Head of Revenue Assurance","sod":"Revenue Assurance is independent of network operations and billing.","test_design":"Inspect the end-to-end reconciliation design, tolerance levels and escalation route.","test_oe":"For a sample of days, re-perform the record count reconciliation and inspect investigation of variances.","population":"Daily mediation reconciliations","sample":"25 days","industry":["telecom"],"lens":["icfr"]},{"control_id":"TEL-02","process":"Service Revenue","subprocess":"Interconnect and Roaming Settlement","risk_id":"R-TEL-02","risk":"Amounts due from other operators for interconnect and roaming traffic are understated or not disputed within the settlement window.","rating":"High","control_objective":"Ensure interconnect and roaming balances are complete, agreed and settled on time.","control":"Monthly, the Interconnect Manager reconciles outgoing and incoming traffic to partner operator statements, raises disputes within the contractual window, and the Controller reviews the ageing of unresolved disputes and related provisions.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"C, A/V, E/O","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"The person raising disputes does not approve write-offs of disputed balances.","test_design":"Inspect the settlement reconciliation process and dispute window monitoring.","test_oe":"For a sample of months, agree balances to partner statements and inspect dispute records and provisions.","population":"Monthly interconnect and roaming reconciliations","sample":"3 of 12 months","industry":["telecom"],"lens":["icfr"]},{"control_id":"TEL-03","process":"Customer Operations","subprocess":"Subscriber Provisioning and Credit","risk_id":"R-TEL-03","risk":"Services are activated for subscribers who fail credit vetting, or remain active long after non-payment, inflating receivables and bad debt.","rating":"High","control_objective":"Ensure activation follows credit policy and non-paying subscribers are suspended on schedule.","control":"The provisioning system enforces a credit decision before activation, and the dunning process automatically restricts and then suspends services at the policy-defined ageing points; manual overrides require Credit Manager approval and are reported monthly.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Credit Manager","sod":"Sales staff cannot override a credit decision or delay suspension.","test_design":"Inspect the credit workflow configuration and dunning rule set.","test_oe":"Select a sample of activations and overrides; agree to credit decisions and approvals; test suspension timing against policy.","population":"Activations and dunning overrides in the period","sample":"40 items","industry":["telecom"],"lens":["icfr"]},{"control_id":"TEL-04","process":"Network & Infrastructure","subprocess":"Network Asset Capitalisation and Impairment","risk_id":"R-TEL-04","risk":"Network equipment that is decommissioned or superseded by technology change remains on the balance sheet, overstating assets.","rating":"Medium","control_objective":"Ensure network assets reflect equipment actually deployed and in service.","control":"Annually, Network Engineering performs a physical verification of deployed network elements against the fixed asset register, and assets identified as decommissioned or obsolete are retired or impaired with Controller approval.","control_type":"Detective","control_nature":"Manual","frequency":"Annual","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Engineering verifies existence; Finance independently posts retirements and impairments.","test_design":"Inspect the verification programme and retirement approval process.","test_oe":"Obtain the most recent verification; test exceptions through to retirement or impairment postings.","population":"Annual network asset verifications","sample":"1 of 1","industry":["telecom"],"lens":["icfr"]},{"control_id":"HR-01","process":"Human Resources","subprocess":"Employee Master Data","risk_id":"R-HR-01","risk":"Unauthorised changes to employee master data — salary, bank details, status — result in incorrect or fraudulent payments.","rating":"High","control_objective":"Ensure changes to employee master data are authorised and independently verified before they affect pay.","control":"All changes to salary, bank details and employment status are entered by HR Operations from an authorised change form and independently verified against source documentation by a second HR officer before the next payroll run; a system-generated change report is reviewed by the HR Manager each period.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"HR Operations Manager","sod":"The person entering the master data change cannot verify or approve it, and neither may release the payroll payment.","test_design":"Inspect the change authorisation form, verification requirement and the period-end change report.","test_oe":"Select a sample of master data changes; agree each to an authorised form and evidence of independent verification.","population":"All employee master data changes in the period","sample":"40 changes","industry":["cross"],"lens":["icfr"]},{"control_id":"HR-02","process":"Human Resources","subprocess":"Incentive and Bonus Accrual","risk_id":"R-HR-02","risk":"Bonus and incentive accruals are not supported by approved plans or actual performance outcomes, misstating employment costs.","rating":"Medium","control_objective":"Ensure incentive accruals reflect approved plan terms and the current performance outcome.","control":"Quarterly, the Reward Manager calculates the incentive accrual from approved plan rules and the latest performance forecast, and the Financial Controller reviews the calculation against plan documentation and prior-period trends before posting.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"The preparer of the accrual is not a participant in the plan being accrued.","test_design":"Inspect the accrual methodology, plan documentation and evidence of Controller review.","test_oe":"For a sample of quarters, re-perform the accrual from plan rules and performance data.","population":"Quarterly incentive accrual calculations","sample":"2 of 4 quarters","industry":["cross"],"lens":["icfr"]},{"control_id":"HR-03","process":"Human Resources","subprocess":"Termination and Severance","risk_id":"R-HR-03","risk":"Severance and termination payments are made outside policy or delegated authority, or leavers continue to be paid after their exit date.","rating":"High","control_objective":"Ensure termination payments are authorised, calculated correctly, and that pay ceases on the exit date.","control":"Termination payments are calculated by HR from the employment contract and policy, approved at the authority level set by value, and a leaver exception report comparing termination dates to the payroll master is reviewed by the HR Manager before each payroll run.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, A/V, CO","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"HR Director","sod":"The manager initiating the termination does not approve the settlement amount alone.","test_design":"Inspect the severance authority matrix and the leaver exception report design.","test_oe":"Select a sample of terminations; recompute the settlement, agree the approval, and test that pay ceased on the exit date.","population":"All terminations in the period","sample":"25 terminations","industry":["cross"],"lens":["icfr"]},{"control_id":"BNK-05","process":"Credit & Lending","subprocess":"Collateral Management","risk_id":"R-BNK-05","risk":"Collateral securing loans is not perfected, revalued or released correctly, overstating security and understating expected credit loss.","rating":"High","control_objective":"Ensure collateral is legally perfected, periodically revalued and released only when the exposure is repaid.","control":"Collateral is recorded in the collateral system only once legal perfection is evidenced by the Legal team; revaluations are performed at the frequency set by asset class using independent valuation sources, and releases require approval by Credit Risk independent of the relationship manager.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"R&O, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Credit Risk","sod":"The relationship manager cannot record, revalue or release collateral.","test_design":"Inspect the collateral procedure, perfection checklist, revaluation frequency table and release workflow.","test_oe":"Select a sample of secured facilities; agree perfection evidence, latest revaluation and, for released collateral, approval and repayment.","population":"Secured facilities and collateral releases in the period","sample":"40 facilities","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-06","process":"Credit & Lending","subprocess":"Loan Disbursement","risk_id":"R-BNK-06","risk":"Loan proceeds are disbursed to an account other than the approved borrower account, or before conditions precedent are satisfied.","rating":"High","control_objective":"Ensure disbursement occurs only after conditions precedent are met and only to the approved account.","control":"Loan Operations verifies that all conditions precedent recorded in the credit approval are satisfied and that the disbursement account matches the approved borrower account before release; disbursement is authorised by two officers independent of credit origination.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, R&O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Loan Operations","sod":"Credit origination staff cannot execute or authorise disbursement.","test_design":"Inspect the disbursement checklist, condition precedent tracking and dual authorisation configuration.","test_oe":"Select a sample of disbursements; agree to satisfied conditions precedent, the approved account and dual authorisation.","population":"All loan disbursements in the period","sample":"40 disbursements","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-07","process":"Credit & Lending","subprocess":"Loan Classification and Staging","risk_id":"R-BNK-07","risk":"Deteriorating loans are not migrated to the correct stage or classification, deferring impairment recognition.","rating":"High","control_objective":"Ensure loans are classified and staged in accordance with policy and observable credit deterioration indicators.","control":"The system applies staging rules based on days past due and qualitative deterioration triggers; monthly, Credit Risk reviews the staging migration report and all manual overrides of system-assigned staging require Credit Committee approval with documented rationale.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, C","coso":"Risk Assessment","key_control":"Yes","fraud":"Yes","owner":"Chief Risk Officer","sod":"Relationship managers cannot override staging assigned by the system.","test_design":"Inspect the staging rule configuration, override workflow and Credit Committee terms of reference.","test_oe":"For a sample of months, re-perform staging from days past due data and inspect approval of all overrides.","population":"Monthly staging migration reports and override approvals","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-08","process":"Credit & Lending","subprocess":"Interest and Fee Accrual","risk_id":"R-BNK-08","risk":"Interest and fees are accrued on non-performing exposures or calculated on incorrect terms, overstating income.","rating":"High","control_objective":"Ensure interest and fee income is recognised on correct terms and ceases on non-performing exposures.","control":"The core banking system calculates interest from contracted terms and suspends accrual automatically on classification as non-performing; monthly, Financial Control reconciles interest income to the loan book and reviews an exception report of manually adjusted accruals.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, CO","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"Staff maintaining loan terms cannot post manual interest adjustments.","test_design":"Inspect the accrual configuration, non-accrual suspension logic and reconciliation template.","test_oe":"For a sample of months, re-perform the interest reconciliation and test manual adjustments to approval.","population":"Monthly interest income reconciliations","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-09","process":"Credit & Lending","subprocess":"Loan Modifications and Forbearance","risk_id":"R-BNK-09","risk":"Loans are restructured to avoid recognising default, so forbearance is not identified and impairment is understated.","rating":"High","control_objective":"Ensure modifications are identified as forbearance where applicable and are approved and disclosed correctly.","control":"All loan modifications are assessed against forbearance criteria by Credit Risk independent of the relationship manager, approved at the authority level set by exposure, and flagged in the system so that staging and disclosure reflect the modification.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Credit Risk","sod":"The relationship manager proposing the modification cannot assess or approve its forbearance classification.","test_design":"Inspect the forbearance assessment criteria, approval matrix and system flagging.","test_oe":"Select a sample of modifications; agree the forbearance assessment, approval and system flag.","population":"All loan modifications in the period","sample":"25 modifications","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-10","process":"Credit & Lending","subprocess":"Write-Off and Recovery","risk_id":"R-BNK-10","risk":"Loans are written off without authority to remove problem exposures from reporting, or recoveries are misappropriated.","rating":"High","control_objective":"Ensure write-offs are authorised at the correct level and recoveries are completely recorded.","control":"Write-offs require approval at the authority level set by exposure size, with evidence that recovery avenues have been exhausted; recoveries on written-off accounts are received into a designated account, reconciled monthly by Financial Control and reported to the Credit Committee.","control_type":"Preventive","control_nature":"Manual","frequency":"Event Driven","assertions":"E/O, C, A/V","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Chief Risk Officer","sod":"Recovery collection staff do not authorise write-offs or reconcile recovery receipts.","test_design":"Inspect the write-off authority matrix, recovery reconciliation and committee reporting.","test_oe":"Select a sample of write-offs; agree approval and recovery evidence. Reconcile recoveries received to the ledger for a sample of months.","population":"Write-offs and post write-off recoveries in the period","sample":"25 write-offs","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-11","process":"Deposits & Payments","subprocess":"Customer Onboarding and Account Opening","risk_id":"R-BNK-11","risk":"Accounts are opened without complete customer due diligence, breaching regulation and enabling illicit funds to enter the bank.","rating":"High","control_objective":"Ensure accounts are opened only where identification and due diligence requirements are satisfied.","control":"The onboarding workflow prevents account activation until identification, verification and risk rating are complete; enhanced due diligence for high-risk customers requires approval by Financial Crime Compliance independent of the relationship.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O, R&O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Financial Crime Compliance","sod":"Relationship staff cannot approve their own enhanced due diligence or override risk ratings.","test_design":"Inspect the onboarding workflow configuration and enhanced due diligence approval routing.","test_oe":"Select a sample of accounts opened; agree due diligence completeness, risk rating and any EDD approval.","population":"All accounts opened during the period","sample":"40 accounts","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-12","process":"Deposits & Payments","subprocess":"Deposit Interest Calculation","risk_id":"R-BNK-12","risk":"Interest paid on customer deposits is calculated on incorrect rates or balances, misstating interest expense and customer balances.","rating":"Medium","control_objective":"Ensure deposit interest is calculated in accordance with product terms and approved rate tables.","control":"Rate tables are maintained by Product Control and independently verified before activation; monthly, Financial Control recalculates interest on a risk-based sample of products and reconciles total interest expense to the deposit book.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, C","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Financial Controller","sod":"The preparer of the rate table does not approve its activation.","test_design":"Inspect the rate maintenance procedure and the monthly recalculation and reconciliation.","test_oe":"For a sample of months, re-perform the interest recalculation and agree the expense to the ledger.","population":"Monthly deposit interest reconciliations","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-13","process":"Deposits & Payments","subprocess":"Dormant and Unclaimed Balances","risk_id":"R-BNK-13","risk":"Dormant accounts are reactivated fraudulently, or unclaimed balances are not escheated as required by regulation.","rating":"High","control_objective":"Ensure dormant balances are protected from unauthorised access and escheated in accordance with law.","control":"Accounts meeting the dormancy criteria are automatically blocked from transacting; reactivation requires customer identity verification and approval by a manager independent of branch operations, and unclaimed balances are reported and remitted to the authority on the statutory timetable.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"E/O, C","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Operations","sod":"Branch staff who request reactivation cannot approve it.","test_design":"Inspect the dormancy configuration, reactivation approval workflow and escheatment procedure.","test_oe":"Test all reactivations in the period for verification and approval; agree escheatment to statutory deadlines.","population":"Dormant account reactivations and escheatment submissions","sample":"All reactivations","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-14","process":"Deposits & Payments","subprocess":"Fee and Charge Application","risk_id":"R-BNK-14","risk":"Customer fees are applied that are not permitted by the product terms, generating remediation liabilities and regulatory censure.","rating":"Medium","control_objective":"Ensure fees charged to customers are permitted, correctly calculated and disclosed.","control":"Fee configuration changes require approval by Product Control and Compliance before activation; monthly, an exception report of manual fee applications and waivers is reviewed by the Head of Operations, and fee income is reconciled to the fee schedule.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Head of Operations","sod":"Branch staff applying manual fees do not maintain the fee configuration.","test_design":"Inspect the fee change approval process and the manual fee exception report.","test_oe":"For a sample of months, re-perform the fee reconciliation and test manual applications and waivers for approval.","population":"Monthly fee reconciliations and manual fee reports","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-15","process":"Financial Crime","subprocess":"Sanctions and Watchlist Screening","risk_id":"R-BNK-15","risk":"A sanctioned party transacts through the bank because screening lists are stale or matches are cleared without proper review.","rating":"High","control_objective":"Ensure customers and payments are screened against current sanctions lists and that matches are properly adjudicated.","control":"Sanctions lists are updated automatically on publication and screening runs on every customer at onboarding, on the full base after each list update, and on every cross-border payment before release; potential matches are adjudicated by Financial Crime Compliance, not by the business, with dual review on discounted true-match candidates.","control_type":"Preventive","control_nature":"IT-Dependent Manual","frequency":"Per Transaction","assertions":"E/O","coso":"Control Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Financial Crime Compliance","sod":"Business and operations staff cannot discount a screening alert.","test_design":"Inspect the screening configuration, list update mechanism and alert adjudication workflow.","test_oe":"Re-perform screening on a sample of customers and payments to confirm expected hits; test a sample of discounted alerts for reviewer independence and rationale.","population":"Screening alerts raised during the period","sample":"40 alerts","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-16","process":"Financial Crime","subprocess":"Transaction Monitoring","risk_id":"R-BNK-16","risk":"Suspicious activity is not detected because monitoring scenarios are not tuned to the bank's risk profile or alerts are closed without investigation.","rating":"High","control_objective":"Ensure transaction monitoring scenarios are appropriate, operating and producing investigated outcomes.","control":"Monitoring scenarios are reviewed
