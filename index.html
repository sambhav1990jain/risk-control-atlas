function pool(ind, lens){
  const skip = excluded(ind);
  return DATA.filter(d => d.lens.includes(lens) && !skip.includes(d.process) &&
    (ind === 'all' || d.industry.includes(ind) || d.industry.includes('cross')));
}
const poolFor = pool;
function counts(ind){
  return {ia:pool(ind,'ia').length, icfr:pool(ind,'icfr').length};
}
function filtered(){
  let r = pool(S.ind, S.lens);
  if(S.proc) r = r.filter(d=>d.process===S.proc);
  if(S.sub) r = r.filter(d=>d.subprocess===S.sub);
  if(S.f.rating) r = r.filter(d=>d.rating===S.f.rating);
  if(S.f.key) r = r.filter(d=>d.key_control==='Yes');
  if(S.f.fraud) r = r.filter(d=>d.fraud==='Yes' || d.risk_category==='Fraud');
  if(S.f.type) r = r.filter(d=>d.control_type===S.f.type);
  if(S.q){
    const q = S.q.toLowerCase();
    r = r.filter(d=>JSON.stringify(d).toLowerCase().includes(q));
  }
  return r;
}

function crumbs(){
  const el = document.getElementById('crumbs');
  const bar = el.parentElement;
  if(['about','who','improve'].includes(S.tab) || !S.ind){ bar.style.display='none'; el.innerHTML=''; return; }
  bar.style.display='';
  const tabName = (TABS.find(t=>t[0]===S.tab)||['',''])[1];
  let h = `<span class="cbtab">${tabName}</span><span>/</span>`;
  h += `<button onclick="S.ind=null;S.pickTmp=null;S.proc=null;S.procChosen=false;${S.tab==='industry'?'S.lens=null;':''}render()">Industry</button>`;
  h += `<span>/</span><span>${indName(S.ind)}</span>`;
  if(S.procChosen){
    h += `<span>/</span><button onclick="S.proc=null;S.sub=null;S.procChosen=false;${S.tab==='industry'?'S.lens=null;':''}render()">Process</button>`;
    h += `<span>/</span><span>${S.proc||'All processes'}</span>`;
  }
  if(S.tab==='industry' && S.lens){
    h += `<span>/</span><button onclick="S.lens=null;render()">Lens</button>`;
    h += `<span>/</span><span>${LENSES[S.lens].name}</span>`;
  }
  el.innerHTML = h;
}

function goTab(t){

const GLOSSARY = [
 ['Risk','Something that could go wrong and cost the organisation money, customers, or its licence to operate.'],
 ['Control','Something done on purpose to stop that happening, or to catch it quickly when it does.'],
 ['Preventive control','Stops the problem before it happens — the system will not release a payment without a second approver.'],
 ['Detective control','Finds the problem after it happens — a monthly review that spots a payment that should not have gone out.'],
 ['Key control','One of the few controls you would rely on to conclude the area is under control. If it fails, you have a real problem.'],
 ['ICFR','Internal control over financial reporting — the controls that make published financial numbers trustworthy.'],
 ['Assertion','A claim the accounts are making: that sales really happened, that all of them are recorded, that they are recorded at the right value.'],
 ['COSO','The framework that sorts controls into five parts — control environment, risk assessment, control activities, information and communication, and monitoring.'],
 ['Test of design','Asking whether the control, if it works as described, would actually catch the problem. You read the procedure and inspect how it is set up.'],
 ['Test of operating effectiveness','Asking whether it actually happened, every time, all year. You take a sample and look for evidence.'],
 ['Population','The full set of items the control applied to during the period, from which the sample is drawn.'],
 ['Segregation of duties','Making sure no single person controls a whole transaction from start to finish.'],
 ['Audit objective','The one thing you are trying to establish. Everything you do in that section should serve it.'],
 ['Red flag','A sign the risk may already have happened. Worth chasing, not proof on its own.'],
 ['Audit universe','The full list of things that could be audited. Choosing what to audit this year starts here.'],

/* rolling counters on the landing numbers */
function runCounters(){
  document.querySelectorAll('.roll').forEach(el=>{
    const to = +el.dataset.to;
    if(!isFinite(to)) return;
    const speed = +el.dataset.speed || 1;
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const base = speed === 3 ? 1500 : speed === 2 ? 1900 : 2200;
    const dur = calm ? Math.round(base * 0.35) : base;
    /* if frames cannot run — hidden tab, throttled window — show the real number */
    if(document.hidden || typeof requestAnimationFrame !== 'function'){ el.textContent = to; return; }
    let done = false;
    const finish = () => { if(!done){ done = true; el.textContent = to; } };
    const guard = setTimeout(finish, dur + 500);
    const t0 = performance.now();
    const step = now => {
      if(done) return;
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.max(1, Math.round(to * eased));
      if(t < 1) requestAnimationFrame(step);
      else { clearTimeout(guard); finish(); }
    };
    requestAnimationFrame(step);
  });
}

/* ---- industry search: exact, keyword and typo-tolerant ---- */
function editDistance(a,b){
  if(Math.abs(a.length-b.length) > 3) return 99;
  const m=a.length, n=b.length, d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function fuzzyOk(term, word){
  if(word.startsWith(term) || term.startsWith(word)) return true;
  /* a typo rarely changes the first letter, and that rule kills most false matches */
  if(term[0] !== word[0]) return false;
  const tol = term.length <= 5 ? 1 : 2;
  return editDistance(term, word) <= tol;
}
const STOP = new Set(['company','companies','business','businesses','firm','firms','industry',
  'industries','sector','sectors','services','service','group','ltd','limited','inc','plc','corp',
  'corporation','and','the','of','for','a','an','my','our','we','i','work','works','working']);
function searchIndustries(raw){
  const q = (raw||'').toLowerCase().trim();
  if(q.length < 2) return [];
  let terms = q.split(/[^a-z0-9]+/).filter(Boolean).filter(t=>!STOP.has(t));
  if(!terms.length) terms = q.split(/[^a-z0-9]+/).filter(Boolean);
  const out = [];
  FLAT.filter(i=>i.id!=='all').forEach(item=>{
    const name = item.name.toLowerCase();
    const nameWords = name.split(/[^a-z]+/).filter(Boolean);
    const keys = KEYWORDS[item.id] || [];
    let score = 0, why = null;
    terms.forEach(t=>{
      if(name === t){ score += 100; why = why||'name'; return; }
      if(name.startsWith(t)){ score += 60; why = why||'name'; return; }
      if(name.includes(t)){ score += 40; why = why||'name'; return; }
      if(nameWords.some(w=>fuzzyOk(t,w))){ score += 30; why = why||'spelling'; return; }
      const hit = keys.find(k=>k===t);
      if(hit){ score += 35; why = why||'keyword:'+hit; return; }
      const part = keys.find(k=>k.startsWith(t) || (t.length>4 && k.includes(t)));
      if(part){ score += 22; why = why||'keyword:'+part; return; }
      const near = keys.find(k=>fuzzyOk(t,k));
      if(near){ score += 14; why = why||'keyword:'+near; return; }
    });
    if(score>0) out.push({item, score, why});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}

function renderSearch(){
  const box = document.getElementById('searchout');
  if(!box) return;
  const q = (S.iq||'').trim();
  const res = searchIndustries(q);
  if(q.length < 2){ box.innerHTML=''; return; }
  if(!res.length){
    box.innerHTML = `<div class="sres empty">Nothing matched “${esc(q)}”. Try what the business
      actually does — lends money, moves freight, treats patients — or pick from the list below.</div>`;
    return;
  }
  const exact = res[0].score >= 60;
  box.innerHTML = `<div class="sres">
    <div class="sresh">${exact ? 'Best match' : 'Nothing matched exactly — these look closest'}</div>
    ${res.map(r=>`<button class="sitem" onclick="S.pickTmp='${r.item.id}';S.iq='';render()">
      <span class="sname">${r.item.name}</span>
      ${r.why && r.why.startsWith('keyword:') ? `<span class="swhy">matched on “${esc(r.why.slice(8))}”</span>`

}

async function sendFeedback(e){
  e.preventDefault();
  const form = e.target, status = document.getElementById('fstatus');
  const data = Object.fromEntries(new FormData(form).entries());
  status.textContent = 'Sending…'; status.className = 'fstatus';
  if(FORMSPREE){
    try{
      const r = await fetch('https://formspree.io/f/'+FORMSPREE, {method:'POST',
        headers:{'Accept':'application/json'}, body:new FormData(form)});
      if(r.ok){ form.reset(); status.textContent = 'Thank you — that has been sent.';
        status.className = 'fstatus ok'; return false; }
      throw new Error('rejected');
    }catch(err){ /* fall through to clipboard */ }
  }
  const text = Object.entries(data).map(([k,v])=>`${k}: ${v}`).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    status.textContent = 'Copied to your clipboard — paste it into an email for now. Direct sending is being set up.';
    status.className = 'fstatus ok';
  }catch(err){
    status.textContent = 'Could not send from here. Please copy your note and email it instead.';
    status.className = 'fstatus warn';
  }
  return false;
}

  'Service Revenue':['Order to Cash']
};
function relatedControls(d){
  const names = (ALIAS[d.process] || []).concat([d.process]);

}
function jumpTo(cid){
  S.lens='icfr'; S.proc=null; S.sub=null; S.q=''; S.f={}; S.open=cid; S.view='list';

/* ---- minimal xlsx writer: store-only zip, no dependencies ---- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name), data=enc.encode(f.data), c=crc32(data);
    const head=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),
      u32(data.length),u32(data.length),u16(name.length),u16(0));
    parts.push(new Uint8Array(head),name,data);
    central.push({name,c,len:data.length,off});
    off+=head.length+name.length+data.length;
  });
  const cd=[]; let cdlen=0;
  central.forEach(e=>{
    const head=[].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(e.c),
      u32(e.len),u32(e.len),u16(e.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.off));
    cd.push(new Uint8Array(head),e.name); cdlen+=head.length+e.name.length;
  });
  const end=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(central.length),
    u16(central.length),u32(cdlen),u32(off),u16(0)));
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe = v => String(v==null?'':v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function sheetXml(headers, rows){
  const col=i=>{let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
  const row=(cells,r,style)=>`<row r="${r}">`+cells.map((v,i)=>
    `<c r="${col(i)}${r}" t="inlineStr"${style?' s="1"':''}><is><t xml:space="preserve">${xe(v)}</t></is></c>`).join('')+`</row>`;
  const widths=headers.map((h,i)=>`<col min="${i+1}" max="${i+1}" width="${
    Math.min(70,Math.max(14,Math.round(rows.reduce((a,r)=>Math.max(a,String(r[i]||'').length),h.length)*0.62)))}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><outlinePr/></sheetPr><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${widths}</cols><sheetData>${row(headers,1,true)}${rows.map((r,i)=>row(r,i+2)).join('')}</sheetData>
<autoFilter ref="A1:${(()=>{let s='',n=headers.length;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;})()}${rows.length+1}"/>
</worksheet>`;
}
function exportRows(){
  const rows=filtered(), ia=S.lens==='ia';
  const headers = ia
    ? ['Ref','Industry','Process','Sub-process','Risk','Why this matters','Rating','Risk category','Audit objective',
       'What to review','Procedures','Red flags','Evidence to request','Measures']
    : ['Control ID','Industry','Process','Sub-process','Risk ID','Risk','Rating','Control objective',
       'Control description','Control type','Control nature','Frequency','Assertions','COSO component',
       'Key control','Fraud relevant','Control owner','Segregation of duties','Test of design',
       'Test of operating effectiveness','Population / evidence source','Sample size guidance'];
  const j = a => (a||[]).map((x,i)=>`${i+1}. ${x}`).join('\n');
  const iname = d => d.industry.map(indName).filter(Boolean).join(', ') || 'All industries';
  const body = rows.map(d => ia
    ? [d.id,iname(d),d.process,d.subprocess,d.risk,d.plain||'',d.rating,d.risk_category,d.audit_objective,
       j(d.what_to_review),j(d.procedures),j(d.red_flags),j(d.evidence),j(d.kpis)]
    : [d.control_id,iname(d),d.process,d.subprocess,d.risk_id,d.risk,d.rating,d.control_objective,
       d.control,d.control_type,d.control_nature,d.frequency,d.assertions,d.coso,d.key_control,
       d.fraud,d.owner,d.sod,d.test_design,d.test_oe,d.population,d.sample]);
  return {headers, body, ia, rows};
}
function xlsxBlob(headers, body, title){
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xe(title)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF10201A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>`},
    {name:'xl/worksheets/sheet1.xml',data:sheetXml(headers,body)}
  ];
  return zip(files);
}
function csvText(headers, body){
  const q = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  return '﻿' + [headers.map(q).join(','), ...body.map(r=>r.map(q).join(','))].join('\r\n');
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.className='show';
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.className='',5200);
}
async function downloadExcel(){
  const {headers, body, ia} = exportRows();
  if(!body.length){ toast('Nothing to export with the current filters.'); return; }
  const base = `${indName(S.ind).replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${ia?'audit-programme':'risk-control-matrix'}`;
  const title = ia ? 'Audit Programme' : 'Risk Control Matrix';
  const dl = (window.claude && claude.use) ? await claude.use('downloads').catch(()=>null) : null;
  if(dl){
    const blob = xlsxBlob(headers, body, title);
    const attempts = [[base+'.xlsx', blob], [base+'.csv', csvText(headers, body)]];
    for(const [filename, data] of attempts){
      try { await dl.save({filename, data}); return; }
      catch(e){
        if(e && (e.code==='declined' || e.code==='rate_limited')) return;
        if(e && (e.code==='rejected_extension' || e.code==='extension_not_enabled')) continue;
        break;
      }
    }
    toast('This preview cannot save spreadsheets. The published site downloads a full Excel file.');
    return;
  }
  const url = URL.createObjectURL(xlsxBlob(headers, body, title));
  const a = document.createElement('a'); a.href=url; a.download=base+'.xlsx';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 1500);
}

function coverageMap(rows){
  const procs=[...new Set(rows.map(d=>d.process))].sort();
  const rates=['High','Medium','Low'];
  const max=Math.max(1,...procs.map(p=>rows.filter(d=>d.process===p).length));
  const pct=n=>Math.round(10+62*n/max);
  const wash=n=>n===0?'transparent':`color-mix(in srgb, var(--accent) ${pct(n)}%, transparent)`;
  const ink=n=>pct(n)>44?'var(--on-accent)':'var(--ink)';
  return `<div class="mapwrap"><table class="cov">
    <thead><tr><th>Process</th>${rates.map(r=>`<th style="text-align:center">${r} risk</th>`).join('')}
      <th style="text-align:center">Total</th></tr></thead>
    <tbody>${procs.map(p=>{
      const t=rows.filter(d=>d.process===p);
      return `<tr><td class="pn">${p}</td>
      ${rates.map(r=>{const n=t.filter(d=>d.rating===r).length;
        return `<td class="cell ${n?'':'zero'}" onclick="${n?`go('work',{proc:'${esc(p)}',sub:null});S.f={rating:'${r}'};renderMain()`:''}">
          <span class="b" style="background:${wash(n)};color:${ink(n)}">${n}</span></td>`}).join('')}
      <td class="cell" onclick="go('work',{proc:'${esc(p)}',sub:null})"><span class="b">${t.length}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function matrix(rows){
  if(!rows.length) return `<div class="empty">No controls match. Clear a filter or widen the search.</div>`;
  return `<p class="tablehint">${rows.length} controls \u2014 select any row to open the full record:
    control objective, nature, COSO component, owner, segregation of duties, test of design,
    test of operating effectiveness, population and sample size.</p>
  <div class="tablewrap"><table>
    <thead><tr><th></th><th>Ref</th><th>Sub-process</th><th>Risk</th><th>Control</th><th>Type</th>
      <th>Frequency</th><th>Assertions</th><th>Key</th></tr></thead>
    <tbody>${rows.map((d,i)=>`
      <tr class="row ${S.open===d.control_id?'open':''}" onclick="S.open=S.open==='${d.control_id}'?null:'${d.control_id}';renderMain()">
        <td class="exp"><span class="chev">${S.open===d.control_id?'\u2212':'+'}</span></td>
        <td class="id">${d.control_id}<div style="margin-top:4px"><span class="pill ${rateCls(d.rating)}">${d.rating}</span></div></td>
        <td>${d.subprocess||'—'}</td>
        <td class="risk">${esc(d.risk)}</td>
        <td class="ctrl">${esc(d.control).slice(0,150)}${d.control.length>150?'…':''}</td>
        <td><span class="pill p-flat">${d.control_type}</span></td>
        <td>${d.frequency}</td>
        <td style="font-family:var(--mono);font-size:11.5px">${d.assertions}</td>
        <td>${d.key_control==='Yes'?'<span class="pill p-key">Key</span>':''}</td>
      </tr>
      ${S.open===d.control_id?`<tr class="detail"><td colspan="9"><div class="detail-in">
        ${[['Control objective',d.control_objective],['Full control description',d.control],
           ['Control nature',d.control_nature],['COSO component',d.coso],['Control owner',d.owner],
           ['Fraud relevant',d.fraud],['Segregation of duties',d.sod],['Test of design',d.test_design],
           ['Test of operating effectiveness',d.test_oe],['Population / evidence source',d.population],
           ['Sample size guidance',d.sample]].filter(([k,v])=>v).map(([k,v])=>
          `<div class="dblock"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}
      </div></td></tr>`:''}`).join('')}
    </tbody></table></div>`;
}

function programmes(rows){
  if(!rows.length) return `<div class="empty">No audit programmes match. Clear a filter or widen the search.</div>`;
  return `<div class="progs">${rows.map(d=>`
    <article class="prog">
      <div class="prog-h">
        <div class="tags">
          <span class="pill ${rateCls(d.rating)}">${d.rating} risk</span>
          <span class="pill p-flat">${d.risk_category}</span>
          <span class="pill p-flat">${d.subprocess}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${d.id}</span>
        </div>
        <h3>${esc(d.risk)}</h3>
        ${d.plain?`<p class="plain"><b>Why this matters</b>${esc(d.plain)}</p>`:''}
        <div class="obj"><b>Audit objective</b>${esc(d.audit_objective)}</div>
      </div>
      <div class="prog-b">
        <div class="pane"><h5>What to review</h5><ul>${d.what_to_review.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="pane steps"><h5>Procedures</h5><ol>${d.procedures.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
        <div class="pane flags"><h5>Red flags</h5><ul>${d.red_flags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="pane"><h5>Evidence to request</h5><ul>${d.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          <h5 style="margin-top:14px">Measures</h5><ul>${d.kpis.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        ${(()=>{const rel=relatedControls(d); return rel.length?`<div class="pane rel"><h5>Controls in the matrix</h5><ul>
          ${rel.map(r=>`<li><button onclick="jumpTo('${r.control_id}')"><span class="cid">${r.control_id}</span>${esc(r.control_objective)}</button></li>`).join('')}
        </ul></div>`:''})()}
      </div>
    </article>`).join('')}</div>`;
}

function stats(rows){
  const t = [];
  if(S.lens==='icfr'){
    t.push(['Controls',rows.length],['Key controls',rows.filter(d=>d.key_control==='Yes').length],
      ['Preventive',rows.filter(d=>d.control_type==='Preventive').length],
      ['Detective',rows.filter(d=>d.control_type==='Detective').length],
      ['Fraud relevant',rows.filter(d=>d.fraud==='Yes').length],
      ['High risk',rows.filter(d=>d.rating==='High').length]);
  } else {
    t.push(['Risks in scope',rows.length],['High risk',rows.filter(d=>d.rating==='High').length],
      ['Procedures',rows.reduce((a,d)=>a+d.procedures.length,0)],
      ['Red flags',rows.reduce((a,d)=>a+d.red_flags.length,0)],
      ['Processes',new Set(rows.map(d=>d.process)).size]);
  }
  return `<div class="statbar">${t.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
}

function renderMain(){
  const rows = filtered();
  const ind = {name: indName(S.ind)};
  document.getElementById('main').innerHTML = `
    <div class="res-head">
      <div>
        <span class="eyebrow">${ind.name} — ${LENSES[S.lens].sub}</span>
        <h2>${S.sub || S.proc || 'All processes'}</h2>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="meta">${rows.length} of ${pool(S.ind,S.lens).length} entries</span>
        <div class="vswitch">
          <button class="${S.view!=='map'?'on':''}" onclick="S.view='list';renderMain()">${S.lens==='icfr'?'Matrix':'Programmes'}</button>
          <button class="${S.view==='map'?'on':''}" onclick="S.view='map';renderMain()">Coverage map</button>
        </div>
        <button class="ghost" onclick="downloadExcel()">Excel</button>
        <button class="ghost" onclick="window.print()">Print / PDF</button>
      </div>
    </div>
    ${stats(rows)}
    ${S.view==='map' ? coverageMap(rows) : S.lens==='icfr' ? matrix(rows) : programmes(rows)}`;
}

function viewWork(){
  return `<div class="wrap"><div class="work">${sidebar()}<section id="main"></section></div></div>
  ${footerHtml()}`;
}

function render(){
  const app = document.getElementById('app');
  const st = stageNow();
  const map = {about:viewAbout, who:viewWho, improve:viewImprove,
               'pick-industry':pickIndustry, 'pick-process':pickProcess, 'pick-lens':pickLens,
               work:viewWork};
  app.innerHTML = (map[st] || viewAbout)();
  if(st === 'about') runCounters();
  if(st === 'pick-industry'){ renderSearch();
    const inp = document.getElementById('indsearch');
    if(inp && S.iq){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
  if(st === 'work') renderMain();
  tabsBar(); crumbs();
}

render();
</script>
