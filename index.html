and tuned at least annually against the enterprise financial crime risk assessment with results approved by the Financial Crime Committee; alerts are investigated within defined timeframes and closure rationale is subject to quality assurance sampling by a team independent of the investigators.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"E/O, C","coso":"Monitoring Activities","key_control":"Yes","fraud":"Yes","owner":"Head of Financial Crime Compliance","sod":"Quality assurance reviewers are independent of the analysts whose closures they test.","test_design":"Inspect the scenario tuning methodology, committee approval and the quality assurance process.","test_oe":"For a sample of periods, inspect tuning evidence; sample closed alerts and reassess the adequacy of the closure rationale.","population":"Alerts closed during the period and annual tuning documentation","sample":"40 alerts","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-17","process":"Financial Crime","subprocess":"Suspicious Activity Reporting","risk_id":"R-BNK-17","risk":"Suspicious activity reports are filed late or not at all, breaching statutory obligations and exposing the bank to enforcement.","rating":"High","control_objective":"Ensure suspicious activity is escalated, decided and reported within statutory deadlines.","control":"Escalations are logged on receipt and the Money Laundering Reporting Officer records a documented decision to report or not report within the internal deadline; filings are tracked against the statutory timetable and overdue items are escalated to the Financial Crime Committee monthly.","control_type":"Detective","control_nature":"Manual","frequency":"Monthly","assertions":"C, P&D","coso":"Information & Communication","key_control":"Yes","fraud":"Yes","owner":"Money Laundering Reporting Officer","sod":"The MLRO decision is independent of the business relationship generating the escalation.","test_design":"Inspect the escalation log, decision documentation standard and deadline tracking.","test_oe":"For a sample of escalations, agree the decision documentation and measure elapsed time to filing against the statutory deadline.","population":"Internal escalations and filed reports in the period","sample":"25 escalations","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-18","process":"Treasury","subprocess":"Liquidity Ratio Reporting","risk_id":"R-BNK-18","risk":"Regulatory liquidity ratios are misstated because the classification of assets and outflow assumptions are applied incorrectly.","rating":"High","control_objective":"Ensure regulatory liquidity ratios are calculated on correct classifications and approved assumptions.","control":"Monthly, Treasury Reporting calculates the liquidity ratios and an independent review by Risk Control verifies asset classification, haircuts and outflow factors against the regulatory rules before submission; the Asset and Liability Committee reviews the results.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V, P&D","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Treasurer","sod":"The preparer of the ratio calculation is independent of the reviewer in Risk Control.","test_design":"Inspect the calculation methodology, classification rules and evidence of independent review.","test_oe":"For a sample of months, re-perform the ratio calculation from source data and inspect the review evidence.","population":"Monthly liquidity ratio calculations and submissions","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-19","process":"Treasury","subprocess":"Investment Securities Valuation","risk_id":"R-BNK-19","risk":"Securities are valued using stale or unverified prices, misstating the investment portfolio and capital.","rating":"High","control_objective":"Ensure securities are valued using independently verified prices at the appropriate fair value level.","control":"Monthly, an independent price verification is performed by Risk Control against external sources for all portfolio holdings; level 3 valuations require model validation and Valuation Committee approval, and price exceptions above tolerance are escalated before month end close.","control_type":"Detective","control_nature":"IT-Dependent Manual","frequency":"Monthly","assertions":"A/V","coso":"Control Activities","key_control":"Yes","fraud":"No","owner":"Chief Risk Officer","sod":"Front office cannot supply the prices used for independent verification.","test_design":"Inspect the price verification methodology, tolerance thresholds and Valuation Committee terms of reference.","test_oe":"For a sample of months, re-perform price verification on a sample of holdings and inspect resolution of exceptions.","population":"Monthly independent price verification files","sample":"3 of 12 months","industry":["banking"],"lens":["icfr"]},{"control_id":"BNK-20","process":"Treasury","subprocess":"Interest Rate Risk in the Banking Book","risk_id":"R-BNK-20","risk":"Interest rate risk is understated because behavioural assumptions on non-maturity deposits and prepayment are not validated.","rating":"Medium","control_objective":"Ensure interest rate risk measurement uses validated assumptions and remains within approved limits.","control":"Behavioural assumptions for non-maturity deposits and prepayment are validated at least annually against observed customer behaviour by Model Risk, and quarterly the Asset and Liability Committee reviews interest rate risk measures against board-approved limits with breaches escalated.","control_type":"Detective","control_nature":"Manual","frequency":"Quarterly","assertions":"A/V, P&D","coso":"Risk Assessment","key_control":"Yes","fraud":"No","owner":"Treasurer","sod":"Model owners in Treasury are separate from the Model Risk validation function.","test_design":"Inspect the assumption validation methodology and ALCO limit framework.","test_oe":"Obtain the most recent validation; re-perform the assumption back-test and inspect ALCO escalation of breaches.","population":"Annual assumption validations and quarterly ALCO packs","sample":"2 of 4 quarters","industry":["banking"],"lens":["icfr"]},{"id":"IA-TL-01","industry":["logistics"],"process":"Fleet & Asset Management","subprocess":"Vehicle Acquisition & Disposal","risk":"Vehicles are acquired outside the approved capital plan, or disposed of below market value to related parties.","rating":"High","risk_category":"Operational","audit_objective":"Confirm fleet additions and disposals are authorised, competitively sourced, and disposal proceeds are complete and at arm's length.","what_to_review":["Capital plan approval and variance to actual additions","Tender or quotation file for each acquisition above threshold","Disposal method used — auction, trade-in, private sale","Relationship of buyers to employees","Residual value assumptions versus realised proceeds"],"procedures":["Reconcile the fixed asset register to the fleet management system and vehicle licensing records; investigate units in one and not the other.","Select a sample of additions and trace to capital plan approval, business case and competitive quotes.","For all disposals in the period, recompute gain/loss and agree proceeds to bank receipt.","Match buyer names and addresses against the employee and vendor master for related-party indicators.","Compare realised proceeds against an independent used-vehicle price guide for a sample of units."],"red_flags":["Disposals clustered just below the approval threshold","Repeat buyers across multiple disposals","Units written down shortly before sale","Assets still insured or licensed after recorded disposal"],"evidence":["Fixed asset register","Fleet management system extract","Provincial/state vehicle registration records","Auction settlement statements","Capital approval minutes"],"kpis":["Average fleet age","Disposal proceeds vs. book value","% acquisitions within approved plan"],"lens":["ia"],"plain":"Vehicles are valuable and easy to sell cheaply to the wrong person if nobody is watching the disposal."},{"id":"IA-TL-02","industry":["logistics"],"process":"Fleet & Asset Management","subprocess":"Fuel Management","risk":"Fuel is drawn for personal vehicles or resold, and the loss is buried in normal consumption variance.","rating":"High","risk_category":"Fraud","audit_objective":"Determine whether fuel consumption is complete, authorised, and reconciled to vehicle activity at the unit level.","what_to_review":["Fuel card issuance and cancellation process","Card-to-vehicle-to-driver assignment integrity","Consumption per kilometre by unit against the fleet norm","Transactions outside route, hours, or tank capacity","Reconciliation of bulk fuel site dips to dispensed volumes"],"procedures":["Obtain the full fuel card transaction file and join it to telematics GPS data; test for fills where the vehicle was more than 5 km from the station.","Test for fill volumes exceeding the unit's tank capacity, and for two fills of the same card within a short window.","Rank units by litres per 100 km and investigate the outlier tail with the terminal manager.","Confirm cards for terminated drivers were cancelled within the policy window.","For bulk sites, reconcile deliveries plus opening dip less closing dip to dispensed volumes; investigate unexplained shrinkage."],"red_flags":["Fills on non-operating days or outside shift hours","Odometer readings entered as round numbers or unchanged","Consumption spikes confined to one terminal","Manual PIN overrides at the pump"],"evidence":["Fuel card provider transaction extract","Telematics / GPS trip data","Driver roster and termination list","Bulk fuel delivery notes and dip records"],"kpis":["Litres per 100 km by unit","Fuel cost per revenue kilometre","Exception rate on card-to-GPS match"],"lens":["ia"],"plain":"Fuel is easy to take and hard to trace, which makes it one of the most common losses in any fleet business."},{"id":"IA-TL-03","industry":["logistics"],"process":"Fleet & Asset Management","subprocess":"Maintenance & Roadworthiness","risk":"Preventive maintenance is deferred to protect operating margin, exposing the company to breakdowns, accidents and regulatory sanction.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether the maintenance programme is executed on schedule and whether defects reported by drivers are actually closed.","what_to_review":["Preventive maintenance schedule compliance by unit","Driver vehicle inspection reports and defect close-out","Out-of-service orders and roadside inspection results","Third-party repair vendor rates versus contract","Warranty claim recovery"],"procedures":["Extract the PM schedule and compute on-time completion by terminal; test whether overdue units continued in revenue service.","Trace a sample of driver-reported defects through to a work order and confirmed repair, measuring days open.","Obtain regulator roadside inspection data and reconcile out-of-service findings to internal maintenance records.","Recompute a sample of third-party repair invoices against contracted labour rates and parts mark-up."],"red_flags":["Defects repeatedly re-reported on the same unit","PM completions recorded in bulk at period end","High share of repairs at a single vendor","Inspection sign-offs by staff not on shift"],"evidence":["Maintenance management system work orders","Driver inspection reports","Regulator inspection database","Repair vendor contracts and invoices"],"kpis":["PM on-time completion %","Roadside out-of-service rate","Mean time between failures"],"lens":["ia"],"plain":"Skipping maintenance saves money this month and causes breakdowns, accidents and regulator action later."},{"id":"IA-TL-04","industry":["logistics"],"process":"Freight Revenue & Billing","subprocess":"Freight Billing Accuracy","risk":"Shipments are delivered but never invoiced, or are invoiced at the wrong rate, weight or accessorial — revenue leakage that never appears in a variance.","rating":"High","risk_category":"Financial","audit_objective":"Verify that every delivered shipment is billed, once, at the contracted rate, with all applicable accessorial charges captured.","what_to_review":["Shipment-to-invoice completeness","Rate table maintenance and approval","Accessorial charge capture — waiting time, residential, re-delivery, fuel surcharge","Dimensional weight re-measurement","Manual rate overrides and credits"],"procedures":["Reconcile delivered shipments in the operations system to invoiced shipments in billing; quantify and age the unbilled population.","Re-price a sample of invoices independently from the contract rate table and quantify the variance.","Analyse manual rate overrides by user; test the largest for approval evidence.","Test dimensional re-weigh exceptions to confirm the corrected charge was billed.","Analyse credit notes by reason code, customer and issuer for concentration."],"red_flags":["Unbilled shipments ageing beyond the billing window","Overrides concentrated in one user or customer","Accessorial capture rate far below peer terminals","Credits issued shortly after month end"],"evidence":["Operations shipment file","Billing system invoice extract","Customer contract rate tables","Scale and dimensioner data","Credit note register"],"kpis":["Revenue leakage as % of billed revenue","Unbilled shipment ageing","Credit notes as % of revenue"],"lens":["ia"],"plain":"Delivering a shipment and never invoicing it is pure lost revenue, and it does not show up as a variance anywhere."},{"id":"IA-TL-05","industry":["logistics"],"process":"Freight Revenue & Billing","subprocess":"Customer Contracts & Pricing","risk":"Discounts and fuel surcharge caps are granted outside delegated authority, eroding margin on long-term contracts.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm customer pricing reflects properly authorised terms and that contract profitability is monitored after signature.","what_to_review":["Delegation of authority for discounting","Fuel surcharge mechanism and caps","Contract profitability review after award","Renewal and evergreen clauses","Volume commitment enforcement"],"procedures":["Select the largest contracts by revenue and agree discount levels to the delegation of authority matrix.","Recompute the fuel surcharge applied against the contractual index for a sample of months.","Compare contracted volume commitments to actual shipped volumes and test whether shortfall charges were billed.","Review post-award profitability reporting and test whether loss-making contracts are escalated."],"red_flags":["Discounts approved by the salesperson's direct report only","Surcharge caps not reflected in the rate engine","Contracts auto-renewing without repricing","Margin below cost-to-serve with no escalation"],"evidence":["Signed customer contracts","Delegation of authority matrix","Rate engine configuration","Contract profitability reports"],"kpis":["Average discount %","Contribution margin by contract","% contracts repriced at renewal"],"lens":["ia"],"plain":"Discounts agreed by salespeople outside their authority quietly erode the margin on multi-year contracts."},{"id":"IA-TL-06","industry":["logistics"],"process":"Network Operations","subprocess":"Linehaul & Capacity Planning","risk":"Purchased transportation is bought at spot rates when contracted capacity was available, inflating cost per shipment.","rating":"Medium","risk_category":"Operational","audit_objective":"Evaluate whether linehaul capacity decisions follow the planning process and whether purchased transportation is procured at the best available rate.","what_to_review":["Load planning and trailer utilisation","Contracted versus spot carrier mix","Empty-mile and deadhead analysis","Carrier rate confirmation versus invoice","Detention and demurrage charges"],"procedures":["Analyse trailer cube and weight utilisation by lane; identify structurally under-loaded lanes.","Compare spot purchases to available contracted capacity on the same lane and date; quantify the premium paid.","Recompute a sample of carrier invoices against the rate confirmation, including accessorials and detention.","Test the approval trail for spot buys above the contracted rate."],"red_flags":["Spot buys concentrated with one broker","Repeated detention charges at the same terminal","Utilisation reported without reconciliation to scale data","Rate confirmations issued after the move"],"evidence":["Transportation management system load data","Carrier contracts and rate confirmations","Carrier invoices","Terminal dock schedules"],"kpis":["Trailer utilisation %","Empty miles %","Spot vs. contract rate premium"],"lens":["ia"],"plain":"Buying transport at short notice costs far more than using capacity already under contract."},{"id":"IA-TL-07","industry":["logistics"],"process":"Network Operations","subprocess":"Terminal & Warehouse Operations","risk":"Cargo is lost, damaged or stolen in the terminal and the loss is absorbed as an operating expense without root-cause investigation.","rating":"High","risk_category":"Operational","audit_objective":"Assess the integrity of custody controls over freight in the terminal and the completeness of loss reporting.","what_to_review":["Chain-of-custody scanning at each handoff","Physical security — access control, CCTV coverage, seal integrity","High-value and controlled-goods segregation","Overage, shortage and damage reporting","Claims recovery from carriers and insurers"],"procedures":["Walk the terminal and observe scanning discipline at induction, sort and load; compare observed practice to the procedure.","Extract shipments with a missing scan event and test whether each was investigated.","Test seal number recording against trailer manifests for inbound and outbound loads.","Reconcile the OS&D log to claims paid and to the general ledger loss account.","Review terminal access lists against active employee records."],"red_flags":["Losses clustered by shift, lane or employee","Seal numbers recorded as sequential or blank","CCTV coverage gaps at high-value cages","Claims written off below the investigation threshold"],"evidence":["Scan event data","OS&D log","Claims register","Access control logs and CCTV retention records","Trailer seal manifests"],"kpis":["Loss ratio per million shipments","Claims paid vs. recovered","Scan compliance %"],"lens":["ia"],"plain":"Freight changes hands repeatedly in a terminal, and each handover is an opportunity for it to go missing."},{"id":"IA-TL-08","industry":["logistics"],"process":"Safety & Regulatory Compliance","subprocess":"Driver Hours & Licensing","risk":"Drivers operate beyond legal hours-of-service limits or with lapsed licences and medical certification, creating liability and regulatory exposure.","rating":"High","risk_category":"Compliance","audit_objective":"Determine whether driver qualification files are complete and hours-of-service limits are monitored and enforced.","what_to_review":["Driver qualification file completeness","Licence and medical certificate expiry monitoring","Electronic logging device data and edits","Hours-of-service violation follow-up","Use of owner-operators and their compliance status"],"procedures":["Sample driver files and test for licence, abstract, medical certificate, training records and annual review.","Extract ELD data and quantify violations by driver and terminal; test disciplinary follow-up for the most frequent offenders.","Analyse ELD log edits by user — edits made by dispatch rather than the driver warrant challenge.","Cross-check active drivers against the licence expiry report on the audit date."],"red_flags":["Log edits concentrated near the violation threshold","Unassigned driving time","Drivers dispatched with expired medicals","Owner-operators outside the compliance monitoring scope"],"evidence":["Driver qualification files","ELD/telematics hours data","Licence abstract monitoring reports","Dispatch records"],"kpis":["HOS violations per 1,000 driving hours","% driver files complete","Unassigned driving time hours"],"lens":["ia"],"plain":"Drivers over their legal hours or without valid licences create liability the company cannot insure away."},{"id":"IA-TL-09","industry":["logistics"],"process":"Safety & Regulatory Compliance","subprocess":"Dangerous Goods & Customs","risk":"Dangerous goods are accepted, or cross-border shipments are declared, without the required documentation and classification, exposing the company to penalties and shipment seizure.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm regulated shipments are correctly classified, documented and handled by trained personnel.","what_to_review":["Dangerous goods acceptance and classification","Training and certification currency for handlers","Customs declaration accuracy and tariff classification","Denied-party and sanctions screening","Broker performance and record retention"],"procedures":["Sample dangerous goods shipments and test declaration, placarding, packaging and handler certification.","Re-perform tariff classification on a sample of cross-border shipments and quantify duty variance.","Test that denied-party screening runs on every consignee and that hits are cleared by compliance, not operations.","Review regulator correspondence, penalties and corrective action closure."],"red_flags":["Screening exceptions cleared by the booking agent","Classification changed after a duty query","Training certificates expiring without replacement","Recurring penalties for the same defect"],"evidence":["Dangerous goods declarations","Training register","Customs entries and broker files","Screening system logs","Regulator penalty notices"],"kpis":["DG documentation error rate","Customs entry amendment rate","% handlers certified"],"lens":["ia"],"plain":"Dangerous goods and customs errors stop shipments and bring penalties, sometimes personal ones."},{"id":"IA-TL-10","industry":["logistics"],"process":"Third Party Management","subprocess":"Owner-Operator & Subcontract Carriers","risk":"Subcontracted carriers are engaged without insurance, safety rating or contract, transferring their liability back to the company.","rating":"High","risk_category":"Compliance","audit_objective":"Verify that every carrier moving freight has been qualified, contracted and monitored throughout the engagement.","what_to_review":["Carrier onboarding and qualification checks","Insurance certificate currency and limits","Safety rating monitoring after onboarding","Contract coverage and indemnity terms","Payment to carriers not in the approved master"],"procedures":["Reconcile carriers paid in the period to the approved carrier master; investigate every payee not on the master.","Test insurance certificate expiry against the dates freight was actually tendered to each carrier.","Re-check current safety ratings for the top carriers by spend and test escalation of downgrades.","Review contracts for indemnity, sub-contracting prohibition and audit rights."],"red_flags":["Carriers paid with no contract on file","Insurance lapses covered by an expired certificate on file","Freight tendered to carriers with conditional safety ratings","Single-source lanes without competitive review"],"evidence":["Carrier master data","Accounts payable carrier spend","Insurance certificates","Regulator safety rating database","Carrier contracts"],"kpis":["% carrier spend under contract","Insurance lapse exceptions","% spend with conditional-rated carriers"],"lens":["ia"],"plain":"When another carrier moves your freight, their insurance and safety record become your problem."},{"id":"IA-X-01","industry":["cross"],"process":"Procure to Pay","subprocess":"Vendor Master & Payments","risk":"Payments are made to fictitious vendors, or to genuine vendors at bank details altered by a fraudster.","rating":"High","risk_category":"Fraud","audit_objective":"Determine whether vendor master changes are independently verified and whether the payment population contains indicators of fraud or duplication.","what_to_review":["Vendor creation and bank change verification","Segregation between vendor maintenance, invoice entry and payment release","Duplicate payment detection","Employee-to-vendor data matching","Dormant vendor reactivation"],"procedures":["Match the vendor master against the employee master on bank account, address, tax ID and phone number.","Test all bank detail changes in the period for evidence of independent call-back verification to a number obtained from an independent source.","Run duplicate payment analytics on invoice number, amount, date and vendor across near-matches.","Identify vendors reactivated after long dormancy and test the first payment after reactivation.","Test system access to confirm no user can both maintain the vendor and release the payment."],"red_flags":["Bank change immediately followed by a large payment","Vendors sharing a bank account","Invoices just below the approval threshold","Vendor address matching an employee address"],"evidence":["Vendor master change log","Employee master","Payment run files","ERP access and role assignments"],"kpis":["Duplicate payments recovered","% bank changes with verified call-back","Vendor master exception count"],"lens":["ia"],"plain":"Payments to suppliers are the most common route for money to leave a company fraudulently."},{"id":"IA-X-03","industry":["cross"],"process":"IT & Technology","subprocess":"Access Management","risk":"Users retain access after role change or termination, or hold combinations of access that allow a transaction to be initiated and approved by the same person.","rating":"High","risk_category":"IT","audit_objective":"Assess whether logical access is granted, reviewed and removed in line with role requirements and segregation of duties rules.","what_to_review":["Joiner, mover and leaver processing","Periodic user access recertification","Privileged and generic account use","Segregation of duties conflict matrix","Access to production data and direct database changes"],"procedures":["Reconcile active system accounts to the active employee list; test every orphan account.","Measure elapsed days from termination to access removal across all leavers in the period.","Run the SoD conflict matrix against current role assignments and quantify unmitigated conflicts.","Test whether the last recertification was completed by the business owner and whether flagged removals actually occurred.","Review privileged account activity logs for direct data changes outside change management."],"red_flags":["Recertification approved in bulk on a single day","Generic accounts shared by a team","Firefighter access left permanently enabled","Removals flagged but never executed"],"evidence":["User access listings by system","HR joiner/leaver data","Recertification evidence","Privileged activity logs"],"kpis":["Days to revoke access","Unmitigated SoD conflicts","% accounts recertified on time"],"lens":["ia"],"plain":"People who change jobs or leave often keep their old system access, which is how small problems become large ones."},{"id":"IA-X-04","industry":["cross"],"process":"Governance & Entity Level Controls","subprocess":"Whistleblower & Conflicts of Interest","risk":"Concerns raised through the ethics line are not investigated independently, or undisclosed conflicts of interest influence supplier selection.","rating":"Medium","risk_category":"Strategic","audit_objective":"Evaluate whether the ethics reporting channel is trusted and effective, and whether conflicts of interest are disclosed and managed.","what_to_review":["Ethics line availability, anonymity and awareness","Case triage, investigation independence and closure","Conflict of interest declaration completeness","Related-party transactions with declared interests","Retaliation monitoring"],"procedures":["Review the case log for volume, category, ageing and closure quality; test a sample end to end.","Test whether cases implicating management were investigated by someone outside that reporting line.","Reconcile conflict of interest declarations to the employee population and test completeness for decision-makers.","Match declared interests against the vendor master and investigate transactions with connected parties."],"red_flags":["Very low case volume relative to headcount","Cases closed as unsubstantiated with no documented work","Declarations missing from procurement and finance staff","Reporters subsequently exiting the business"],"evidence":["Ethics case management log","Conflict of interest declarations","Vendor master","Exit interview records"],"kpis":["Cases per 1,000 employees","Average days to close","% declarations completed"],"lens":["ia"],"plain":"If people do not trust the confidential reporting line, management is the last to know about problems."},{"id":"IA-BNK-01","industry":["banking"],"process":"Credit & Lending","subprocess":"Credit Underwriting","risk":"Credit decisions are influenced by relationship pressure or incentive targets, so exceptions to policy become routine rather than exceptional.","rating":"High","risk_category":"Operational","audit_objective":"Assess whether credit policy exceptions are genuinely exceptional, escalated to the right level, and performing no worse than compliant lending.","what_to_review":["Policy exception rate by product, branch and originator","Level at which exceptions are approved","Performance of exception loans versus the book","Incentive structures for lending staff","Override of automated credit scores"],"procedures":["Extract all loans booked with a policy exception; analyse rate by originator, branch and product against the portfolio average.","Test that each exception was approved at the level the policy requires, not one below.","Compare arrears and default rates of exception loans to compliant loans of the same vintage.","Review the incentive plan for lending staff and test whether volume targets dominate credit quality measures.","Investigate cases where an automated score was manually overridden and trace the justification."],"red_flags":["Exceptions concentrated with a small number of originators","Exceptions approved by the originator's immediate manager only","Rising exception rate near quarter end","Overrides without recorded justification"],"evidence":["Loan origination system extract","Credit policy and delegated authority matrix","Arrears and default data by vintage","Incentive plan documents"],"kpis":["Policy exception rate","Default rate: exception vs compliant","% exceptions approved at correct level"],"lens":["ia"],"plain":"If salespeople can push through loans that break the rules, the bank ends up with borrowers who were never going to pay."},{"id":"IA-BNK-02","industry":["banking"],"process":"Financial Crime","subprocess":"AML, KYC and Sanctions","risk":"Customer due diligence is incomplete or out of date, and transaction monitoring alerts are closed without adequate investigation, exposing the bank to regulatory enforcement.","rating":"High","risk_category":"Compliance","audit_objective":"Determine whether customer due diligence, screening and transaction monitoring operate as designed and that alerts are investigated to a defensible standard.","what_to_review":["CDD and enhanced due diligence completeness at onboarding","Periodic review cycle for existing customers, especially high risk","Sanctions and PEP screening coverage and tuning","Transaction monitoring alert backlog and closure quality","Suspicious activity report timeliness and quality"],"procedures":["Sample customer files across risk ratings and test CDD completeness against policy, including source of funds for high-risk customers.","Quantify overdue periodic reviews by risk rating and test whether relationships continued to transact.","Re-perform screening on a sample of customers and counterparties to confirm the system produces the expected hits.","Sample closed monitoring alerts and reassess whether the closure rationale is supportable; measure closure rate by analyst.","Test elapsed time from alert to suspicious activity report filing against the regulatory deadline."],"red_flags":["A single analyst closing far more alerts than peers","Alerts closed with template narratives","Screening rules relaxed after a volume spike","High-risk customers overdue for review still transacting"],"evidence":["Customer files and CDD records","Alert management system extract","Screening system configuration and tuning records","SAR register and regulator correspondence"],"kpis":["Overdue periodic reviews","Alert closure rate by analyst","Days from alert to SAR filing"],"lens":["ia"],"plain":"Banks are legally required to know who their customers are and to report suspicious activity. Getting this wrong brings fines and, sometimes, criminal charges."},{"id":"IA-INS-01","industry":["insurance"],"process":"Claims","subprocess":"Claims Leakage","risk":"Claims are settled for more than the policy requires because coverage is not properly applied, subrogation is not pursued and reserves anchor the settlement.","rating":"High","risk_category":"Operational","audit_objective":"Quantify claims leakage and identify where in the handling process value is lost.","what_to_review":["Coverage verification before settlement","Reserve setting discipline and reserve movement patterns","Subrogation and recovery identification","Use of preferred suppliers and negotiated rates","Settlement authority adherence"],"procedures":["Re-review a sample of closed claims against policy wording and quantify amounts paid above entitlement.","Analyse reserve movements: claims settled at or near the initial reserve may indicate anchoring rather than assessment.","Identify closed claims with third-party liability indicators and test whether subrogation was pursued.","Compare settlement values by handler and by supplier for similar claim types."],"red_flags":["Settlements clustered just below authority limits","Claims closed with no subrogation review","A handler consistently settling above peer averages","Repeat claimants across policies"],"evidence":["Claims system extract with reserve history","Policy wordings","Supplier panel agreements","Subrogation recovery records"],"kpis":["Leakage as % of claims paid","Subrogation recovery rate","Average settlement by handler"],"lens":["ia"],"plain":"Every extra pound paid on a claim beyond what the policy requires is profit gone, and it happens quietly across thousands of claims."},{"id":"IA-INS-02","industry":["insurance"],"process":"Distribution","subprocess":"Broker and Agent Management","risk":"Business is written through intermediaries who are not authorised, whose commissions are calculated incorrectly, or who mis-sell products to unsuitable customers.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm intermediaries are properly appointed and monitored, and that commission and conduct risks are controlled.","what_to_review":["Intermediary appointment, licensing and vetting","Commission calculation and payment accuracy","Product suitability and sales conduct monitoring","Premium collection and client money handling by intermediaries","Complaint and cancellation patterns by intermediary"],"procedures":["Reconcile intermediaries paid commission to the approved and licensed intermediary register.","Recompute commission for a sample of policies against the agency agreement and test clawback on early cancellation.","Analyse lapse, cancellation and complaint rates by intermediary and investigate the outlier tail.","Test premium remittance timeliness against the agency agreement and quantify amounts held beyond terms."],"red_flags":["Commission paid to intermediaries with lapsed licences","High early-cancellation rates concentrated with one agent","Premium remitted late or netted against commission","Policies written for customers outside the target market"],"evidence":["Intermediary register and agency agreements","Commission payment records","Policy lapse and complaint data","Premium remittance records"],"kpis":["Early cancellation rate by intermediary","Commission error rate","Days to remit premium"],"lens":["ia"],"plain":"Brokers and agents sell using the insurer's name, so whatever they do wrong lands on the insurer's desk."},{"id":"IA-MFG-01","industry":["manufacturing"],"process":"Production & Costing","subprocess":"Production Planning and Yield","risk":"Actual production yield falls below standard and the loss is absorbed in variances rather than investigated, masking equipment, material or process failure.","rating":"Medium","risk_category":"Operational","audit_objective":"Evaluate whether yield and scrap losses are measured accurately at the line level and driven down through root-cause action.","what_to_review":["Yield and scrap reporting accuracy at each production stage","Rework classification and cost capture","Root-cause analysis on repeat losses","Machine downtime capture and maintenance linkage","Bill of materials accuracy versus actual consumption"],"procedures":["Reconcile material issued to output produced plus scrap for a sample of production orders; investigate unexplained gaps.","Compare reported yield by line and shift; test whether the reporting is system-generated or manually entered.","Trace repeat scrap causes through to a corrective action with a verified closure.","Compare bill of materials quantities to actual consumption for high-volume products."],"red_flags":["Yield reported identically period after period","Scrap recorded in bulk at month end","Rework not distinguished from first-pass output","Downtime attributed to a generic category"],"evidence":["Production order records","Scrap and rework logs","Machine downtime data","Bills of materials"],"kpis":["First-pass yield %","Scrap as % of material issued","Overall equipment effectiveness"],"lens":["ia"],"plain":"Material that goes in but does not come out as product is money lost. If it is buried in general variances, nobody fixes the cause."},{"id":"IA-MFG-02","industry":["manufacturing"],"process":"Health, Safety & Environment","subprocess":"Workplace Safety and Environmental Compliance","risk":"Safety incidents are under-reported and environmental permit conditions are breached, exposing the company to enforcement, shutdown and reputational damage.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether safety and environmental obligations are identified, monitored and actually met at plant level.","what_to_review":["Permit inventory and condition tracking","Incident and near-miss reporting culture","Corrective action closure after incidents","Emissions, effluent and waste monitoring and reporting","Contractor safety management on site"],"procedures":["Build an inventory of environmental permits and test compliance with each material condition, including monitoring and reporting deadlines.","Compare reported incident rates across plants; a plant with an implausibly low rate warrants interview-based testing.","Trace a sample of incidents to root-cause analysis and verify the corrective action was implemented, not just recorded.","Test contractor induction, permit-to-work and competency records for work performed on site."],"red_flags":["Near-miss reporting falling while incidents hold steady","Corrective actions closed with no evidence","Monitoring results clustered just inside the permit limit","Contractors working without a permit to work"],"evidence":["Permit register and regulator correspondence","Incident management system","Monitoring and emissions data","Contractor induction and permit-to-work records"],"kpis":["Total recordable incident rate","Near-miss to incident ratio","% permit conditions evidenced","Corrective actions overdue"],"lens":["ia"],"plain":"Safety and environmental breaches can shut a plant down, and they injure people. This is not a financial risk first."},{"id":"IA-RTL-01","industry":["retail"],"process":"Store Operations","subprocess":"Store Cash and Refund Abuse","risk":"Store staff generate refunds, voids or discounts against genuine sales and remove the cash, or apply staff discounts to customer transactions.","rating":"High","risk_category":"Fraud","audit_objective":"Identify cash losses arising from transaction manipulation at the point of sale and test whether monitoring detects them.","what_to_review":["Refund, void and no-sale authorisation at the till","Refunds without an original receipt or card match","Staff discount usage patterns","Till variance investigation thresholds","CCTV coverage over till points"],"procedures":["Analyse refunds by cashier per hundred transactions and rank stores and operators; select the outlier tail for CCTV review.","Test refunds processed to a different payment method than the original sale.","Match staff discount transactions to employee purchase records and test for use on non-employee sales.","Test whether till variances below the investigation threshold accumulate to a material amount by operator."],"red_flags":["Refunds concentrated in the operator's own shift with no customer present on CCTV","Repeated small variances just under the threshold","Voids immediately after a cash sale","Discount cards used at multiple stores"],"evidence":["Point-of-sale transaction log","Till variance reports","Employee discount card register","CCTV footage"],"kpis":["Refunds per 100 transactions by operator","Till variance per store","Voids as % of sales"],"lens":["ia"],"plain":"Tills are where cash and staff meet thousands of times a day, and a refund against a real sale is the easiest way to take money."},{"id":"IA-RTL-02","industry":["retail"],"process":"Merchandising","subprocess":"Supplier Terms and Delivery Compliance","risk":"Suppliers under-deliver, deliver late or invoice outside agreed terms, and the store network absorbs the loss because claims are never raised.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm that goods received match what was ordered and invoiced, and that supplier non-compliance is claimed and recovered.","what_to_review":["Three-way match discipline between order, receipt and invoice","Short and damaged delivery claim process","On-time in-full performance by supplier","Price differences between contract and invoice","Deduction and chargeback recovery"],"procedures":["Quantify receipts posted without a purchase order and invoices paid without a matched receipt.","Re-price a sample of invoices against contracted terms and quantify overcharges.","Analyse on-time in-full performance by supplier and test whether contractual service credits were claimed.","Test the ageing of open supplier claims and the recovery rate."],"red_flags":["Receipts booked in full despite recorded shortages","Claims raised but never followed up","Price variances always in the supplier's favour","A supplier consistently below service level with no credits taken"],"evidence":["Purchase order, receipt and invoice data","Supplier contracts and trading terms","Claims and deductions register","On-time in-full reporting"],"kpis":["Price variance recovered","OTIF % by supplier","Open claims ageing"],"lens":["ia"],"plain":"If suppliers under-deliver or overcharge and nobody claims it back, the loss is simply absorbed store by store."},{"id":"IA-AVN-01","industry":["aviation"],"process":"Safety & Regulatory Compliance","subprocess":"Airworthiness and Maintenance Compliance","risk":"Aircraft are released to service without all required maintenance tasks and airworthiness directives being completed and certified.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm that maintenance is performed and certified by authorised personnel and that airworthiness records are complete and traceable.","what_to_review":["Airworthiness directive and service bulletin compliance tracking","Certifying staff authorisation scope and currency","Deferred defect management against the minimum equipment list","Parts traceability and approved supply chain","Maintenance record retention and integrity"],"procedures":["Select applicable airworthiness directives and trace each to a completed and certified work package within the required interval.","Test that certifying signatures belong to staff whose authorisation covers that aircraft type and task, and was current on the date.","Analyse deferred defects for items carried beyond the MEL time limit or repeatedly re-deferred.","Trace a sample of fitted parts to release certificates and approved suppliers."],"red_flags":["Defects repeatedly deferred and re-raised","Certification by staff whose authorisation lapsed","Parts fitted without an airworthiness release certificate","Records completed retrospectively in blocks"],"evidence":["Maintenance information system records","Airworthiness directive register","Certifying staff authorisation records","Parts release certificates","Regulator audit findings"],"kpis":["AD compliance rate","Deferred defects beyond limit","% work packages certified in time"],"lens":["ia"],"plain":"An aircraft with incomplete maintenance records cannot legally fly, regardless of whether the work was actually done."},{"id":"IA-AVN-02","industry":["aviation"],"process":"Ground Operations","subprocess":"Ramp Handling and Aircraft Damage","risk":"Ground handling errors damage aircraft, delay departures and generate airline chargebacks that are absorbed rather than investigated.","rating":"High","risk_category":"Operational","audit_objective":"Assess control over ramp operations, damage reporting and the recovery or prevention of associated cost.","what_to_review":["Ground support equipment maintenance and operator licensing","Aircraft damage reporting and investigation","Delay coding accuracy and attribution","Load control and weight and balance accuracy","Airside driving permits and training currency"],"procedures":["Reconcile ground damage incidents reported internally to airline claims received; investigate claims with no internal report.","Test operator licensing and training currency for a sample of ramp staff and equipment types.","Analyse delay codes attributed to handling and test the supporting evidence for a sample.","Review load sheet accuracy against actual loading for a sample of flights."],"red_flags":["Damage discovered by the airline rather than reported by the station","Delay codes reassigned after the fact","Equipment operated by staff without a current licence","Load sheets amended after departure"],"evidence":["Ground damage register and airline claims","Training and licensing records","Delay reporting data","Load sheets and weight and balance records"],"kpis":["Ground damage incidents per 1,000 turns","On-time departure %","Claims cost per turn"],"lens":["ia"],"plain":"Damage on the ground grounds aircraft and generates claims from airlines, and it is often discovered by the customer rather than the handler."},{"id":"IA-HSP-01","industry":["hospitality"],"process":"Property Operations","subprocess":"Front Office and Cash Handling","risk":"Front desk staff manipulate reservations, comps and petty cash, and the loss is hidden by the volume of small transactions.","rating":"High","risk_category":"Fraud","audit_objective":"Identify cash and revenue loss at the property and assess whether property-level monitoring detects it.","what_to_review":["Comp, discount and rate-override authority at the front desk","Room moves and reservation cancellations after check-in","Petty cash and float custody","Paid-out and refund transactions","Night audit independence"],"procedures":["Analyse comps, rate overrides and zero-rate stays by agent and shift; select the outlier tail for evidence of authorisation.","Test reservations cancelled after the guest checked in, which can conceal a cash sale.","Count floats unannounced at a sample of properties and agree to the recorded balance.","Test paid-outs and refunds for supporting documentation and guest signature.","Confirm the night auditor is not the same person who operated the desk during the shift audited."],"red_flags":["Comps concentrated on one agent or shift","Repeated room moves to lower rate codes","Floats counted only by their own custodian","Guest folios adjusted after checkout"],"evidence":["Property management system transaction log","Night audit packs","Petty cash and float records","CCTV at the front desk"],"kpis":["Comps as % of room revenue","Overrides per agent","Float variance per property"],"lens":["ia"],"plain":"The front desk can give away rooms, discounts and refunds, and each one is money the hotel never sees."},{"id":"IA-HSP-02","industry":["hospitality"],"process":"Procure to Pay","subprocess":"Purchasing and Supplier Relationships","risk":"Property managers direct purchasing to connected suppliers at inflated prices, outside the group procurement framework.","rating":"High","risk_category":"Fraud","audit_objective":"Assess whether property-level purchasing follows the group framework and whether supplier relationships are arm's length.","what_to_review":["Use of contracted group suppliers versus local purchasing","Local supplier onboarding and vetting","Price benchmarking against group contracts","Conflict of interest declarations at property level","Splitting of purchases below approval thresholds"],"procedures":["Quantify spend outside the group contracted supplier list by property and category.","Compare unit prices paid locally against the group contract rate for the same items.","Match local supplier details against employee records for shared addresses, phone numbers and bank accounts.","Test for purchase orders split into amounts just below the approval threshold."],"red_flags":["A property with unusually high local spend","Suppliers created and used only by one property","Invoices consistently just below the threshold","No competitive quotes on recurring local spend"],"evidence":["Accounts payable spend by property and supplier","Group supplier contracts and rates","Employee master data","Purchase order records"],"kpis":["% spend on contract","Price variance to group rate","Split-order exceptions"],"lens":["ia"],"plain":"When each property buys locally, prices drift upward and personal relationships creep in."},{"id":"IA-ECM-01","industry":["ecommerce"],"process":"Online Revenue","subprocess":"Pricing, Promotions and Digital Content","risk":"Pricing and promotion errors are published to the site and honoured at scale before anyone notices, or promotional terms are not met.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess control over what is published to customers and how quickly errors are detected and corrected.","what_to_review":["Price and promotion change approval before publication","Automated checks on price change magnitude","Stacking of promotions and discount codes","Speed of detection and rollback","Advertising and claims compliance"],"procedures":["Test the approval trail for a sample of price and promotion changes published in the period.","Review automated tolerance checks on price changes and test whether they blocked or flagged extreme values.","Test whether discount codes can be stacked or reused beyond their intended limit by re-performing a checkout in a test environment.","Measure elapsed time from publication of known pricing errors to correction, and quantify orders honoured."],"red_flags":["Discount codes shared publicly and still active","Price changes published outside working hours without approval","Repeat incidents with the same root cause","No monetary tolerance on automated price feeds"],"evidence":["Content management change log","Promotion configuration records","Incident log for pricing errors","Order data for affected periods"],"kpis":["Pricing incidents per quarter","Value honoured on error","Mean time to correct"],"lens":["ia"],"plain":"An online pricing error is honoured at scale within minutes, before anyone can react."},{"id":"IA-ECM-02","industry":["ecommerce"],"process":"IT & Technology","subprocess":"Customer Data and Privacy","risk":"Personal data is retained longer than permitted, shared with third parties without a lawful basis, or exposed through weak access control.","rating":"High","risk_category":"Compliance","audit_objective":"Determine whether personal data is held, used and shared in line with privacy obligations and consent.","what_to_review":["Data inventory and lawful basis for each processing purpose","Consent capture and withdrawal handling","Retention and deletion in practice, not just in policy","Third-party data sharing and processor agreements","Access to production customer data by staff and vendors"],"procedures":["Trace a sample of processing purposes to a documented lawful basis and to what customers were actually told.","Test deletion by selecting accounts that requested erasure and searching all systems, including backups and analytics, for residual data.","Reconcile third parties receiving customer data to signed processor agreements.","Review who holds access to production customer data and test whether that access is justified by role."],"red_flags":["Marketing to customers who withdrew consent","Data retained \"in case it is useful\"","Analytics tools receiving identifiable data","Vendor access never reviewed after onboarding"],"evidence":["Data inventory and processing records","Consent management logs","Erasure request records","Processor agreements","Access listings"],"kpis":["Erasure requests completed in time","Systems with retention enforced","Vendors with signed agreements"],"lens":["ia"],"plain":"Customer data is regulated. Keeping it too long or sharing it too widely is a fine, not just a bad look."},{"id":"IA-FMC-01","industry":["fmcg"],"process":"Distribution","subprocess":"Route to Market and Distributor Performance","risk":"Distributors sell outside their assigned territory, hold stock beyond shelf life, or claim promotional support they did not deliver.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess whether distributor arrangements are performing as contracted and claims are substantiated.","what_to_review":["Territory assignment and cross-territory selling","Distributor stock levels and shelf-life exposure","Promotional claim substantiation","Credit exposure and payment performance","Distributor audits performed by the company"],"procedures":["Analyse sell-in versus sell-out data by distributor to identify stock building beyond normal cover.","Sample promotional claims and test for evidence the activity was performed, such as photographs, invoices or third-party verification.","Test credit exposure by distributor against approved limits and ageing.","Review the company's own distributor audit programme, coverage and follow-up of findings."],"red_flags":["Distributors with stock cover far above the network average","Claims supported by generic or reused evidence","Sales spikes before price increases","Distributor audits repeatedly deferred"],"evidence":["Distributor sell-in and sell-out data","Promotional claim files","Credit exposure reports","Distributor audit reports"],"kpis":["Stock cover days by distributor","% claims with valid evidence","Overdue distributor balances"],"lens":["ia"],"plain":"Distributors buying more than they can sell means the sales figures are not real, and the stock comes back."},{"id":"IA-FMC-02","industry":["fmcg"],"process":"Quality & Product Safety","subprocess":"Food Safety and Product Quality","risk":"A product safety failure reaches consumers because quality controls at the plant are bypassed under production pressure.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether food safety controls operate as designed under real production conditions.","what_to_review":["HACCP plan currency and critical control point monitoring","Deviations at critical control points and their disposition","Hygiene, pest control and allergen segregation","Supplier raw material approval and incoming testing","Certification audit findings and closure"],"procedures":["Test critical control point monitoring records for completeness and for deviations released without a documented disposition decision.","Walk the plant during production and compare observed practice to the HACCP plan, particularly allergen changeover.","Trace incoming raw material batches to approved suppliers and required certificates of analysis.","Review third-party certification and regulator findings and verify corrective actions were implemented."],"red_flags":["Monitoring records completed in identical handwriting at one time","Deviations released \"on management authority\"","Allergen changeover cleaning shortened to hit output","Supplier approvals lapsed but deliveries accepted"],"evidence":["HACCP plans and CCP monitoring records","Deviation and disposition logs","Supplier approval files and certificates of analysis","Certification audit reports"],"kpis":["CCP deviations per period","% records complete","Overdue corrective actions"],"lens":["ia"],"plain":"If a product batch is unsafe, the company must find every unit fast. Poor traceability turns a problem into a crisis."},{"id":"IA-UTL-01","industry":["utilities"],"process":"Asset Management","subprocess":"Asset Integrity and Safety Critical Maintenance","risk":"Safety-critical network maintenance is deferred, raising the risk of asset failure, supply interruption and public harm.","rating":"High","risk_category":"Operational","audit_objective":"Assess whether inspection and maintenance of safety-critical network assets is performed on schedule and defects are closed.","what_to_review":["Asset criticality classification and inspection intervals","Overdue safety-critical maintenance by asset class","Defect close-out and interim risk mitigation","Vegetation management and third-party interference","Contractor competency for high-risk work"],"procedures":["Extract the maintenance plan and quantify overdue safety-critical tasks by asset class and region.","Trace a sample of high-priority defects to closure and verify the remediation physically occurred.","Test whether deferrals were formally risk-assessed and approved at the required level.","Review contractor competency and authorisation records for high-voltage or high-pressure work."],"red_flags":["Deferrals approved in blocks at year end","Defects downgraded in priority without justification","Inspections recorded as complete with no field evidence","Contractors working outside their authorisation"],"evidence":["Asset management system maintenance records","Defect registers","Deferral approvals","Contractor authorisation records"],"kpis":["Overdue safety-critical tasks","Defect close-out days","Unplanned outage frequency"],"lens":["ia"],"plain":"Utility assets carry public safety risk. Deferring maintenance to save money moves the cost to someone's injury."},{"id":"IA-UTL-02","industry":["utilities"],"process":"Customer Operations","subprocess":"Vulnerable Customers and Disconnection","risk":"Customers in financial hardship or on medical support are disconnected or pursued in breach of regulatory customer protection obligations.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm that customer protection obligations are applied before any restriction or disconnection.","what_to_review":["Identification and flagging of vulnerable and life-support customers","Hardship programme access and affordability assessment","Pre-disconnection notification and cooling-off requirements","Debt collection agency conduct","Complaint and ombudsman case outcomes"],"procedures":["Reconcile disconnections executed against the vulnerable and life-support customer registers; investigate any overlap.","Test that each disconnection followed every required notification step within the prescribed timeframes.","Sample hardship applications and test the timeliness and consistency of assessment.","Review ombudsman and regulator determinations and trace systemic causes to remediation."],"red_flags":["Life-support flags removed shortly before disconnection","Notification letters generated but not despatched","Hardship applications rejected at high rates by one team","Repeat ombudsman findings on the same issue"],"evidence":["Disconnection records","Vulnerable customer registers","Hardship application files","Ombudsman and regulator correspondence"],"kpis":["Disconnections in breach","Hardship assessment turnaround","Ombudsman cases upheld"],"lens":["ia"],"plain":"Cutting off a customer who is ill or in hardship is a regulatory breach and a front-page story."},{"id":"IA-TEL-01","industry":["telecom"],"process":"Service Revenue","subprocess":"Revenue Leakage Across the Order to Cash Chain","risk":"Services are provisioned on the network but never reach billing, so the customer uses the service without ever being charged.","rating":"High","risk_category":"Operational","audit_objective":"Quantify revenue leakage between provisioning and billing and assess whether revenue assurance detects it.","what_to_review":["Reconciliation of network provisioning records to billing subscriptions","Free-of-charge and test accounts left active","Product catalogue consistency between systems","Discount and credit application","Revenue assurance coverage and independence"],"procedures":["Reconcile active services on the network to active billing subscriptions; quantify the value of unbilled active services.","Extract free-of-charge, employee and test accounts and test whether each remains justified.","Compare product and tariff definitions across provisioning, rating and billing for inconsistencies.","Analyse credits and manual adjustments by user and reason code."],"red_flags":["Test accounts with genuine consumption","Long-lived free-of-charge accounts","Catalogue changes made in one system only","Credits concentrated with a small number of users"],"evidence":["Network provisioning extracts","Billing subscription data","Product catalogue configurations","Credit and adjustment logs"],"kpis":["Unbilled active services","Leakage as % of revenue","Credits per 1,000 subscribers"],"lens":["ia"],"plain":"Every call or data session that never reaches billing is a service given away free."},{"id":"IA-TEL-02","industry":["telecom"],"process":"Network & Infrastructure","subprocess":"Network Resilience and Change Management","risk":"A poorly controlled network change causes a major service outage, with regulatory reporting obligations and customer compensation following.","rating":"High","risk_category":"IT","audit_objective":"Assess whether network changes are controlled and whether resilience and recovery capability is proven rather than assumed.","what_to_review":["Change approval, testing and back-out planning","Emergency change usage and retrospective approval","Single points of failure in core network","Disaster recovery and failover testing","Major incident reporting to the regulator"],"procedures":["Sample network changes and test for approval, testing evidence and a documented back-out plan.","Quantify emergency changes as a proportion of all changes and test whether retrospective approval occurred.","Review the most recent failover or disaster recovery test and confirm it exercised a genuine failover, not a tabletop walkthrough.","Trace major incidents to root-cause analysis, regulatory notification within the required window, and corrective action closure."],"red_flags":["Emergency changes used routinely to bypass approval","Back-out plans stated as \"restore from backup\" with no detail","DR tests deferred or scoped to non-critical systems","Repeat incidents with the same root cause"],"evidence":["Change management records","Emergency change log","DR test reports","Major incident and regulatory notification records"],"kpis":["Emergency changes as % of total","Change failure rate","Time to regulatory notification"],"lens":["ia"],"plain":"A badly controlled network change can take service down for millions of customers, and that has to be reported to the regulator."},{"id":"IA-X-06","industry":["cross"],"process":"Inventory & Costing","subprocess":"Stock Accuracy and Valuation","risk":"Recorded inventory does not reflect what is physically held or what it is genuinely worth, misstating both the balance sheet and margin.","rating":"High","risk_category":"Financial","audit_objective":"Verify that inventory exists, is owned, is counted accurately, and is valued at the lower of cost and net realisable value.","what_to_review":["Count programme coverage, independence and adjustment approval","Goods in transit and consignment stock ownership","Cost build-up and overhead absorption","Net realisable value testing on slow-moving and damaged stock","Third-party locations and stock held by others"],"procedures":["Attend counts at a sample of locations; re-perform test counts in both directions, floor to sheet and sheet to floor.","Test cut-off around the period end for goods received and despatched.","Obtain confirmations for stock held at third parties and reconcile to the ledger.","Recompute the cost build-up for a sample of items including overhead absorption, and compare cost to recent selling prices net of costs to sell.","Analyse adjustment postings for entries made outside the count process."],"red_flags":["Adjustments posted just after a count to restore the book figure","Consignment stock recorded as owned","Overhead absorption rates unchanged despite volume shifts","Locations never selected for count"],"evidence":["Inventory listings by location","Count sheets and adjustment postings","Third-party stock confirmations","Cost build-up files","Recent sales price data"],"kpis":["Count accuracy %","Adjustment value as % of inventory","Inventory turns"],"lens":["ia"],"plain":"Stock is often the largest number on the balance sheet, and it is only worth what it can actually be sold for."},{"id":"IA-X-07","industry":["cross"],"process":"Fixed Assets","subprocess":"Capital Projects and Asset Existence","risk":"Capital spend is approved on optimistic business cases, overruns without escalation, and assets on the register can no longer be located.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess whether capital investment is authorised, controlled against budget, and whether recorded assets physically exist.","what_to_review":["Business case quality and post-implementation review","Approval authority and project change control","Capitalisation timing and classification","Physical verification programme","Disposals, transfers and idle assets"],"procedures":["Select major projects and compare approved business case benefits to post-implementation actuals; test whether reviews are performed at all.","Test overruns against the re-approval threshold and inspect evidence of escalation.","Physically verify a sample of recorded assets and, in reverse, trace observed assets back to the register.","Test the capitalisation date against evidence the asset was available for use.","Review idle and fully depreciated assets still in service for impairment or life reassessment."],"red_flags":["Post-implementation reviews never performed","Projects split to stay under an approval threshold","Assets on the register nobody can locate","Capitalisation dated before commissioning"],"evidence":["Capital approval papers and business cases","Project cost reports","Fixed asset register","Disposal records"],"kpis":["Capital spend vs. budget","% projects with post-implementation review","Assets verified / not located"],"lens":["ia"],"plain":"Big capital projects get approved on promises, and almost nobody goes back to check whether the promises came true."},{"id":"IA-X-08","industry":["cross"],"process":"Treasury","subprocess":"Cash, Banking and Financial Risk","risk":"Bank mandates, payment authority and hedging activity are not controlled, exposing the organisation to fraud and to unmanaged market risk.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm that banking arrangements, payment authority and treasury activity operate within board-approved mandates.","what_to_review":["Bank account inventory and signatory mandates","Payment release authority and dual authorisation","Treasury policy limits on counterparty, currency and interest exposure","Hedging authorisation and effectiveness","Cash forecasting accuracy and idle balances"],"procedures":["Obtain a complete list of bank accounts from the banks themselves, not from the ledger, and reconcile to the recorded accounts.","Test current signatory mandates against the approved authority list and identify leavers still holding authority.","Test that payment release genuinely requires two independent approvers, including for urgent and manual payments.","Compare open treasury positions to policy limits at several dates and test breach escalation.","Compare cash forecasts to actuals and assess forecasting discipline."],"red_flags":["Bank accounts not in the ledger","Leavers still on mandates","Urgent payments routinely bypassing dual authorisation","Positions repeatedly at or just inside limits"],"evidence":["Bank confirmations and mandate letters","Payment system authority configuration","Treasury policy and position reports","Cash forecasts"],"kpis":["Accounts reconciled to bank confirmations","Payments released single-handed","Limit breaches per quarter"],"lens":["ia"],"plain":"Bank accounts and payment authority are the front door to the company's cash."},{"id":"IA-X-09","industry":["cross"],"process":"Tax","subprocess":"Tax Compliance and Transfer Pricing","risk":"Returns are filed late or on incorrect positions, and intercompany pricing is not supported by documentation, leading to assessments, interest and penalties.","rating":"Medium","risk_category":"Compliance","audit_objective":"Assess whether tax obligations are identified and met on time and whether positions taken are documented and defensible.","what_to_review":["Tax obligation calendar completeness across all jurisdictions","Filing and payment timeliness","Uncertain tax positions and provisioning","Transfer pricing policy, documentation and actual pricing applied","Indirect tax coding accuracy on transactions"],"procedures":["Build the obligation calendar independently from entity and jurisdiction data and compare to the one in use.","Test filing and payment dates against statutory deadlines and quantify interest and penalties incurred.","Review uncertain tax positions and test whether the provision reflects current authority correspondence.","Test whether intercompany transactions were actually priced per the transfer pricing policy and whether local file documentation exists.","Sample transactions and re-perform indirect tax coding."],"red_flags":["Obligations discovered only when the authority writes","Penalties recurring in the same jurisdiction","Transfer pricing documentation prepared long after year end","Manual overrides of tax codes at invoice entry"],"evidence":["Tax obligation calendar","Filed returns and payment records","Authority correspondence and assessments","Transfer pricing documentation"],"kpis":["Filings on time %","Penalties and interest incurred","Jurisdictions with current TP documentation"],"lens":["ia"],"plain":"Filing tax late or on the wrong basis costs interest and penalties, and repeats every year until it is fixed."},{"id":"IA-X-10","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Close Quality and Manual Journals","risk":"Manual journal entries are used to force results to expectation, and the close is completed too quickly for controls to operate meaningfully.","rating":"High","risk_category":"Fraud","audit_objective":"Evaluate the integrity of the financial close, focusing on manual adjustments and account reconciliation quality.","what_to_review":["Manual journal authorisation, support and posting rights","Top-side and consolidation adjustments","Balance sheet reconciliation completion and review quality","Close timetable versus control operation","Estimates and accruals with judgement"],"procedures":["Extract all manual journals and analyse by preparer, value, account, and posting date and time; test round-sum entries, entries posted at unusual hours, and entries to income statement accounts near period end.","Test that each sampled journal has support and an approver independent of the preparer.","Sample balance sheet reconciliations and reassess whether reconciling items are genuinely explained or simply labelled.","Compare journal patterns across periods to identify entries appearing only when results are close to target."],"red_flags":["Journals posted after the close was reported as complete","Recurring entries with the description \"reclass\" and no support","Reconciliations signed the same day they were prepared","Late adjustments always moving in the favourable direction"],"evidence":["Full journal entry extract with user and timestamp","Reconciliation files and sign-offs","Close timetable","Consolidation adjustment schedules"],"kpis":["Manual journals per period","% journals with support","Reconciliations overdue"],"lens":["ia"],"plain":"Manual journals are how results get adjusted at the last minute, which makes them the first place to look."},{"id":"IA-X-11","industry":["cross"],"process":"Third Party Management","subprocess":"Outsourcing and Vendor Oversight","risk":"Critical activities are outsourced without contractual protection, assurance over the provider, or a viable exit, so failures land back on the organisation.","rating":"High","risk_category":"Strategic","audit_objective":"Assess whether third parties performing critical activities are selected, contracted and monitored proportionately to the risk they carry.","what_to_review":["Inventory of third parties and criticality assessment","Due diligence performed before contracting","Contract terms — service levels, audit rights, data protection, exit","Ongoing assurance such as service auditor reports and site visits","Concentration risk and exit planning"],"procedures":["Build an independent inventory of third parties from accounts payable and compare it to the register maintained by the business.","For critical providers, test that pre-contract due diligence was performed and documented.","Review contracts for audit rights, service levels, data protection and termination assistance.","Obtain service auditor reports for critical providers and test that complementary user controls were actually implemented.","Test whether exit plans exist and are credible for the most concentrated dependencies."],"red_flags":["Critical providers absent from the register","Contracts auto-renewing without review","Service auditor reports received but never read","Exceptions in those reports with no follow-up","No alternative provider identified for a single point of dependency"],"evidence":["Accounts payable vendor spend","Third-party register and criticality ratings","Contracts","Service auditor reports","Exit plans"],"kpis":["% critical providers with current due diligence","Contracts with audit rights","Assurance reports reviewed"],"lens":["ia"],"plain":"Outsourcing the work never outsources the responsibility. When the supplier fails, it is still your problem."},{"id":"IA-X-12","industry":["cross"],"process":"Human Resources","subprocess":"Recruitment, Onboarding and Exit","risk":"People are hired without verification of their credentials, retain access and entitlements after leaving, and exit obligations are not enforced.","rating":"High","risk_category":"Operational","audit_objective":"Assess whether the employee lifecycle is controlled from pre-hire screening through to exit.","what_to_review":["Pre-employment screening — identity, right to work, qualifications, references, criminal record where permitted","Approval of new positions against approved headcount","Onboarding: contract, code of conduct, mandatory training","Exit: access removal, asset return, final pay, restrictive covenants","Contractor and contingent worker treatment"],"procedures":["Sample new hires and test that every required screening step was completed before the start date, not after.","Verify professional qualifications directly with the issuing body for roles where they are a condition of employment.","Reconcile headcount to approved positions and investigate roles filled without approval.","Sample leavers and test the elapsed time to access removal, asset return and final settlement.","Test whether contractors are subject to equivalent screening for equivalent access."],"red_flags":["Screening completed weeks after the start date","Qualifications accepted on a photocopy","Leavers retaining building or system access","Contractors engaged for years through rolling short contracts","Exit interviews not conducted for regretted leavers"],"evidence":["Employee files and screening records","Headcount approvals","Joiner and leaver reports","Asset registers","Contractor engagement records"],"kpis":["% hires fully screened before start","Days to remove leaver access","Contractor tenure distribution"],"lens":["ia"],"plain":"Hiring someone without checking who they are, and letting leavers keep access, are both simple failures with expensive consequences."},{"id":"IA-X-13","industry":["cross"],"process":"Human Resources","subprocess":"Compensation, Performance and Culture","risk":"Pay decisions, incentives and promotions are made inconsistently, and behavioural issues are not addressed, driving turnover, grievance and conduct risk.","rating":"Medium","risk_category":"Strategic","audit_objective":"Evaluate whether reward and performance processes are applied consistently and whether conduct concerns are dealt with.","what_to_review":["Salary review and promotion decision governance","Incentive plan design and payout calculation","Pay equity across comparable roles","Performance management completion and quality","Grievance, disciplinary and harassment case handling"],"procedures":["Recompute a sample of incentive payouts against plan rules and approved performance outcomes.","Analyse pay across comparable roles for unexplained dispersion, and test the explanations offered.","Test performance review completion rates and read a sample for substance rather than box-ticking.","Review grievance and disciplinary cases for investigation independence, timeliness and consistency of outcome.","Compare voluntary turnover by manager and function against the organisational average."],"red_flags":["Incentives paid despite unmet performance conditions","Turnover concentrated under specific managers","Grievances against senior staff investigated by their own reports","Performance ratings clustered with no differentiation"],"evidence":["Payroll and incentive calculation files","Performance review records","Grievance and disciplinary case files","Turnover and exit interview data"],"kpis":["Voluntary turnover by manager","% reviews completed","Grievance cases and outcomes"],"lens":["ia"],"plain":"How people are paid and promoted drives how they behave, which shapes every other control in the business."},{"id":"IA-TL-11","industry":["logistics"],"process":"Cargo Claims","subprocess":"Claims Handling","risk":"Cargo loss and damage claims are settled without investigating root cause or pursuing recovery from the carrier at fault, so the same losses recur.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess whether claims are validated, recovered where a third party is liable, and used to drive corrective action.","what_to_review":["Claim intake, validation and settlement authority","Evidence required before settlement — proof of delivery, condition reports, ph
