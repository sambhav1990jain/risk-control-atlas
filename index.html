and recovered.","what_to_review":["Duplicate detection controls at invoice entry and at payment","Invoice numbering conventions that defeat detection","Recovery process for identified duplicates","Credit balances on vendor accounts","Statement reconciliation with major vendors"],"procedures":["Run duplicate analytics on exact and fuzzy matches across vendor, amount, invoice number and date; quantify the exposure.","Test whether identified duplicates were recovered and how long recovery took.","Review vendor accounts with debit balances or long-standing credits, which often indicate unrecovered duplicates.","Test whether vendor statement reconciliations are performed for the largest suppliers."],"red_flags":["Duplicate detection limited to exact invoice number matches","Vendor credit balances aged over a year","Recoveries pursued only when the vendor volunteers them","Same invoice entered against two vendor records"],"evidence":["Full payment history extract","Vendor account balances","Vendor statements","Recovery correspondence"],"kpis":["Duplicate exposure identified","Duplicates recovered","Aged vendor credit balances"],"lens":["ia"],"plain":"Paying the same invoice twice is common, rarely noticed, and usually only recovered if someone looks."},{"id":"IA-P2P-08","industry":["cross"],"process":"Procure to Pay","subprocess":"Employee Expenses and Purchase Cards","risk":"Personal expenditure is claimed as business expense, or purchase cards are used outside policy, with approval given without scrutiny.","rating":"Medium","risk_category":"Fraud","audit_objective":"Assess whether expense and card spend is within policy, supported and genuinely reviewed.","what_to_review":["Expense policy limits, receipt requirements and approval routing","Purchase card issuance, limits and merchant category restrictions","Approval quality — whether approvers examine or simply click","Cash withdrawals, round-sum and weekend transactions","Card cancellation on exit and dormant card review"],"procedures":["Analyse claims by claimant for round sums, duplicated receipts, weekend and holiday spend, and amounts just under the receipt threshold.","Test purchase card transactions against merchant category restrictions and policy.","Measure approval time per claim; approvals granted seconds apart indicate no review.","Test that cards were cancelled for leavers and review dormant cards still active.","Test a sample of claims to original receipts rather than a summary."],"red_flags":["Claims consistently just below the receipt threshold","Approvals batched in seconds","Cards active for staff who left","Cash withdrawals on purchase cards"],"evidence":["Expense claim data and receipts","Purchase card transaction files","Card issuance and cancellation records","Approval timestamps"],"kpis":["Claims without receipts","Policy breach rate","Cards active for leavers"],"lens":["ia"],"plain":"Expenses and company cards are small amounts approved quickly, which is exactly why personal spending slips through."},{"id":"IA-P2P-09","industry":["cross"],"process":"Procure to Pay","subprocess":"Contract Compliance and Price Adherence","risk":"The organisation pays more than the contract allows because no one checks invoices against negotiated rates, rebates and service credits.","rating":"High","risk_category":"Financial","audit_objective":"Confirm that the value negotiated in contracts is actually realised in what is paid.","what_to_review":["Contracted rates loaded into the system versus applied at invoicing","Indexation and price increase clauses and their application","Volume rebates and discounts earned and claimed","Service credits for failure and whether they are taken","Contract expiry, renewal and evergreen terms"],"procedures":["Re-price a sample of invoices against the contract and quantify overcharges across the supplier base.","Recompute contractual indexation applied and test that increases were permitted and correctly calculated.","Recompute rebates earned against volumes and test whether they were claimed and received.","Test service level performance against the contract and whether credits due were deducted."],"red_flags":["Price increases applied earlier or larger than the contract permits","Rebates never claimed","Service failures with no credits taken","Contracts auto-renewing at uncompetitive rates"],"evidence":["Contracts and rate schedules","Invoice and payment data","Rebate calculations","Service level reporting"],"kpis":["Overcharge recovered","Rebates claimed vs. earned","Service credits taken"],"lens":["ia"],"plain":"Companies negotiate good rates and then pay something different, because nobody checks the invoice against the contract."},{"id":"IA-P2P-10","industry":["cross"],"process":"Procure to Pay","subprocess":"Procurement Fraud, Kickbacks and Conflicts of Interest","risk":"Buyers receive undisclosed benefit for directing business, inflating prices and distorting supplier selection.","rating":"High","risk_category":"Fraud","audit_objective":"Detect indicators of collusion between buyers and suppliers and assess the controls that would prevent it.","what_to_review":["Conflict of interest declarations from procurement and budget holders","Gifts and hospitality register and its completeness","Supplier concentration by buyer and price trends","Bid patterns suggesting collusion among suppliers","Rotation of buyer responsibilities and mandatory leave"],"procedures":["Analyse spend by buyer and supplier to identify concentrations, then compare prices paid against market or other business units.","Match supplier data against employee data — addresses, phone numbers, bank accounts and company registry directorships.","Review bid patterns for consistent losing bidders, near-identical pricing, or rotating winners.","Reconcile the gifts and hospitality register to expenses claimed by suppliers where visible, and test declaration completeness.","Test whether buyer rotation and leave requirements were applied."],"red_flags":["A buyer whose suppliers price consistently above market","Losing bidders that never win but always bid","Gifts register with almost no entries in a large function","Suppliers registered at a residential address"],"evidence":["Spend analysis by buyer and supplier","Conflict declarations and gifts register","Tender bid records","Company registry data"],"kpis":["Spend concentration by buyer","Declarations completed","Price variance to benchmark"],"lens":["ia"],"plain":"Buyers control who gets the business, which makes them a target for suppliers offering something on the side."},{"id":"IA-P2P-11","industry":["cross"],"process":"Procure to Pay","subprocess":"Accruals, Cut-Off and Accounts Payable Integrity","risk":"Liabilities are omitted at period end, or the payables ledger contains balances that no longer represent real obligations.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm that payables and accruals are complete, valid and correctly cut off.","what_to_review":["Completeness of accruals for goods and services received not invoiced","Cut-off testing around period end","Ageing of the payables ledger and old unpaid balances","Debit balances and unapplied credits in payables","Reconciliation of payables ledger to the general ledger"],"procedures":["Test cut-off by examining invoices received after period end and tracing them to the correct period.","Test the accrual calculation against the goods received not invoiced report and known service commitments.","Age the payables ledger and investigate balances outstanding beyond normal terms — they may be disputed, duplicated or fictitious.","Reconcile the subledger to the general ledger and test reconciling items."],"red_flags":["Accruals estimated as a flat percentage with no underlying data","Old payables balances never queried by the supplier","Reconciling items rolling forward every period","Invoices held in a drawer until the new period"],"evidence":["Accrual calculations and GRNI reports","Post period-end invoice register","Payables ageing","Subledger to ledger reconciliations"],"kpis":["Accrual accuracy on lookback","Payables aged over terms","Unreconciled differences"],"lens":["ia"],"plain":"Leaving out bills that have already been incurred makes profit look better than it is."},{"id":"IA-IT-01","industry":["cross"],"process":"IT & Technology","subprocess":"Change Management","risk":"Changes reach production without testing or approval, causing outages, data corruption or the quiet introduction of unauthorised functionality.","rating":"High","risk_category":"IT","audit_objective":"Confirm that changes to production systems are authorised, tested and traceable.","what_to_review":["Change approval, testing evidence and back-out planning","Emergency change usage and retrospective approval","Segregation between development, testing and production migration","Direct data fixes applied to production databases","Post-implementation review of significant changes"],"procedures":["Reconcile changes deployed to production against approved change records; investigate any deployment with no change ticket.","Quantify emergency changes as a proportion of total and test retrospective approval.","Test whether developers can migrate their own code to production.","Extract direct database changes and test authorisation for each.","Test back-out plans for substance rather than a generic statement."],"red_flags":["Emergency changes used to bypass approval routinely","Deployments with no corresponding ticket","Developers holding production migration rights","Testing evidence created after go-live"],"evidence":["Change management records","Deployment logs","Database change logs","Developer access rights"],"kpis":["Emergency change %","Unauthorised deployments","Change failure rate"],"lens":["ia"],"plain":"Most major system outages are caused by a change someone made, not by an attacker."},{"id":"IA-IT-02","industry":["cross"],"process":"IT & Technology","subprocess":"IT Operations and Job Scheduling","risk":"Batch failures, interface errors and processing exceptions go unnoticed, so financial data is incomplete or wrong without anyone knowing.","rating":"Medium","risk_category":"IT","audit_objective":"Confirm that scheduled processing and system interfaces run completely and that failures are detected and resolved.","what_to_review":["Job scheduling, dependencies and failure alerting","Interface control totals between systems","Incident detection, prioritisation and resolution","Reprocessing and manual intervention controls","Monitoring coverage and who watches it out of hours"],"procedures":["Review job failure logs for the period and test resolution of failures affecting financial data.","Test interface control totals between key systems and quantify unexplained differences.","Sample incidents and trace to root cause and permanent fix rather than a workaround.","Test who can amend the job schedule and whether changes follow change management."],"red_flags":["Recurring job failures accepted as normal","Interfaces reconciled by record count only, not value","Incidents closed as \"restarted, no further action\"","Schedule amendments made directly in production"],"evidence":["Job scheduler logs","Interface reconciliation reports","Incident management records","Monitoring configuration"],"kpis":["Job failure rate","Interface differences","Repeat incidents"],"lens":["ia"],"plain":"Overnight processing runs the business. When a job fails silently, the numbers are simply incomplete."},{"id":"IA-IT-03","industry":["cross"],"process":"IT & Technology","subprocess":"Cyber Security — Vulnerability and Patch Management","risk":"Known vulnerabilities remain unpatched on systems exposed to attack, giving an intruder a documented route in.","rating":"High","risk_category":"IT","audit_objective":"Assess whether vulnerabilities are identified, prioritised and remediated within defined timeframes.","what_to_review":["Asset inventory completeness — you cannot patch what you do not know about","Vulnerability scanning coverage and frequency","Remediation timeframes by severity and adherence to them","Exception and risk acceptance process for unpatched systems","End-of-life and unsupported systems still in use"],"procedures":["Compare the asset inventory to network discovery output and quantify unmanaged devices.","Extract open vulnerabilities by severity and age; quantify those beyond the remediation deadline.","Test the exception process for critical vulnerabilities accepted rather than fixed, and whether acceptance was authorised at the right level.","Identify end-of-life systems still in production and test the compensating controls claimed."],"red_flags":["Critical vulnerabilities open for months","Scanning that excludes the most sensitive network segments","Risk acceptances granted indefinitely","Unsupported operating systems on internet-facing hosts"],"evidence":["Asset inventory and network discovery output","Vulnerability scan results","Remediation and exception records","End-of-life system register"],"kpis":["Critical vulnerabilities past SLA","Scan coverage %","Unsupported systems in production"],"lens":["ia"],"plain":"Attackers use known weaknesses that already have fixes available. Unpatched systems are an open door."},{"id":"IA-IT-04","industry":["cross"],"process":"IT & Technology","subprocess":"Cyber Security — Perimeter, Endpoint and Email","risk":"An attacker gains entry through phishing, weak authentication or an unprotected endpoint, and moves through the network undetected.","rating":"High","risk_category":"IT","audit_objective":"Assess the preventive and detective controls against the most common intrusion routes.","what_to_review":["Multi-factor authentication coverage, especially remote access and administrators","Email filtering, phishing simulation results and reporting culture","Endpoint protection deployment and exception devices","Network segmentation limiting lateral movement","Logging, monitoring and alert triage"],"procedures":["Test multi-factor authentication coverage across all remote access paths and privileged accounts; identify bypass routes.","Review phishing simulation results by department and test whether repeat clickers receive intervention.","Reconcile endpoint protection deployment to the asset inventory and investigate unprotected devices.","Test segmentation by reviewing firewall rules between zones for overly permissive entries.","Sample security alerts and test triage quality and time to respond."],"red_flags":["Service and administrator accounts exempt from multi-factor authentication","Firewall rules permitting any-to-any","Alerts closed without investigation notes","Phishing reporting rates near zero"],"evidence":["Authentication configuration","Phishing simulation results","Endpoint deployment reports","Firewall rule sets","Security alert logs"],"kpis":["MFA coverage %","Phishing click and report rates","Alert triage time"],"lens":["ia"],"plain":"Most breaches start with a person clicking something or a password being reused, not with sophisticated hacking."},{"id":"IA-IT-05","industry":["cross"],"process":"IT & Technology","subprocess":"Backup, Recovery and Disaster Recovery","risk":"Backups exist but cannot actually restore the business, so a ransomware event or hardware failure becomes an existential problem.","rating":"High","risk_category":"IT","audit_objective":"Confirm that backup and recovery capability is real, tested and protected from the same event it insures against.","what_to_review":["Backup scope, frequency and alignment to recovery point objectives","Restoration testing — actual restores, not backup success reports","Immutability and offline copies protected from ransomware","Disaster recovery plan currency and test realism","Recovery time objectives agreed with the business and validated"],"procedures":["Obtain evidence of an actual restore test and its outcome; a successful backup job is not evidence of recoverability.","Test whether backup copies are immutable or offline and whether backup infrastructure uses separate credentials.","Compare recovery objectives agreed with the business to what the most recent test achieved.","Review the disaster recovery test scope — a tabletop exercise is not a failover."],"red_flags":["Backups never restored in test","Backup systems on the same domain with the same admin credentials","Recovery objectives defined by IT with no business input","DR tests scoped to exclude the critical systems"],"evidence":["Backup job reports and restore test evidence","Backup architecture documentation","DR plans and test reports","Business impact analysis"],"kpis":["Restore tests completed","Actual vs. target recovery time","Systems with immutable backups"],"lens":["ia"],"plain":"Having backups is not the same as being able to restore. You find out which you have on the worst day."},{"id":"IA-IT-06","industry":["cross"],"process":"IT & Technology","subprocess":"Third-Party and Cloud Service Management","risk":"Critical systems run on third-party platforms with no assurance over their controls and no ability to exit.","rating":"High","risk_category":"IT","audit_objective":"Assess governance and assurance over outsourced and cloud-hosted technology.","what_to_review":["Inventory of cloud services and shadow IT procured outside the process","Service auditor reports obtained and complementary user controls performed","Contractual terms — data location, breach notification, audit rights, exit","Cloud configuration and who is responsible for what","Vendor access to the organisation's environment"],"procedures":["Build an independent inventory of cloud services from expenditure and network data; compare to the official register.","Obtain service auditor reports for critical providers, identify complementary user controls and test whether they operate.","Review cloud configuration against a recognised benchmark for the most sensitive workloads.","Test vendor remote access — accounts, authentication and session monitoring."],"red_flags":["Cloud services paid for on expense claims","Service auditor reports unread","Storage buckets or databases publicly accessible","Vendor accounts with standing privileged access"],"evidence":["Expenditure and network data","Cloud service register","Service auditor reports","Configuration benchmark results","Vendor access records"],"kpis":["Shadow IT services found","Complementary controls performed","Configuration benchmark failures"],"lens":["ia"],"plain":"Using a cloud provider moves the work, not the accountability. If it goes down, your business goes down."},{"id":"IA-IT-07","industry":["cross"],"process":"IT & Technology","subprocess":"Data Governance, Quality and Privacy","risk":"Personal and business-critical data is held without ownership, retained beyond need, or exposed to people who have no reason to see it.","rating":"High","risk_category":"Compliance","audit_objective":"Assess whether data is classified, owned, protected and retained in line with obligations.","what_to_review":["Data inventory, classification and ownership","Retention schedules and their actual enforcement","Access to sensitive data sets and periodic review","Data quality controls at entry and in transformation","Privacy obligations — consent, subject rights, cross-border transfer"],"procedures":["Test whether data classified as sensitive is actually protected accordingly, including in test environments and extracts.","Test retention by identifying data past its retention period and confirming whether deletion occurred.","Test data subject rights requests for completeness and timeliness of response.","Review data quality controls for key financial data feeds and quantify error rates.","Test whether production data is copied into non-production environments unmasked."],"red_flags":["Production data in test systems unmasked","Retention policy written but never executed","No named owner for critical data sets","Cross-border transfers with no assessed legal basis"],"evidence":["Data inventory and classification","Retention schedules and deletion evidence","Access listings for sensitive data","Subject rights request records"],"kpis":["Data past retention","Subject requests in time","Unmasked non-production copies"],"lens":["ia"],"plain":"Data that nobody owns gets kept too long, shared too widely, and eventually leaked."},{"id":"IA-IT-08","industry":["cross"],"process":"IT & Technology","subprocess":"IT Asset Management and Software Licensing","risk":"Hardware and software are untracked, so assets are lost, licences are under-purchased and the organisation is exposed to audit by the vendor.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm that technology assets and licences are tracked, reconciled and compliant.","what_to_review":["Hardware asset register accuracy and disposal process","Data sanitisation on disposal or return of devices","Software discovery versus licences held","Licence terms — users, cores, virtualisation rights","Vendor audit history and settlements"],"procedures":["Reconcile the asset register to network discovery and to procurement records; investigate differences in both directions.","Test disposal records for evidence of data sanitisation certificates.","Compare installed software counts to licence entitlements and quantify the compliance gap.","Review licence terms for the largest vendors against the deployment model actually used."],"red_flags":["Devices issued to leavers never returned","Disposal with no sanitisation evidence","Software deployed well beyond entitlement","Virtualisation increasing licence exposure unnoticed"],"evidence":["Asset register and discovery data","Disposal and sanitisation records","Software deployment reports","Licence agreements"],"kpis":["Assets unaccounted for","Licence compliance gap","Disposals with sanitisation evidence"],"lens":["ia"],"plain":"Untracked laptops walk out of the door, and unlicensed software invites an expensive audit from the vendor."},{"id":"IA-IT-09","industry":["cross"],"process":"IT & Technology","subprocess":"IT Project and Programme Delivery","risk":"Major technology programmes overrun, deliver less than promised, or go live without controls, and the business case is never revisited.","rating":"Medium","risk_category":"Strategic","audit_objective":"Assess whether technology investment is governed, controlled and delivering the promised benefit.","what_to_review":["Business case approval, benefit definition and post-implementation review","Governance structure, reporting accuracy and escalation","Scope, schedule and cost control including change requests","Controls designed into new systems before go-live","Data migration accuracy and reconciliation"],"procedures":["Compare reported project status to underlying evidence — status reporting is frequently optimistic until it is not.","Test change requests for approval and their cumulative effect on cost and scope against the original approval.","Test whether internal audit or a controls function reviewed the design before go-live.","For completed migrations, test the reconciliation between source and target data.","Compare realised benefits to the business case for completed projects."],"red_flags":["Status reported green until it turns red without an amber stage","Benefits never measured after go-live","Controls deferred to a later phase that never arrives","Migration reconciliations performed on counts, not values"],"evidence":["Business cases and approvals","Project status reports and steering minutes","Change request logs","Migration reconciliations","Post-implementation reviews"],"kpis":["Cost and schedule variance","Projects with post-implementation review","Benefits realised vs. case"],"lens":["ia"],"plain":"Large technology projects fail slowly and quietly, and status reports stay green until the day they do not."},{"id":"IA-IT-10","industry":["cross"],"process":"IT & Technology","subprocess":"End User Computing and Spreadsheets","risk":"Material financial reporting depends on spreadsheets and databases built outside IT, with no version control, no testing and no backup.","rating":"Medium","risk_category":"IT","audit_objective":"Assess whether critical end user computing applications are identified and controlled proportionately.","what_to_review":["Inventory of critical spreadsheets and user-built databases","Access restriction and version control","Formula integrity, input validation and change testing","Reliance placed on them in financial reporting","Backup and key person dependency"],"procedures":["Identify spreadsheets feeding the financial statements or key controls and test whether they appear in any inventory.","Test formula integrity on a sample — check for hard-coded values overwriting formulas and broken ranges.","Test whether access is restricted and whether changes are tracked.","Assess key person dependency — whether anyone else can operate or explain the model."],"red_flags":["Critical models on a personal drive","Hard-coded plugs inside formula columns","No one but the author understands the calculation","Versions distinguished only by filename suffix"],"evidence":["End user computing inventory","The spreadsheets themselves","Access permissions","Financial reporting process documentation"],"kpis":["Critical EUCs inventoried","Formula integrity exceptions","EUCs with restricted access"],"lens":["ia"],"plain":"A surprising amount of financial reporting depends on a spreadsheet on one person's drive with no version control."},{"id":"IA-IT-11","industry":["cross"],"process":"IT & Technology","subprocess":"IT Governance, Strategy and Resilience","risk":"Technology decisions are made without alignment to business need or risk appetite, leaving critical dependencies and obsolescence unmanaged.","rating":"Medium","risk_category":"Strategic","audit_objective":"Assess whether technology is governed, funded and resourced against the organisation's actual dependency on it.","what_to_review":["IT strategy and its alignment to business plans","Technology risk reporting to the board and its quality","Technical debt and obsolescence in critical systems","Resourcing, key person dependency and succession","Business continuity for technology-dependent processes"],"procedures":["Compare the technology risk reported to the board against what the audit found operationally.","Identify critical systems past supported life and test the remediation plan and its funding.","Assess key person dependencies for critical platforms and whether documentation would allow another person to operate them.","Test whether business continuity plans for technology-dependent processes have been exercised."],"red_flags":["Board reporting consistently green while incidents continue","Remediation plans without budget attached","One person holding all knowledge of a critical platform","Continuity plans that assume systems will be available"],"evidence":["IT strategy and board papers","Application portfolio with support status","Resourcing and succession plans","Continuity plans and test records"],"kpis":["Critical systems out of support","Risks reported vs. found","Continuity plans exercised"],"lens":["ia"],"plain":"Old systems that nobody wants to touch keep running until the day they cannot be fixed any more."},{"id":"IA-FC-01","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Balance Sheet Reconciliations","risk":"Reconciliations are prepared as a formality, so differences accumulate in accounts nobody scrutinises and errors or misappropriation persist for years.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether reconciliations are complete, timely and of a quality that would actually detect an error.","what_to_review":["Completeness of the reconciliation inventory against the trial balance","Preparer and reviewer independence and sign-off timing","Ageing and nature of reconciling items","Treatment of unexplained differences and plug entries","High-risk accounts — suspense, clearing, intercompany, cash"],"procedures":["Reconcile the list of accounts reconciled to the full trial balance and identify accounts never reconciled.","Sample reconciliations and reassess whether reconciling items are genuinely explained or merely labelled.","Age reconciling items and test the oldest; items older than a quarter usually indicate an unresolved error.","Test sign-off timing — reviews dated the same minute as preparation are not reviews.","Test suspense and clearing accounts for balances that should have cleared."],"red_flags":["Reconciling items described as \"timing\" for months","Reviewer and preparer the same person","Accounts with a balance but no owner","Plug entries used to force agreement"],"evidence":["Trial balance and reconciliation inventory","Completed reconciliations with sign-offs","Ageing of reconciling items","Suspense account activity"],"kpis":["Accounts reconciled on time","Reconciling items over 90 days","Unexplained differences value"],"lens":["ia"],"plain":"A reconciliation is how you prove a balance is real. Done badly, errors and theft sit undisturbed for years."},{"id":"IA-FC-02","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Close Timetable and Governance","risk":"The close is compressed to hit a reporting deadline, so controls are skipped and errors are found after the numbers are published.","rating":"Medium","risk_category":"Operational","audit_objective":"Assess whether the close timetable allows controls to operate and whether it is actually followed.","what_to_review":["Close calendar, task ownership and dependencies","Whether control activities have time allocated or are assumed","Late adjustments after the reported close","Sub-ledger cut-off and closing sequence","Post-close error identification and restatement history"],"procedures":["Compare the close calendar to actual completion timestamps and identify tasks completed after the close was declared.","Extract entries posted after the reported close date and test their nature and approval.","Review the history of post-close adjustments and any restatements for a pattern.","Test whether sub-ledgers were closed before the general ledger in each period."],"red_flags":["Journals posted days after results were reported","Controls scheduled to run after the numbers are released","Recurring late adjustments from the same location","Deadline met by deferring reconciliations"],"evidence":["Close calendar and task completion data","Journal posting timestamps","Post-close adjustment records","Restatement history"],"kpis":["Tasks completed on time","Post-close entries","Days to close"],"lens":["ia"],"plain":"When the close is rushed to hit a deadline, the checks are the first thing dropped."},{"id":"IA-FC-03","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Accounting Estimates and Judgements","risk":"Estimates are set to deliver a desired result rather than a faithful one, and the assumptions behind them are never challenged.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether significant estimates are supportable, consistently applied and independently challenged.","what_to_review":["Inventory of significant estimates and who owns each","Assumption setting, documentation and approval","Consistency of methodology between periods","Back-testing of prior estimates against outcomes","Governance — who challenges the estimate before it is booked"],"procedures":["Back-test material estimates against subsequent actual outcomes and quantify the directional bias.","Test whether methodology or assumption changes coincided with pressure on results.","Trace significant estimates to documented approval by someone other than the preparer.","Compare the range of reasonable outcomes to the point estimate booked and assess where in the range management sits."],"red_flags":["Estimates consistently proving favourable on back-testing","Assumptions changed in the period they most helped","Point estimates always at the favourable end of the range","No documented challenge in committee minutes"],"evidence":["Estimate schedules and supporting models","Assumption documentation and approvals","Prior period estimates and actual outcomes","Audit committee papers"],"kpis":["Estimate accuracy on back-test","Assumption changes per year","Estimates with documented challenge"],"lens":["ia"],"plain":"Estimates are the numbers management gets to choose. That is exactly why they need challenging."},{"id":"IA-FC-04","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Consolidation and Intercompany","risk":"Intercompany balances do not eliminate and consolidation adjustments are made outside the system, so group results contain errors nobody can trace.","rating":"High","risk_category":"Financial","audit_objective":"Confirm that consolidation is complete, accurate and traceable from subsidiary ledgers to group accounts.","what_to_review":["Completeness of entities consolidated and the group structure used","Intercompany matching, disputes and elimination differences","Top-side and consolidation journals outside the subsidiary ledgers","Minority interests, equity accounting and group structure changes","Audit trail from group numbers back to source ledgers"],"procedures":["Reconcile the entities consolidated to the legal entity register and identify omissions or dormant inclusions.","Age unmatched intercompany balances and test how differences were resolved — write-off to income is a red flag.","Extract consolidation-level journals and test support and approval for each material entry.","Trace a sample of group balances back through consolidation to subsidiary ledgers."],"red_flags":["Intercompany differences written off to income","Top-side entries posted only at group with no subsidiary record","Entities appearing or disappearing without documented rationale","Consolidation performed in a spreadsheet outside the system"],"evidence":["Group structure and legal entity register","Intercompany matching reports","Consolidation journal listing","Subsidiary trial balances"],"kpis":["Unmatched intercompany value","Consolidation journals","Entities reconciled to register"],"lens":["ia"],"plain":"Group accounts are built by combining many companies. If balances between them do not cancel out, the group figures are wrong."},{"id":"IA-FC-05","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Foreign Currency Translation","risk":"Exchange rates are applied inconsistently or manually overridden, misstating results and equity in ways that are hard to detect.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm exchange rates used are authorised, correctly sourced and consistently applied.","what_to_review":["Rate source, upload process and authorisation","Application of spot, average and closing rates by balance type","Manual rate overrides at transaction level","Translation of net investments and the currency translation reserve","Hedge accounting interaction where applicable"],"procedures":["Agree rates loaded into the system to the independent source for a sample of periods.","Test manual rate overrides by user and value.","Recompute translation for a sample of foreign subsidiaries including the movement in the translation reserve.","Test that the correct rate type is applied to each balance category."],"red_flags":["Rates uploaded by the person who benefits from the result","Overrides applied to individual large transactions","Translation reserve movements not explained","Average rates used where closing rates are required"],"evidence":["Rate tables and upload logs","Independent rate source data","Translation calculations","Currency translation reserve movement"],"kpis":["Rate override count","Translation recomputation variance","Rates agreed to source"],"lens":["ia"],"plain":"Using the wrong exchange rate quietly changes profit, and it is very hard to spot from the outside."},{"id":"IA-FC-06","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Financial Reporting and Disclosure","risk":"The financial statements omit or misstate disclosures, or the narrative reporting is inconsistent with the numbers behind it.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm the financial statements are complete, internally consistent and supported.","what_to_review":["Disclosure checklist completion and who reviews it","Support for each disclosure traced to underlying records","Consistency between narrative reporting and the financial statements","Going concern assessment and its support","Review and approval by audit committee and board"],"procedures":["Test a sample of disclosures back to underlying support rather than to the prior year statements.","Test the consistency of figures quoted in the narrative report against the financial statements.","Review the going concern assessment, including the forecast and sensitivities used.","Test that the disclosure checklist was completed for the current framework, not a superseded one."],"red_flags":["Disclosures rolled forward from last year with figures updated only","Narrative metrics that cannot be reconciled to the accounts","Going concern paper prepared after the accounts were drafted","Checklist signed but sections left blank"],"evidence":["Draft and final financial statements","Disclosure checklists","Supporting schedules","Going concern assessment","Audit committee minutes"],"kpis":["Disclosures traced to support","Narrative inconsistencies found","Late disclosure changes"],"lens":["ia"],"plain":"The notes in the accounts are part of the accounts. Getting them wrong is a reporting failure, not a formatting one."},{"id":"IA-FC-07","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Chart of Accounts and Ledger Master Data","risk":"The chart of accounts is amended without control, so transactions are misclassified and reporting hierarchies silently change.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm ledger master data changes are authorised and do not distort reporting.","what_to_review":["Authorisation of account creation, blocking and hierarchy changes","Mapping of accounts to reporting lines and its integrity","Dormant and duplicate accounts","Posting restrictions on control and system accounts","Cost centre and profit centre master data"],"procedures":["Extract chart of accounts changes for the period and test authorisation, particularly hierarchy remapping.","Test whether reporting hierarchy changes were reflected in comparatives and explained.","Identify accounts allowing direct posting that should be system-controlled, such as control accounts.","Review dormant accounts with sudden activity."],"red_flags":["Hierarchy changes made mid-year without restating comparatives","Direct posting permitted to reconciliation control accounts","Duplicate accounts for the same purpose","Accounts created by the person who then posts to them"],"evidence":["Chart of accounts change log","Reporting hierarchy definitions","Posting restriction configuration","Account activity reports"],"kpis":["Unauthorised master changes","Accounts permitting direct posting","Dormant accounts reactivated"],"lens":["ia"],"plain":"If accounts in the ledger can be changed freely, the reports built on them stop meaning what people think."},{"id":"IA-FC-08","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Related Party Transactions","risk":"Transactions with related parties are not identified, so they escape disclosure and are conducted on terms that would not survive scrutiny.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm related parties are identified completely and their transactions are approved, priced and disclosed.","what_to_review":["Completeness of the related party register and how it is maintained","Declarations from directors and key management","Identification of transactions with related parties in the ledger","Approval and pricing of related party transactions","Disclosure in the financial statements"],"procedures":["Build an independent list of related parties from directorships, shareholdings and declarations, and compare to the register.","Match the related party list against customer and vendor masters and extract transactions.","Test identified transactions for approval by those without an interest, and for arm's length pricing.","Reconcile disclosed related party transactions to the ledger extract."],"red_flags":["Register maintained only from voluntary declarations","Related party found in the vendor master but not the register","Transactions approved by the interested party","Disclosure limited to remuneration"],"evidence":["Related party register and declarations","Company registry and shareholding data","Customer and vendor masters","Financial statement disclosures"],"kpis":["Related parties identified independently","Transactions with interested approval","Disclosure completeness"],"lens":["ia"],"plain":"Deals with people connected to the business must be disclosed. Hiding them is where governance scandals usually start."},{"id":"IA-FC-09","industry":["cross"],"process":"Financial Close & Reporting","subprocess":"Management Reporting Integrity","risk":"The board and management make decisions on reports whose figures cannot be reconciled to the ledger or whose definitions shift over time.","rating":"Medium","risk_category":"Strategic","audit_objective":"Confirm that management and board reporting is accurate, consistent and reconcilable.","what_to_review":["Reconciliation of management reporting to statutory ledgers","Definition and stability of key performance measures","Non-financial and alternative performance measures and their basis","Manual manipulation of reports outside the system","Timeliness and completeness of reporting to the board"],"procedures":["Reconcile key figures in the board pack to the general ledger and quantify differences.","Test whether definitions of key measures changed and whether comparatives were restated.","Trace alternative performance measures to their calculation and assess whether adjustments are consistently applied.","Identify where board reporting is assembled manually in spreadsheets and test controls over those models."],"red_flags":["Board figures that cannot be reconciled to the ledger","Adjusted measures excluding costs that recur every year","Definitions changed without restating prior periods","Board pack built by one person with no review"],"evidence":["Board and management reporting packs","General ledger data","Measure definitions and calculations","Reporting spreadsheets"],"kpis":["Board figures reconciled","Definition changes","Manual reporting dependencies"],"lens":["ia"],"plain":"The board makes decisions from these reports. If the numbers cannot be traced back to the ledger, the decisions rest on nothing."},{"id":"IA-TR-01","industry":["cross"],"process":"Treasury","subprocess":"Cash Forecasting and Liquidity","risk":"Liquidity is managed on forecasts that are consistently wrong, so the organisation borrows expensively or is caught short.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether cash forecasting is accurate enough to support liquidity decisions.","what_to_review":["Forecast methodology, horizon and granularity","Accuracy of prior forecasts against actual outcomes","Inclusion of committed capital, tax and debt service outflows","Headroom against facilities and covenant limits","Escalation when forecast headroom falls below threshold"],"procedures":["Compare prior forecasts to actual cash outcomes and quantify the error by horizon.","Test whether known commitments were included in forecasts or omitted.","Test facility headroom at several dates and whether escalation occurred where policy required.","Assess whether business units feed the forecast on a consistent basis."],"red_flags":["Forecast error consistently in one direction","Committed outflows appearing only when they hit","Headroom breaches noticed after the fact","Forecast prepared by one person with no challenge"],"evidence":["Cash forecasts and actual outcomes","Facility agreements and headroom reports","Capital commitment schedules","Escalation records"],"kpis":["Forecast accuracy by horizon","Minimum headroom","Escalations raised"],"lens":["ia"],"plain":"Running out of cash kills otherwise profitable businesses. The forecast is what stops that happening."},{"id":"IA-TR-02","industry":["cross"],"process":"Treasury","subprocess":"Debt, Facilities and Covenant Compliance","risk":"A covenant is breached, or a facility lapses, because compliance is monitored manually and only at reporting dates.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm borrowing arrangements are tracked and covenant compliance is monitored continuously.","what_to_review":["Inventory of facilities, maturities and renewal timelines","Covenant definitions and how they are calculated","Frequency of covenant monitoring versus testing dates","Headroom trend and forecast covenant compliance","Reporting obligations to lenders and their timeliness"],"procedures":["Recompute covenants from the lender definitions rather than from management's summary; definitions often differ from statutory measures.","Test covenant headroom at each test date and on a forecast basis.","Test that lender reporting obligations were met within the required timeframe.","Review maturity profile and refinancing plans for concentration risk."],"red_flags":["Covenants calculated using management-adjusted figures","Headroom thin and narrowing without escalation","Lender reporting submitted late","Facilities maturing within twelve months with no refinancing plan"],"evidence":["Facility and loan agreements","Covenant calculations","Lender reporting submissions","Maturity profile"],"kpis":["Covenant headroom","Lender reports on time","Debt maturing within 12 months"],"lens":["ia"],"plain":"Loan agreements contain promises. Break one and the lender can demand its money back immediately."},{"id":"IA-TR-03","industry":["cross"],"process":"Treasury","subprocess":"Foreign Exchange and Interest Rate Risk","risk":"Exposures are hedged on incomplete data or not at all, so earnings swing on market movements the organisation never chose to take.","rating":"High","risk_category":"Financial","audit_objective":"Assess whether market risk exposures are identified, measured and managed within policy.","what_to_review":["Completeness of exposure identification from the business","Hedging policy, ratios and permitted instruments","Effectiveness of hedges and any hedge accounting applied","Speculative positions and policy breaches","Counterparty exposure and credit limits"],"procedures":["Reconcile hedged exposures to underlying business exposures and quantify unhedged or over-hedged positions.","Test compliance with the hedging policy ratio at several dates.","Test that instruments used are on the permitted list and that no speculative positions exist.","Test hedge effectiveness documentation where hedge accounting is applied."],"red_flags":["Over-hedging, which is speculation by another name","Exposures identified only from the ledger, missing forecast transactions","Instruments used outside the approved list","Effectiveness testing prepared retrospectively"],"evidence":["Exposure reports and forecasts","Hedging policy","Deal confirmations and positions","Hedge documentation"],"kpis":["Hedge ratio vs. policy","Unhedged exposure","Policy breaches"],"lens":["ia"],"plain":"Currency and interest rate moves can swing profit even when the business is performing exactly as planned."},{"id":"IA-TR-04","industry":["cross"],"process":"Treasury","subprocess":"Investments and Surplus Funds","risk":"Surplus cash is placed with counterparties or in instruments outside policy, risking capital for marginal yield.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm investments comply with policy on instrument, counterparty and tenor.","what_to_review":["Approved instrument and counterparty lists with credit limits","Concentration by counterparty and rating","Tenor and liquidity of investments against cash needs","Valuation and income recognition","Authorisation of placements and rollovers"],"procedures":["Test each investment held against the approved instrument and counterparty list and applicable limits.","Analyse concentration by counterparty and rating band against policy.","Test authorisation for placements and rollovers, including who can instruct the bank.","Agree valuations and accrued income to independent confirmations."],"red_flags":["Yield chasing into unapproved instruments","Concentration with one counterparty above limit","Rollovers executed without fresh authorisation","Valuations sourced from the counterparty alone"],"evidence":["Investment register and policy","Counterparty credit ratings","Deal confirmations","Bank and custodian statements"],"kpis":["Investments outside policy","Counterparty concentration","Average tenor vs. need"],"lens":["ia"],"plain":"Chasing slightly better returns with spare cash is how companies lose money they were not trying to risk."},{"id":"IA-TR-05","industry":["cross"],"process":"Treasury","subprocess":"Intercompany Funding and Cash Pooling","risk":"Funds move between group entities without documentation, creating tax exposure, regulatory breach and balances nobody can reconcile.","rating":"Medium","risk_category":"Compliance","audit_objective":"Confirm intragroup funding is documented, priced and permitted in each jurisdiction.","what_to_review":["Loan agreements and documentation for intragroup funding","Interest pricing and transfer pricing compliance","Cash pooling arrangements and participant agreements","Regulatory restrictions on cross-border movement and repatriation","Reconciliation of intercompany balances"],"procedures":["Test that intragroup funding has executed agreements and that interest is charged and paid per those terms.","Test transfer pricing documentation supporting intragroup interest rates.","Reconcile pooling balances between participants and the header account.","Test compliance with local restrictions on capital movement for a sample of jurisdictions."],"red_flags":["Funding advanced with no agreement","Interest accrued but never settled","Pool balances unreconciled between entities","Repatriation executed without checking local rules"],"evidence":["Intercompany loan agreements","Transfer pricing documentation","Cash pool statements","Local regulatory advice"],"kpis":["Funding with agreements","Intercompany reconciling differences","Interest settled vs. accrued"],"lens":["ia"],"plain":"Money moved between group companies without proper agreements creates tax and legal problems later."},{"id":"IA-TR-06","industry":["cross"],"process":"Treasury","subprocess":"Guarantees, Letters of Credit and Off-Balance Sheet Commitments","risk":"Guarantees and contingent commitments are given and forgotten, so the organisation carries obligations that appear nowhere in its reporting.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm contingent obligations are authorised, recorded, monitored and disclosed.","what_to_review":["Register of guarantees, letters of credit, bonds and indemnities","Authorisation and who may commit the organisation","Expiry monitoring and release of expired instruments","Fees paid on unused or expired facilities","Disclosure of contingent liabilities"],"procedures":["Obtain confirmations from banks of all instruments outstanding and reconcile to the internal register.","Test authorisation for instruments issued in the period.","Identify expired instruments still incurring fees and test whether release was pursued.","Reconcile the register to contingent liability disclosure."],"red_flags":["Bank confirmations revealing instruments not on the register","Guarantees issued by subsidiaries without group approval","Fees paid on instruments no longer needed","Contingent liabilities disclosed only in round terms"],"evidence":["Guarantee and instrument register","Bank confirmations","Board and delegated authorities","Contingent liability disclosures"],"kpis":["Instruments not on register","Expired instruments still live","Fees on unused facilities"],"lens":["ia"],"plain":"Guarantees are promises to pay if someone else does not. They are easy to give and easy to forget."},{"id":"IA-TR-07","industry":["cross"],"process":"Treasury","subprocess":"Treasury System Access and Dealing Controls","risk":"A single treasury user can create, confirm and settle a deal, allowing funds to be moved with no independent check.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm dealing, confirmation and settlement are segregated and that treasury system access reflects that.","what_to_review":["Segregation between front, middle and back office","System roles and conflicting access combinations","Independent confirmation of deals with counterparties","Standing settlement instructions and their amendment","Dealer mandates, limits and recorded lines"],"procedures":["Map treasury system roles against a segregation matrix and test for users able to deal and settle.","Test independent confirmation of a sample of deals directly with counterparties.","Test amendments to standing settlement instructions for independent verification.","Test dealer authority against mandates for a sample of transactions."],"red_flags":["Dealers able to amend settlement instructions","Confirmations returned to the dealer rather than the back office","Standing instructions changed without verification","Deals executed outside recorded lines"],"evidence":["Treasury system user and role listings","Deal confirmations","Standing settlement instruction change logs","Dealer mandates"],"kpis":["Dealing/settlement conflicts","Deals independently confirmed","SSI changes verified"],"lens":["ia"],"plain":"If the same person can do a deal and settle it, money can move with no independent check at all."},{"id":"IA-TR-08","industry":["cross"],"process":"Treasury","subprocess":"Bank Account Governance and Fee Analysis","risk":"Bank accounts exist outside treasury's knowledge and banking fees are paid without review, wasting money and creating fraud exposure.","rating":"Medium","risk_category":"Operational","audit_objective":"Confirm the organisation knows every bank account it holds and pays only the fees it agreed.","what_to_review":["Completeness of the bank account inventory","Account opening and closing authority","Dormant accounts and their closure","Bank fee schedules versus fees charged","Bank service quality and rationalisation opportunities"],"procedures":["Obtain confirmations directly from all banking relationships and reconcile to the internal account inventory.","Test account opening and closing authorisation for the period.","Identify dormant accounts and test why they remain open.","Recompute a sample of bank charges against the agreed fee schedule."],"red_flags":["Accounts confirmed by banks that treasury did not know about","Accounts opened by local management","Dormant accounts retained \"just in case\"","Fees charged above the agreed tariff"],"evidence":["Bank confirmations","Internal account inventory","Account opening authorisations","Fee schedules and bank statements"],"kpis":["Accounts not in inventory","Dormant accounts open","Fee overcharges recovered"],"lens":["ia"],"plain":"Companies routinely have bank accounts nobody at head office knows about."},{"id":"IA-INV-01","industry":["cross"],"process":"Inventory & Costing","subprocess":"Receiving and Put-Away","risk":"Stock received is not what was ordered or is never recorded, so the ledger and the warehouse diverge from the first transaction.","rating":"High","risk_category":"Operational","audit_objective":"Confirm goods received are verified against the order and recorded promptly and accurately.","what_to_review":["Verification of quantity, quality and specification at receipt","Timeliness of receipt posting against physical arrival","Put-away accuracy and location recording","Rejected and quarantined stock handling","Receipts without a purchase order"],"procedures":["Observe receiving and test whether counts and inspections are genuinely performed or documents simply signed.","Compare receipt posting timestamps to carrier delivery times and quantify delays.","Test put-away accuracy by selecting system locations and verifying physical presence.","Test the disposition of rejected stock — returned, scrapped or quietly absorbed."],"red_flags":["Deliveries signed without counting","Receipts posted in batches days later","Stock in locations the system does not show","Rejected goods with no return evidence"],"evidence":["Goods receipt records and timestamps","Purchase orders and delivery notes","Put-away and location data","Quarantine and rejection logs"],"kpis":["Receipt posting lag","Put-away accuracy","Rejected stock disposition"],"lens":["ia"],"plain":"If what arrives is not properly checked and recorded, every stock figure after that point is already wrong."},{"id":"IA-INV-02","industry":["cross"],"process":"Inventory & Costing","subprocess":"Warehouse Operations and Custody","risk":"Stock is stolen or damaged in storage, and weak custody controls mean the loss only appears at the next count.","rating":"High","risk_category":"Fraud","audit_objective":"Assess physical custody controls over inventory and the segregation between custody and record-keeping.","what_to_review":["Physical security — access control, CCTV, high-value cages","Segregation between warehouse custody and inventory record maintenance","Movement authorisation between locations","Handling of samples, promotional and staff purchases","Damage and write-off authorisation"],"procedures":["Walk the warehouse and test physical access controls and segregation of high-value stock.","Test whether warehouse staff can amend inventory records to conceal a shortfall.","Test stock transfers between locations for authorisation and receipt confirmation at the destination.","Analyse write-offs by location, reason and approver for concentration."],"red_flags":["Warehouse staff with inventory adjustment rights","Transfers despatched but never received","Write-offs concentrated before a count","Access lists including former employees"],"evidence":["Access control and CCTV records","System access rights for inventory adjustment","Transfer documentation","Write-off approvals"],"kpis":["Write-off value by location","Transfers unreceived","Adjustment rights conflicts"],"lens":["ia"],"plain":"Stock sitting in a warehouse is portable and saleable, which is why custody controls matter more than they look."},{"id":"IA-INV-03","industry":["cross"],"process":"Inventory & Costing","subprocess":"Cycle Counting and Physical Verification","risk":"Counts are performed by the people responsible for the stock, so discrepancies are corrected rather than reported.","rating":"High","risk_category":"Fraud","audit_objective":"Confirm counting is independent, covers the population and results in investigated, approved adjustments.","what_to_review":["Count programme coverage, frequency and risk weighting","Independence of counters from custody","Recount and tolerance rules","Investigation of variances before adjustment","Approval authority for inventory adjustments"],"procedures":["Attend a count unannounced and perform test counts in both directions.","Test coverage — identify items and locations never counted in the period.","Test whether variances above tolerance were investigated before the adjustment was posted, or simply posted.","Analyse adjustments by item, location and approver for offsetting positives and negatives."],"red_flags":["Counts performed by the storekeeper alone","Positive and negative adjustments offsetting to near zero","Items never selected for count","Adjustments posted before investigation"],"evidence":["Count schedules and results","Count sheets and recount records","Adjustment postings and approvals","Coverage analysis"],"kpis":["Count coverage %","Gross vs. net adjustment","Variances investigated"],"lens":["ia"],"plain":"Counting stock is how you find out what is really there. Letting the same people count their own stock defeats the point."},{"id":"IA-INV-04","industry":["cross"],"process":"Inventory & Costing","subprocess":"Costing and Standard Cost Maintenance","risk":"Inventory is valued using costs that no longer reflect reality, so margin and stock value are both wrong.","rating":"High","risk_category":"Financial","audit_objective":"Confirm inventory cost reflects actual purchase and conversion cost on a supportable basis.","what_to_review":["Costing method and its consistent application","Standard cost roll frequency and approval","Overhead absorption basis and capacity assumptions","Purchase price variance analysis and disposition","Cost of items with volatile input prices"],"procedures":["Recompute unit cost for a sample of items from purchase invoices and conversion cost data.","Test the overhead absorption rate against actual overhead and activity, including treatment of idle capacity.","Analyse purchase price variances by item and test whether they are investigated or simply absorbed.","Test the timing of the last standard cost roll against input price movements."],"red_flags":["Standards unchanged through a period of significant price inflation","Idle capacity absorbed into inventory value","Variances written off without analysis","Overhead absorbed on an outdated activity base"],"evidence":["Cost build-up files","Purchase invoices and conversion cost data","Variance reports","Standard cost roll approvals"],"kpis":["Cost recomputation variance","PPV as % of purchases","Months since cost roll"],"lens":["ia"],"plain":"The cost attached to each item decides both the stock value and the reported margin on every sale."},{"id":"IA-INV-05","industry":["cross"],"process":"Inventory & Costing","subprocess":"Obsolescence, Slow-Moving and Net Realisable Value","risk":"Stock that will never sell at cost remains valued at cost, overstating assets and deferring a loss already incurred.","rating":"High","risk_category":"Financial","audit_objective":"Confirm inventory is carried at the lower of cost and net realisable value.","what_to_review":["Ageing and slow-moving reporting accuracy","Provisioning policy and its consistent application","Evidence of realisable value — recent sales, forecasts, market prices","Management overrides of the formula-driven provision","Treatment of discontinued lines and engineering changes"],"procedures":["Test the ageing report logic — ageing based on receipt date can understate slow-moving items if stock is rotated in the system.","Compare carrying value to recent selling prices net of costs to sell for a sample of lines.","Test management overrides to the provision for support and approval.","Identify stock with no movement in twelve months and test the justification for holding it at cost."],"red_flags":["Provision released to support results","Ageing reset by internal transfers","Discontinued lines still held at full cost","Realisable value supported by optimistic forecasts"],"evidence":["Inventory ageing and movement reports","Provision calculations and overrides","Recent sales price data","Discontinuation notices"],"kpis":["Provision coverage of aged stock","Stock with no movement 12m","Override value"],"lens":["ia"],"plain":"Stock that will never sell at full price is worth less than the books say, and saying so is uncomfortable."},{"id":"IA-INV-06","industry":["cross"],"process":"Inventory & Costing","subprocess":"Consignment, Third-Party and In-Transit Stock","risk":"Stock held by others or in transit is recorded on the wrong balance sheet, or lost entirely because nobody is counting it.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm that inventory ownership and location are correctly reflected wherever the stock physically sits.","what_to_review":["Identification of stock held at third parties and by agents","Consignment agreements and ownership terms","Confirmation and counting of externally held stock","Goods in transit and the shipping terms that determine ownership","Customer-owned stock held on the premises"],"procedures":["Obtain confirmations from third parties holding stock and reconcile to the ledger.","Test consignment agreements to determine when ownership and risk transfer, and confirm accounting follows.","Test goods in transit at period end against shipping terms.","Identify customer-owned material on site and confirm it is excluded from inventory."],"red_flags":["Third-party stock never counted or confirmed","Consignment treated as sold on despatch","In-transit stock recorded by both parties or neither","Customer material indistinguishable from own stock"],"evidence":["Third-party stock confirmations","Consignment agreements","Shipping documentation","Inventory listings by location"],"kpis":["Externally held stock confirmed","In-transit cut-off errors","Locations reconciled"],"lens":["ia"],"plain":"Stock held elsewhere, or in transit, is easy to count twice or not at all."},{"id":"IA-INV-07","industry":["cross"],"process":"Inventory & Costing","subprocess":"Scrap, Returns and Reverse Logistics","risk":"Scrap and returned goods are removed from the system without control, providing a route for stock to leave the business.","rating":"Medium","risk_category":"Fraud","audit_objective":"Confirm scrap and returns are authorised, evidenced and any residual value captured.","what_to_review":["Scrap authorisation, witnessing and disposal evidence","Proceeds from scrap sales and where they are recorded","Customer returns receipt, inspection and disposition","Restocking accuracy and valuation of returned goods","Warranty and repair stock movements"],"procedures":["Test scrap transactions for authorisation and independent witnessing of destruction or disposal.","Trace scrap sale proceeds to bank receipts and the ledger.","Test returned goods from receipt through inspection to restock, repair or scrap, and check valuation at each step.","Analyse return volumes by customer and product for patterns."],"red_flags":["Scrap disposed of without witness","Scrap sale proceeds received in cash","Returns restocked at full value without inspection","Return rates far above normal for one customer"],"evidence":["Scrap authorisation and disposal records","Scrap sale invoices and bank receipts","Returns processing records","Restock valuations"],"kpis":["Scrap value and proceeds","Returns restocked without inspection","Return rate by customer"],"lens":["ia"],"plain":"Scrap and returns are a legitimate-looking route for stock to leave the building."},{"id":"IA-HR-01","industry":["cross"],"process":"Human Resources","subprocess":"Workforce Planning and Headcount Control","risk":"Headcount grows outside approved plan and roles are filled without establishment approval, inflating cost.","rating":"Medium","risk_category":"Financial","audit_objective":"Confirm headcount is controlled against approved establishment and budget.","what_to_review":["Establishment approval and vacancy authorisation","Reconciliation of actual headcount to approved positions","Use of contractors to circumvent headcount limits","Backfill versus new role approval","Organisational change and restructuring authorisation"],"procedures":["Reconcile paid headcount to approved establishment by function and investigate excesses.","Test whether contractor engagement increased where headcount was frozen.","Test a sample of hires to vacancy approval and budget availability.","Test restructuring costs against approvals."],"red_flags":["Contractor numbers rising as headcount is capped","Roles filled before approval","Establishment last approved years ago","Restructuring costs exceeding approval"],"evidence":["Establishment and budget approvals","Headcount reports","Contractor engagement data","Vacancy approvals"],"kpis":["Headcount vs. establishment","Contractor ratio","Hires with prior approval"],"lens":["ia"],"plain":"Headcount is one of the largest costs a business has, and it grows quietly when nobody enforces the approved plan."},{"id":"IA-HR-02","industry":["cross"],"process":"Human Resources","subprocess":"Recruitment and Selection","risk":"Hiring decisions are made without competitive or objective process, admitting unsuitable people and creating discrimination exposure.","rating":"Medium","risk_category":"Compliance","audit_objective":"Confirm recruitment is fair, documented and free from undisclosed conflicts.","what_to_review":["Advertising, shortlisting and interview documentation","Panel composition and independence","Conflict of interest and relative disclosure by hiring managers","Use of agencies, their terms and fees","Consistency of offers against approved salary bands"],"procedures":["Test a sample of hires for documented selection rationale and panel involvement.","Match new hires against employee records for family or prior relationships with the hiring manager.","Recompute agency fees against agreed terms and test rebate claims where hires leave early.","Test offers against approved salary bands and approval of exceptions."],"red_flags":["Roles filled without advertisement","Hiring manager as sole interviewer","Relatives of employees appointed with no disclosure","Agency fees above agreed rates"],"evidence":["Recruitment files","Interview and panel records","Agency agreements and invoices","Salary band approvals"],"kpis":["Hires with documented process","Agency fee variances","Offers outside band"],"lens":["ia"],"plain":"Hiring without a fair, documented process invites both bad hires and discrimination claims."},{"id":"IA-HR-03","industry":["cross"],"process":"Human Resources","subprocess":"Learning, Competence and Mandatory Training","risk":"Staff perform regulated or safety-critical roles without the required competence, exposing the organisation to harm and enforcement.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm role-required competence and mandatory training are achieved and current.","what_to_review":["Identification of roles with mandatory training or certification requirements","Completion tracking and enforcement","Currency of certifications and expiry monitoring","Effectiveness assessment beyond attendance","Training records for contractors performing regulated work"],"procedures":["Reconcile staff in regulated or safety-critical roles to completed and current certification.","Test enforcement — what happens when training lapses; if nothing, the control does not exist.","Test whether contractors in equivalent roles meet the same requirements.","Assess whether competence is tested or attendance merely recorded."],"red_flags":["Certifications expired but staff still rostered","Completion tracked with no consequence for non-completion","Training measured by attendance only","Contractors exempt from requirements"],"evidence":["Training records and matrices","Role requirement definitions","Certification expiry reports","Contractor records"],"kpis":["Mandatory training current","Expired certifications in role","Contractor compliance"],"lens":["ia"],"plain":"In regulated or safety-critical roles, an expired certificate means the person should not be doing the job at all."},{"id":"IA-HR-04","industry":["cross"],"process":"Human Resources","subprocess":"Employee Relations, Grievance and Discipline","risk":"Grievances and disciplinary matters are handled inconsistently, generating legal claims and eroding trust.","rating":"Medium","risk_category":"Compliance","audit_objective":"Assess whether employee relations cases are handled fairly, consistently and promptly.","what_to_review":["Case logging, ownership and timeliness","Investigation independence, particularly for senior subjects","Consistency of outcomes for comparable conduct","Legal claims, settlements and their causes","Trends by manager, function and location"],"procedures":["Review a sample of cases for procedural fairness and timeliness against policy.","Compare outcomes for comparable conduct across seniority levels and locations.","Analyse claims and settlements for recurring causes and whether root causes were addressed.","Analyse case volumes by manager for concentration."],"red_flags":["Cases open for months","Different outcomes for the same conduct","Settlements with non-disclosure and no root cause work","One manager generating most grievances"],"evidence":["Case management records","Settlement agreements","Legal claim records","Manager-level case analysis"],"kpis":["Days to close cases","Outcome consistency","Claims and settlement cost"],"lens":["ia"],"plain":"Handling grievances inconsistently is how employment claims and tribunal costs are created."},{"id":"IA-HR-05","industry":["cross"],"process":"Human Resources","subprocess":"Diversity, Equity and Pay Equity","risk":"Pay and progression differ across comparable roles without justification, creating legal exposure and reputational risk.","rating":"Medium","risk_category":"Compliance","audit_objective":"Assess whether pay and progression decisions are equitable and defensible.","what_to_review":["Pay analysis across comparable roles by gender and other protected characteristics","Progression and promotion rates across groups","Starting salary determination and negotiation effects","Reporting obligations on pay gaps","Action taken on identified disparities"],"procedures":["Analyse pay for comparable roles and test the explanations offered for material dispersion.","Analyse promotion and progression rates across groups.","Test whether starting salaries are set by band or by negotiation, which tends to embed disparity.","Test the accuracy of any published pay gap reporting."],"red_flags":["Disparities explained as \"experience\" with no data","Progression concentrated in one group","Starting salaries set entirely by negotiation","Published figures that cannot be reconstructed"],"evidence":["Payroll and role data","Promotion records","Pay gap reporting and calculations","Remuneration policy"],"kpis":["Pay dispersion in comparable roles","Progression rate by group","Actions on disparities"],"lens":["ia"],"plain":"Unexplained pay differences between people doing the same job are a legal exposure and a retention problem."},{"id":"IA-HR-06","industry":["cross"],"process":"Human Resources","subprocess":"Employee Data Privacy and HR Systems","risk":"Employee personal data is over-retained, over-shared or accessible to people with no business need.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm employee data is protected, minimised and retained lawfully.","what_to_review":["Access to HR and payroll data by role","Retention of records for leavers and unsuccessful candidates","Sharing with benefit providers, insurers and other third parties","Special category data — health, background checks","Monitoring of employees and its lawful basis"],"procedures":["Test who can access sensitive employee data and whether the access is justified by role.","Test retention by identifying leaver and candidate records past the retention period.","Reconcile third parties receiving employee data to agreements and lawful basis.","Test the basis and transparency of any employee monitoring."],"red_flags":["Managers with access to the whole workforce record","Candidate data retained indefinitely","Health data stored in general HR folders","Monitoring introduced without notice to staff"],"evidence":["HR system access listings","Retention schedules and deletion evidence","Third-party agreements","Monitoring notices"],"kpis":["Access appropriate to role","Records past retention","Third parties with agreements"],"lens":["ia"],"plain":"Employee records contain some of the most sensitive data a company holds, including health information."},{"id":"IA-HR-07","industry":["cross"],"process":"Human Resources","subprocess":"Succession and Key Person Risk","risk":"Critical roles have no identified successor, so a departure creates immediate operational and control failure.","rating":"Medium","risk_category":"Strategic","audit_objective":"Assess whether key person dependency is identified and mitigated.","what_to_review":["Identification of critical roles and single points of dependency","Succession plans and their realism","Documentation and cross-training for critical activities","Retention risk for key individuals","Handover quality when key staff leave"],"procedures":["Identify critical roles and test whether a named, ready successor exists.","Test whether critical processes are documented sufficiently for another person to perform them.","Review recent departures of key staff and assess the quality of handover.","Assess whether mandatory leave is applied in roles where it would surface concealment."],"red_flags":["Succession plans naming the same person for several roles","Critical processes with no documentation","Handovers of a single day","Key staff never taking leave"],"evidence":["Succession plans","Critical role assessments","Process documentation","Leave records"],"kpis":["Critical roles with successor","Documented critical processes","Key staff leave taken"],"lens":["ia"],"plain":"If only one person knows how something critical works, their resignation is an operational incident."},{"id":"IA-BNK-05","industry":["banking"],"process":"Credit & Lending","subprocess":"Credit Origination and Documentation","risk":"Facilities are drawn on incomplete or unenforceable documentation, so the bank cannot enforce its rights on default.","rating":"High","risk_category":"Compliance","audit_objective":"Confirm credit documentation is complete, executed and enforceable before drawdown.","what_to_review":["Completeness of the credit file — agreements, security, conditions precedent","Execution and legal review of non-standard documentation","Conditions precedent satisfied before disbursement","Document custody and retrieval","Covenant terms recorded in the monitoring system"],"procedures":["Sample facilities and test the credit file for executed agreements and evidence of conditions precedent.","Test that non-standard terms received legal review before execution.","Test whether covenants in the agreement were loaded into the monitoring system, and completely.","Test document custody by requesting original security documents for a sample."],"red_flags":["Drawdowns before conditions precedent satisfied","Covenants in the agreement absent from monitoring","Original documents that cannot be located","Non-standard terms agreed without legal review"],"evidence":["Credit files and agreements","Disbursement records","Covenant monitoring system extract","Document custody records"],"kpis":["Files complete","CPs satisfied pre-drawdown","Covenants loaded to monitoring"],"lens":["ia"],"plain":"If the paperwork behind a loan is incomplete, the bank may not be able to enforce it in court when the borrower stops paying."},{"id":"IA-BNK-06","industry":["banking"],"process":"Credit & Lending","subprocess":"Collateral Valuation and Perfection","risk":"Security is unperfected or valued on stale information, so realisable value on default is far below what is recorded.","rating":"High","risk_category":"Financial","audit_objective":"Confirm collateral is legally perfected and valued on a current, independent basis.","what_to_review":["Legal perfection — registration, charges, priority","Valuation frequency by asset class and independence of valuers","Loan-to-value monitoring and breach action","Insura
